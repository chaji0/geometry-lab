'use strict';
/* ═════════ 포물선의 활용 — three.js(WebGL) 버전

   ═════════ */

const stage = $id('stage'), hud = $id('hud'), ctrl = $id('ctrl'), carRow = $id('carRow');
const fmt = (v,d) => v.toFixed(d===undefined?2:d);

/* 상태 */
const solar = { tilt:34, p:0.8, depth:1, hPot:0.95, potR:0.1, done:false };   // 깊이·냄비 반지름 고정
const SUN_EL = 55;
const CARS = {

            [1.12, 1.31, 0.28, 0.98], [4.30, 1.31, 0.28, 0.98], [4.52, 1.28, 0.32, 0.96],

  },

    paint: 0xc5cad0, clear: 0.95, L: 4.62, W: 1.809, H: 1.48, belt: 0.96,
    bodyExp: 3.4, roofExp: 4.2, tumble: 0.12, roofGlass: false, roofW: 0.58,
    glassBands: [[0.04, 0.34], [0.4, 0.64], [0.7, 0.94]],
    wheelR: 0.325, axles: [1.00, 3.70], lampY: 0.80, lampZ: 0.62,
    lamp: "sweep", lampR: 0.075, tail: "bar", rim: "silver", spokes: 5,
    lower: [[0.00, 0.70, 0.30, 0.58], [0.28, 0.86, 0.22, 0.78], [0.75, 0.94, 0.20, 0.86],
            [1.25, 0.98, 0.20, 0.92], [2.10, 1.00, 0.22, 0.96], [3.00, 1.00, 0.22, 0.97],
            [3.60, 1.02, 0.24, 0.95], [4.10, 1.10, 0.26, 0.92], [4.45, 1.08, 0.30, 0.88],

            [3.30, 1.35, 0.80], [3.70, 1.09, 0.62]]
  }
};
/* 전구를 초점보다 살짝 뒤(−)에서 시작 → 학생이 슬라이더로 F를 찾는다 */
const head = { car:'p911', hp:0.06, hh:0.05, off:-0.012, cap:'차광 캡', showCar:true, done:false };
let tab = 'solar';

/* ── 물리: 집광률 (거울에 닿은 빛 중 냄비에 모인 비율, 광선 추적) ── */
const M = {
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  norm(a){ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
  reflect(d,n){ const k=2*this.dot(d,n); return [d[0]-k*n[0], d[1]-k*n[1], d[2]-k*n[2]]; }
};
function potHitLocal(o, d, rp, hp, hh){
  let best = Infinity;
  const a = d[0]*d[0] + d[2]*d[2];
  if(a > 1e-9){
    const b = 2*(o[0]*d[0] + o[2]*d[2]);
    const c = o[0]*o[0] + o[2]*o[2] - rp*rp;
    const disc = b*b - 4*a*c;
    if(disc >= 0){
      const sq = Math.sqrt(disc);
      for(const t of [(-b-sq)/(2*a), (-b+sq)/(2*a)])
        if(t > 1e-4 && t < best && Math.abs(o[1] + t*d[1] - hp) <= hh) best = t;
    }
  }
  if(Math.abs(d[1]) > 1e-9){
    for(const yc of [hp-hh, hp+hh]){
      const t = (yc - o[1]) / d[1];
      if(t > 1e-4 && t < best){
        const xx = o[0]+t*d[0], zz = o[2]+t*d[2];
        if(xx*xx + zz*zz <= rp*rp) best = t;
      }
    }
  }
  return best;
}
function solarLocalSun(){
  const e = solar.tilt*Math.PI/180, se = SUN_EL*Math.PI/180;
  const A=[Math.cos(e),Math.sin(e),0], U1=[-Math.sin(e),Math.cos(e),0], U2=[0,0,1];
  const S=[Math.cos(se),Math.sin(se),0];
  return { d:[-M.dot(S,U1), -M.dot(S,A), -M.dot(S,U2)], R:Math.sqrt(4*solar.p*solar.depth) };
}
function solarHeat(){
  const {d,R} = solarLocalSun();
  const p=solar.p, rp=solar.potR, hh=rp*0.75, hp=solar.hPot;
  let reach=0, cap=0;
  const N=30;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const x=-R+2*R*(i+0.5)/N, z=-R+2*R*(j+0.5)/N;
    if(x*x+z*z > R*R) continue;
    const nl = M.norm([-x/(2*p), 1, -z/(2*p)]);
    const dn = M.dot(d, nl);
    if(dn >= 0) continue;
    const P=[x,(x*x+z*z)/(4*p),z];
    if(potHitLocal(P,[-d[0],-d[1],-d[2]],rp,hp,hh) < Infinity) continue;   // 냄비 그림자
    reach += -dn;
    if(potHitLocal(P, M.reflect(d,nl), rp, hp, hh) < Infinity) cap += -dn;
  }
  return reach ? Math.floor(cap/reach*100 + 1e-6) : 0;
}
function headSpread(){ return Math.abs(head.off) < 1e-9 ? 0 : Math.min(28, Math.abs(head.off)/head.hp*44); }

/* ── 우측 단면 패널 (클로드 디자인 diagram 이식 + 냄비 위치 표시) ── */
function updateSide(heat){
  const P=solar.p, Hd=solar.depth, rp=solar.potR, hp=solar.hPot;
  const R=Math.sqrt(4*P*Hd);
  const W2=460, Hh=520;
  const sc=Math.min((W2-150)/(Hd+P+0.45), (Hh-90)/(2*R));
  const ox=60+P*sc, oy=Hh/2;
  const X=x=>ox+x*sc, Y=y=>oy-y*sc;
  const par=y=>y*y/(4*P);
  let g='';
  for(let k=-8;k<=8;k++){
    const gx=X(k*0.5); if(gx>6&&gx<W2-6) g+=`<path d="M ${gx.toFixed(1)} 12 L ${gx.toFixed(1)} ${Hh-12}" stroke="#eef2f6" fill="none"/>`;
    const gy=Y(k*0.5); if(gy>12&&gy<Hh-12) g+=`<path d="M 12 ${gy.toFixed(1)} L ${W2-12} ${gy.toFixed(1)}" stroke="#eef2f6" fill="none"/>`;
  }
  let curve='';
  for(let i2=0;i2<=60;i2++){
    const y=-R+2*R*i2/60;
    curve+=(i2?' L ':'M ')+X(par(y)).toFixed(1)+' '+Y(y).toFixed(1);
  }
  /* 실제 태양 방향(접시 기울기 vs 태양 고도)을 단면에 반영 */
  const dL = solarLocalSun().d;                      // 접시 좌표계 입사 방향
  let sd = { x: dL[1], y: dL[0] };                   // 단면 2D: x=축 방향, y=반지름 방향
  { const l = Math.hypot(sd.x, sd.y) || 1; sd = { x: sd.x/l, y: sd.y/l }; }
  const potBox = { x0: hp-rp*0.85, x1: hp+rp*0.85, y0: -rp*0.65, y1: rp*0.65 };
  const rectHit = (o, dir) => {                      // 광선-냄비 사각형 교차 (월드)
    let t0 = 1e-6, t1 = Infinity;
    for(const [oc,dc,lo,hi] of [[o.x,dir.x,potBox.x0,potBox.x1],[o.y,dir.y,potBox.y0,potBox.y1]]){
      if(Math.abs(dc) < 1e-9){ if(oc < lo || oc > hi) return Infinity; continue; }
      let ta = (lo-oc)/dc, tb = (hi-oc)/dc;
      if(ta > tb){ const tmp = ta; ta = tb; tb = tmp; }
      t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
    }
    return t0 <= t1 ? t0 : Infinity;
  };
  const clipBox = (sx, sy, dx, dy) => {              // 화면 상자 [16..W2-16]×[12..Hh-12] 경계까지 t
    let t = Infinity;
    if(dx > 1e-9) t = Math.min(t, (W2-16-sx)/dx); else if(dx < -1e-9) t = Math.min(t, (16-sx)/dx);
    if(dy > 1e-9) t = Math.min(t, (Hh-12-sy)/dy); else if(dy < -1e-9) t = Math.min(t, (12-sy)/dy);
    return t === Infinity ? 0 : Math.max(0, t);
  };
  let rays='';
  for(let k=0;k<9;k++){
    const y=-R*0.94+1.88*R*k/8, x=par(y);
    const n0 = { x:1, y:-y/(2*P) };
    { const l = Math.hypot(n0.x,n0.y); n0.x/=l; n0.y/=l; }
    const dn = sd.x*n0.x + sd.y*n0.y;
    if(dn >= -1e-4) continue;                        // 뒷면으로 들어오는 광선 제외
    if(rectHit({x,y}, {x:-sd.x, y:-sd.y}) < Infinity) continue;   // 냄비 그림자
    const sx = X(x), sy = Y(y);
    const dsx = sd.x*sc, dsy = -sd.y*sc;             // 화면 방향
    const dl2 = Math.hypot(dsx,dsy)||1;
    const tin = clipBox(sx, sy, -dsx/dl2, -dsy/dl2);
    rays+=`<path d="M ${(sx-dsx/dl2*tin).toFixed(1)} ${(sy-dsy/dl2*tin).toFixed(1)} L ${sx.toFixed(1)} ${sy.toFixed(1)}" stroke="#efa41f" stroke-width="2" stroke-dasharray="9 6" fill="none"/>`;
    const rf = { x: sd.x - 2*dn*n0.x, y: sd.y - 2*dn*n0.y };
    const tp = rectHit({x,y}, rf);
    let ex, ey;
    if(tp < Infinity){ ex = X(x+rf.x*tp); ey = Y(y+rf.y*tp); }
    else {
      const rsx = rf.x*sc, rsy = -rf.y*sc;
      const rl2 = Math.hypot(rsx,rsy)||1;
      const tout = clipBox(sx, sy, rsx/rl2, rsy/rl2);
      ex = sx + rsx/rl2*tout; ey = sy + rsy/rl2*tout;

  }

   `<svg viewBox="0 0 ${W2} ${Hh}" preserveAspectRatio="xMidYMid meet" style="overflow:visible">

      <text x="${(X(0)-18).toFixed(1)}" y="${(Y(0)+18).toFixed(1)}" font-size="14" fill="#8d99a6">O</text>

/* ── 우측 단면 패널: 전조등 (전구 위치 실험 — 그림 A·B·C) ── */
function updateSideHead(){
  const P=head.hp, Hd=head.hh, off=head.off;
  const R=Math.sqrt(4*P*Hd);
  const W2=460, Hh=520;
  const sc=Math.min((W2-150)/(Hd+P+0.1), (Hh-90)/(2*R));
  const ox=60+P*sc, oy=Hh/2;
  const X=x=>ox+x*sc, Y=y=>oy-y*sc;
  const par=y=>y*y/(4*P);
  let g='';
  for(let k=-8;k<=8;k++){
    const gx=X(k*0.05); if(gx>6&&gx<W2-6) g+=`<path d="M ${gx.toFixed(1)} 12 L ${gx.toFixed(1)} ${Hh-12}" stroke="#eef2f6" fill="none"/>`;
    const gy=Y(k*0.05); if(gy>12&&gy<Hh-12) g+=`<path d="M 12 ${gy.toFixed(1)} L ${W2-12} ${gy.toFixed(1)}" stroke="#eef2f6" fill="none"/>`;
  }
  let curve='';
  for(let i2=0;i2<=60;i2++){
    const y=-R+2*R*i2/60;
    curve+=(i2?' L ':'M ')+X(par(y)).toFixed(1)+' '+Y(y).toFixed(1);
  }
  /* 광선: 전구(F+오차) → 반사면 → 반사되어 나가는 실제 방향 (off<0 발산 · 0 평행 · off>0 수렴) */
  const clipBox=(sx,sy,dx2,dy2)=>{
    let t=Infinity;
    if(dx2>1e-9) t=Math.min(t,(W2-16-sx)/dx2); else if(dx2<-1e-9) t=Math.min(t,(16-sx)/dx2);
    if(dy2>1e-9) t=Math.min(t,(Hh-12-sy)/dy2); else if(dy2<-1e-9) t=Math.min(t,(12-sy)/dy2);
    return t===Infinity?0:Math.max(0,t);
  };
  const bx=X(P+off), by=Y(0);
  let rays='';
  const ends=[];                                    // 빛다발 영역용 (반사점·끝점)
  for(let k=0;k<9;k++){
    const y=-R*0.94+1.88*R*k/8, x=par(y);
    const px=X(x), py=Y(y);
    const dx=x-(P+off), dy=y;
    const nx=1, ny=-y/(2*P);
    const nl=Math.hypot(nx,ny);
    const dot=(dx*nx/nl + dy*ny/nl);
    const rx=dx-2*dot*nx/nl, ry=dy-2*dot*ny/nl;
    const rsx=rx*sc, rsy=-ry*sc;
    const rl2=Math.hypot(rsx,rsy)||1;
    const tout=clipBox(px,py,rsx/rl2,rsy/rl2);
    const ex=px+rsx/rl2*tout, ey=py+rsy/rl2*tout;
    ends.push({px,py,ex,ey});
    rays+=`<path d="M ${bx.toFixed(1)} ${by.toFixed(1)} L ${px.toFixed(1)} ${py.toFixed(1)}" stroke="#efa41f" stroke-width="2" stroke-dasharray="9 6" fill="none"/>`;
    rays+=`<path d="M ${px.toFixed(1)} ${py.toFixed(1)} L ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="#f07a1e" stroke-width="2" fill="none"/>`;
  }
  /* 빛다발 (가장 바깥 두 광선 사이) */
  let beam='';
  if(ends.length>=2){
    const a2=ends[0], b2=ends[ends.length-1];
    beam=`<path d="M ${a2.px.toFixed(1)} ${a2.py.toFixed(1)} L ${a2.ex.toFixed(1)} ${a2.ey.toFixed(1)} L ${b2.ex.toFixed(1)} ${b2.ey.toFixed(1)} L ${b2.px.toFixed(1)} ${b2.py.toFixed(1)} Z" fill="#fbbf24" opacity="0.12"/>`;
  }
  rays = beam + rays;
  const fx=X(P);
  $id('sSvgWrap').innerHTML =
   `<svg viewBox="0 0 ${W2} ${Hh}" preserveAspectRatio="xMidYMid meet" style="overflow:visible">
      <rect x="0" y="0" width="${W2}" height="${Hh}" rx="14" fill="#fff" stroke="#e6ebf0"/>${g}
      <path d="M 16 ${Y(0).toFixed(1)} L ${W2-16} ${Y(0).toFixed(1)}" stroke="#b6c0ca" stroke-width="1.5" fill="none"/>
      <path d="M ${X(0).toFixed(1)} 16 L ${X(0).toFixed(1)} ${Hh-16}" stroke="#b6c0ca" stroke-width="1.5" fill="none"/>
      <path d="M ${X(-P).toFixed(1)} 24 L ${X(-P).toFixed(1)} ${Hh-24}" stroke="#9aa7b4" stroke-width="1.5" stroke-dasharray="7 6" fill="none"/>
      ${rays}
      <path d="${curve}" stroke="#2f3b48" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="${fx.toFixed(1)}" cy="${by.toFixed(1)}" r="5" fill="none" stroke="#e0442c" stroke-width="2.5"/>
      <text x="${(fx+2).toFixed(1)}" y="${(by+24).toFixed(1)}" font-size="14" font-weight="700" fill="#c8371f" text-anchor="middle">F</text>
      <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="16" fill="#f7c948" opacity="0.25"/>
      <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="6" fill="#f0a41f"/>
      <text x="${bx.toFixed(1)}" y="${(by-16).toFixed(1)}" font-size="13" font-weight="700" fill="#b07a10" text-anchor="middle">전구</text>
      <text x="${(X(0)-18).toFixed(1)}" y="${(Y(0)+18).toFixed(1)}" font-size="14" fill="#8d99a6">O</text>
      <text x="${(X(-P)-6).toFixed(1)}" y="40" font-size="13" fill="#7c8994" text-anchor="end">준선 x = −${P.toFixed(2)}</text>
      <text x="${W2-165}" y="${Hh-24}" font-size="17" fill="#2f3b48" font-style="italic">y² = ${(4*P).toFixed(2)} x</text>
    </svg>`;
  $id('cDia').textContent=(2*R).toFixed(3)+' m';
  $id('cRatio').textContent=headSpread().toFixed(1)+'°';
  $id('cPot').textContent=P.toFixed(3)+' m';
}

    const pct = aligned ? 100 : Math.max(0, Math.min(99, Math.round(100-sp*6)));
    const regime = aligned ? '전구가 초점 F에 딱! → 축과 평행하게 멀리 뻗어요'
      : off<0 ? '전구가 초점보다 <b style="font-size:13.5px">뒤</b> → 빛이 퍼져요 (발산)'
              : '전구가 초점보다 <b style="font-size:13.5px">앞</b> → 빛이 한 점으로 모여요 (수렴)';

      `${regime}`+
      `<div id="gaugeBar"><div id="gaugeFill" style="width:${Math.max(4,pct)}%"></div></div>`;
    updateSideHead();
    if(pct>=100 && !head.done){ head.done=true; if(window.GEO_task) GEO_task('head'); }
    return pct;
  }
}

let T=null, renderer=null, camera=null;

let steamSprites=[];
const orbitSolar = { radius:12.5, theta:0.66, phi:1.44, target:[1.7,2.7,0] };
const orbitHead  = { radius:1.3, theta:0.75, phi:1.30, target:[0.42,0.80,-0.62] };
function orbit(){ return tab==='solar' ? orbitSolar : orbitHead; }

async function loadTHREE(){
  try { return await import('./three.module.js'); }
  catch(e){
    if(window.__THREE_SRC){
      const u = URL.createObjectURL(new Blob([window.__THREE_SRC], {type:'text/javascript'}));
      return await import(u);
    }
    throw e;
  }
}
function glow(colStops){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64);
  for(const [o,col] of colStops) g.addColorStop(o, col);
  x.fillStyle = g; x.fillRect(0,0,128,128);
  return new T.CanvasTexture(c);
}
function textSprite(txt, color, size){
  const c = document.createElement('canvas'); c.width=128; c.height=64;
  const x = c.getContext('2d');
  x.font = '700 44px Georgia,serif'; x.fillStyle = color;
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText(txt, 64, 32);
  const sp = new T.Sprite(new T.SpriteMaterial({ map:new T.CanvasTexture(c), transparent:true, depthWrite:false }));
  sp.scale.set(size*2, size, 1);
  return sp;
}
function applyCamera(){
  const o = orbit();
  camera.position.set(
    o.target[0] + o.radius*Math.sin(o.phi)*Math.sin(o.theta),
    o.target[1] + o.radius*Math.cos(o.phi),
    o.target[2] + o.radius*Math.sin(o.phi)*Math.cos(o.theta));
  camera.lookAt(o.target[0], o.target[1], o.target[2]);
}
function disposeGroup(g){
  while(g.children.length){
    const ch = g.children.pop();
    ch.traverse ? ch.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }) : 0;
  }
}

/* ── 태양열 씬 (클로드 디자인 원본 이식) ── */
function buildSolarScene(){

  sunLight = dir;

  const ground = new T.Mesh(new T.PlaneGeometry(300,300), new T.MeshLambertMaterial({ color:0xf2ffa4 }));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);
  const grid = new T.GridHelper(30,15,0x9ed44a,0xa8d94e);
  grid.position.y = 0.012;

  for(let i=0;i<2;i++){
    const leg = new T.Mesh(new T.BoxGeometry(2.6,0.09,0.14), metal);
    leg.position.y = 0.05;
    leg.rotation.y = i ? Math.PI/4 : -Math.PI/4;
    leg.castShadow = true;
    scene.add(leg);
  }
  dishGroup = new T.Group();

function rebuildSolar(){
  const v = solar;
  const R = Math.sqrt(4*v.p*v.depth);
  const tiltRad = v.tilt*Math.PI/180, sunRad = SUN_EL*Math.PI/180;
  disposeGroup(dishGroup);
  dishGroup.rotation.set(0,0,-(Math.PI/2 - tiltRad));

  const prof=[];
  for(let i=0;i<=26;i++){ const r=R*i/26; prof.push(new T.Vector2(r, r*r/(4*v.p))); }
  const mirror = new T.Mesh(new T.LatheGeometry(prof,72), new T.MeshStandardMaterial({
    color:0xeaeff4, metalness:0.15, roughness:0.5, side:T.DoubleSide }));
  mirror.castShadow = true;
  dishGroup.add(mirror);
  const coarse=[];
  for(let i=0;i<=6;i++){ const r=R*i/6; coarse.push(new T.Vector2(r, r*r/(4*v.p))); }
  dishGroup.add(new T.Mesh(new T.LatheGeometry(coarse,18), new T.MeshBasicMaterial({
    color:0x8d99a5, wireframe:true, transparent:true, opacity:0.32 })));

  const rp = v.potR, hp = v.hPot;
  const potMat = new T.MeshStandardMaterial({ color:0xa63318, metalness:0.3, roughness:0.5 });
  const pot = new T.Mesh(new T.CylinderGeometry(rp, rp*0.86, rp*1.5, 26), potMat);
  pot.position.y = hp + rp*0.75; pot.castShadow = true;
  dishGroup.add(pot);
  const lid = new T.Mesh(new T.CylinderGeometry(rp*1.08, rp*1.08, 0.03, 26),
    new T.MeshStandardMaterial({ color:0x50241a, roughness:0.6 }));
  lid.position.y = hp + rp*1.53;
  dishGroup.add(lid);
  const arm = new T.Mesh(new T.CylinderGeometry(0.022,0.022,hp,12),
    new T.MeshStandardMaterial({ color:0x4a5158, metalness:0.5, roughness:0.5 }));
  arm.position.y = hp/2;
  dishGroup.add(arm);

  // 초점 F 표시
  const fDot = new T.Mesh(new T.SphereGeometry(0.045,16,12), new T.MeshBasicMaterial({ color:0xe0442c }));
  fDot.position.y = v.p;
  dishGroup.add(fDot);
  const fLb = textSprite('F', '#c8371f', 0.34);
  fLb.position.set(0.25, v.p + 0.12, 0);
  dishGroup.add(fLb);

  // 태양 위치 (월드)
  const sWorld = new T.Vector3(Math.cos(sunRad), Math.sin(sunRad), 0).normalize();
  sunSprite.position.copy(sWorld.clone().multiplyScalar(7)).add(new T.Vector3(0,0.4,0));
  sunLight.position.copy(sWorld.clone().multiplyScalar(22));
  const inv = new T.Matrix4().makeRotationZ(Math.PI/2 - tiltRad);
  const dL3 = sWorld.clone().negate().applyMatrix4(inv).normalize();
  const dL = [dL3.x, dL3.y, dL3.z];

  // 광선 (원본 링 샘플 + 냄비 교차 물리)
  const hh = rp*0.75;
  const dashMat = new T.LineDashedMaterial({ color:0xefa41f, dashSize:0.9, gapSize:0.55, transparent:true, opacity:0.9 });
  const hotMat  = new T.LineBasicMaterial({ color:0xf07a1e, transparent:true, opacity:0.9 });
  const samples = [[0,0]];
  for(const frac of [0.42,0.74,0.95]){
    const count = frac<0.5?6:frac<0.8?10:14;
    for(let k=0;k<count;k++){
      const a=(k/count)*Math.PI*2 + (frac<0.8?0.2:0);
      samples.push([R*frac*Math.cos(a), R*frac*Math.sin(a)]);
    }
  }
  for(const [x,z] of samples){
    const nl = M.norm([-x/(2*v.p), 1, -z/(2*v.p)]);
    const dn = M.dot(dL, nl);
    if(dn >= 0) continue;
    const Pl = [x, (x*x+z*z)/(4*v.p), z];
    if(potHitLocal(Pl, [-dL[0],-dL[1],-dL[2]], rp, hp, hh) < Infinity) continue;
    const rl = M.reflect(dL, nl);
    const Pv = new T.Vector3(...Pl);
    const start = Pv.clone().sub(new T.Vector3(...dL).multiplyScalar(7.5));
    const inLine = new T.Line(new T.BufferGeometry().setFromPoints([start, Pv]), dashMat);
    inLine.computeLineDistances();
    dishGroup.add(inLine);
    const tHit = potHitLocal(Pl, rl, rp, hp, hh);
    const tF = Math.max((new T.Vector3(0,v.p,0)).sub(Pv).dot(new T.Vector3(...rl)), 0.05);
    const L = tHit<Infinity ? tHit : tF;
    dishGroup.add(new T.Line(new T.BufferGeometry().setFromPoints(
      [Pv, Pv.clone().add(new T.Vector3(...rl).multiplyScalar(L))]), hotMat));
  }
  // 김 (100%)
  steamSprites = [];
  if(solarHeat() >= 100){
    for(let k=0;k<3;k++){
      const s = new T.Sprite(new T.SpriteMaterial({
        map: glow([[0,'rgba(255,255,255,0.9)'],[1,'rgba(255,255,255,0)']]), transparent:true, depthWrite:false, opacity:0.8 }));
      s.scale.set(0.16,0.16,1);
      s.userData = { k };
      dishGroup.add(s);
      steamSprites.push(s);
    }
  }
}

/* ── 전조등 씬 (클로드 디자인 v3 이식: 실차 로프트 + 전구 위치 실험) ── */
let carGroup=null, lampGroup=null, glowTex=null, envDay=null, envNight=null;
function buildEnv(night){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,128);
  if(night){
    g.addColorStop(0,'#1b2b4d'); g.addColorStop(0.48,'#0a1225');
    g.addColorStop(0.52,'#141a22'); g.addColorStop(1,'#05070b');
  } else {
    g.addColorStop(0,'#cfeaff'); g.addColorStop(0.5,'#eaf6ff');
    g.addColorStop(0.52,'#dbf3a0'); g.addColorStop(1,'#9cc94a');
  }
  ctx.fillStyle = g; ctx.fillRect(0,0,256,128);
  if(night){
    ctx.fillStyle = 'rgba(255,235,190,0.9)';
    for(let i=0;i<5;i++) ctx.fillRect(20+i*48, 34, 10, 6);
  } else {
    ctx.fillStyle = 'rgba(255,255,240,1)';
    ctx.beginPath(); ctx.arc(70,30,14,0,7); ctx.fill();
  }
  const tex = new T.CanvasTexture(c);
  tex.mapping = T.EquirectangularReflectionMapping;
  const pm = new T.PMREMGenerator(renderer);
  const out = pm.fromEquirectangular(tex).texture;
  pm.dispose(); tex.dispose();
  return out;
}

  const lineMat = new T.MeshBasicMaterial({ color:0xb9c2cb });
  for(let i=0;i<16;i++){
    const dash = new T.Mesh(new T.BoxGeometry(1.5,0.005,0.14), lineMat);
    dash.position.set(2+i*3.2, 0.006, 3.1);
    scene.add(dash);
  }
  carGroup = new T.Group();
  scene.add(carGroup);
  lampGroup = new T.Group();
  scene.add(lampGroup);
  return scene;
}

/* 차체 로프트 헬퍼 (원본 그대로) */
function rows(car, kind){
  const st = kind==='green' ? car.green : car.lower;
  const N = kind==='green' ? 64 : 96;
  const u0 = st[0][0], u1 = st[st.length-1][0];
  const at = u => {
    let i = 0;
    while(i < st.length-2 && st[i+1][0] < u) i++;
    const a = st[i], b = st[i+1];
    const t = Math.min(1, Math.max(0, (u-a[0])/(b[0]-a[0])));
    const s = car.boxy ? t : t*t*(3-2*t);
    return a.map((_,j)=>a[j]+(b[j]-a[j])*s);
  };
  const out = [];
  for(let i=0;i<=N;i++){
    const u = u0+(u1-u0)*i/N, r = at(u);
    out.push(kind==='green'
      ? { u, x:0.1-u, top:r[1], bot:car.belt-0.07, hw:r[2]*car.W/2 }
      : { u, x:0.1-u, top:r[1], bot:r[2], hw:r[3]*car.W/2 });
  }
  const passes = car.boxy ? 1 : 3;
  for(let p2=0;p2<passes;p2++){
    const c = out.map(r=>({ top:r.top, bot:r.bot, hw:r.hw }));
    for(let i=1;i<out.length-1;i++){
      out[i].top = (c[i-1].top + 2*c[i].top + c[i+1].top)/4;
      out[i].bot = (c[i-1].bot + 2*c[i].bot + c[i+1].bot)/4;
      out[i].hw  = (c[i-1].hw  + 2*c[i].hw  + c[i+1].hw )/4;
    }
  }
  return out;
}
function sect(o, row, v, grow){
  const n = o.exp, yc = (row.top+row.bot)/2, a = (row.top-row.bot)/2;
  const cv = Math.cos(v), sv = Math.sin(v);
  const sg = x => (x<0?-1:1);
  const zz = sg(cv)*Math.pow(Math.abs(cv), 2/n);
  const yy = sg(sv)*Math.pow(Math.abs(sv), 2/n);
  const up = Math.max(0, yy);
  const g = grow || 1;
  return [row.x, yc + a*yy*g, row.hw*zz*(1 - o.tumble*up*up)*g];
}
function sheet(rws, s0, s1, Mn, fn){
  const pos = [], idx = [];
  for(const row of rws) for(let j=0;j<=Mn;j++){
    const p2 = fn(row, s0+(s1-s0)*j/Mn);
    pos.push(p2[0], p2[1], p2[2]);
  }
  const stride = Mn+1;
  for(let i=0;i<rws.length-1;i++) for(let j=0;j<Mn;j++){
    const a = i*stride+j, b = a+1, c = a+stride, d = c+1;
    idx.push(a,c,b, b,c,d);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function loft(o, rws, v0, v1, Mn, grow, caps){
  const pos = [], idx = [];
  for(const row of rws) for(let j=0;j<=Mn;j++){
    const p2 = sect(o, row, v0+(v1-v0)*j/Mn, grow);
    pos.push(p2[0], p2[1], p2[2]);
  }
  const stride = Mn+1;
  for(let i=0;i<rws.length-1;i++) for(let j=0;j<Mn;j++){
    const a = i*stride+j, b = a+1, c = a+stride, d = c+1;
    idx.push(a,c,b, b,c,d);
  }
  if(caps){
    for(const [ri,dir] of [[0,1],[rws.length-1,-1]]){
      const base = pos.length/3, row = rws[ri];
      pos.push(row.x, (row.top+row.bot)/2, 0);
      for(let j=0;j<=Mn;j++){
        const p2 = sect(o, row, v0+(v1-v0)*j/Mn, grow);
        pos.push(p2[0], p2[1], p2[2]);
      }
      for(let j=0;j<Mn;j++){
        const a = base+1+j, b = a+1;
        if(dir>0) idx.push(base,b,a); else idx.push(base,a,b);
      }
    }
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function rebuildHead(){
  const v = head, car = CARS[head.car];
  disposeGroup(lampGroup);
  disposeGroup(carGroup);

  const p = v.hp, R = Math.sqrt(4*p*v.hh);
  const lamp = new T.Group();
  lamp.position.set(0.02, car.lampY, -car.lampZ);
  lamp.rotation.z = -Math.PI/2;   // 포물면의 축을 차 앞쪽(+X)으로
  lampGroup.add(lamp);

  const prof = [];
  for(let i=0;i<=24;i++){ const r = R*i/24; prof.push(new T.Vector2(r, r*r/(4*p))); }
  const refl = new T.Mesh(new T.LatheGeometry(prof,64), new T.MeshPhysicalMaterial({
    color:0xf6f9fc, metalness:0.75, roughness:0.14, side:T.DoubleSide, envMapIntensity:2.2 }));
  lamp.add(refl);
  lamp.add(new T.Mesh(new T.TorusGeometry(R,0.008,8,48).rotateX(Math.PI/2),
    new T.MeshStandardMaterial({ color:0x2c3138, metalness:0.7, roughness:0.35 })));

  // 전구: 초점 + 오차
  const bulbY = p + v.off;
  const bulb = new T.Mesh(new T.SphereGeometry(0.012,20,14),
    new T.MeshBasicMaterial({ color:0xfff6d0 }));
  bulb.position.y = bulbY;
  lamp.add(bulb);
  const bulbGlow = new T.Sprite(new T.SpriteMaterial({ map:glowTex, transparent:true, depthWrite:false, opacity:0.95 }));
  bulbGlow.scale.set(0.12,0.12,1);
  bulbGlow.position.y = bulbY;
  lamp.add(bulbGlow);
  const pl = new T.PointLight(0xfff2c8, 2.2, 6, 2);
  pl.position.y = bulbY;
  lamp.add(pl);

  // 초점 F 표시 (전구와 구분되는 빨간 링)
  const fRing = new T.Mesh(new T.TorusGeometry(0.02,0.0035,8,26),
    new T.MeshBasicMaterial({ color:0xe0442c }));
  fRing.rotation.x = Math.PI/2;
  fRing.position.y = p;
  lamp.add(fRing);
  const fLb = textSprite('F', '#ff8a70', 0.07);
  fLb.position.set(0.05, p, 0).applyEuler(lamp.rotation).add(lamp.position);
  lampGroup.add(fLb);

  // 렌즈 유리
  lamp.add(new T.Mesh(new T.CircleGeometry(R,48).rotateX(-Math.PI/2), new T.MeshPhysicalMaterial({
    color:0xdff0ff, transparent:true, opacity:0.16, roughness:0.05, metalness:0, side:T.DoubleSide
  })).translateY(v.hh+0.004));

  // 광선: 전구 → 반사면 → 밖으로
  const S = new T.Vector3(0, bulbY, 0);
  const dimMat = new T.LineBasicMaterial({ color:0xffe9a8, transparent:true, opacity:0.5 });
  const outMat = new T.LineBasicMaterial({ color:0xfff0b8, transparent:true, opacity:0.6 });
  for(const frac of [0.35,0.68,0.95]){
    const count = frac<0.5?6:frac<0.8?8:10;
    for(let k=0;k<count;k++){
      const a = (k/count)*Math.PI*2 + frac;
      const rr = R*frac;
      const Px = rr*Math.cos(a), Pz = rr*Math.sin(a);
      const Py = (Px*Px+Pz*Pz)/(4*p);
      const Pp = new T.Vector3(Px,Py,Pz);
      const n = new T.Vector3(-Px/(2*p), 1, -Pz/(2*p)).normalize();
      const d = Pp.clone().sub(S).normalize();
      const refv = d.clone().sub(n.clone().multiplyScalar(2*d.dot(n))).normalize();
      lampGroup.add(new T.Line(new T.BufferGeometry().setFromPoints(
        [S.clone().applyEuler(lamp.rotation).add(lamp.position),
         Pp.clone().applyEuler(lamp.rotation).add(lamp.position)]), dimMat));
      const w0 = Pp.clone().applyEuler(lamp.rotation).add(lamp.position);
      const w1 = w0.clone().add(refv.clone().applyEuler(lamp.rotation).multiplyScalar(9));
      lampGroup.add(new T.Line(new T.BufferGeometry().setFromPoints([w0,w1]), outMat));
    }
  }

  // 전구 앞 캡: 차광(직접광 차단) / 후방 반사(빛을 뒤로 보내 포물면에서 다시 평행 출사)
  if(head.cap !== '없음'){
    const capR = R*0.2;
    const mirrorCap = head.cap === '후방 반사 캡';
    const cap = new T.Mesh(new T.SphereGeometry(capR,22,12,0,Math.PI*2,0,Math.PI/2),
      mirrorCap
        ? new T.MeshPhysicalMaterial({ color:0xf2f6fa, metalness:0.95, roughness:0.08, side:T.DoubleSide, envMapIntensity:2.2 })
        : new T.MeshStandardMaterial({ color:0x14171b, roughness:0.95, metalness:0.1, side:T.DoubleSide }));
    cap.position.y = bulbY + capR*0.35;
    lamp.add(cap);
    const toWorld = q => q.clone().applyEuler(lamp.rotation).add(lamp.position);
    const blockMat = new T.LineDashedMaterial({ color:mirrorCap?0xffe9a8:0x8a939e, dashSize:0.02, gapSize:0.015, transparent:true, opacity:0.75 });
    const backMat = new T.LineBasicMaterial({ color:0xffd86e, transparent:true, opacity:0.75 });
    for(let k=0;k<6;k++){
      const ang = (k/6)*Math.PI*2;
      const dl = new T.Vector3(Math.cos(ang)*0.3, 1, Math.sin(ang)*0.3).normalize();
      const stop = S.clone().add(dl.clone().multiplyScalar(capR*0.92));
      const l1 = new T.Line(new T.BufferGeometry().setFromPoints([toWorld(S), toWorld(stop)]), blockMat);
      l1.computeLineDistances();
      lampGroup.add(l1);
      if(!mirrorCap) continue;
      // 캡(구면, 중심=광원)에서 정반사 → 광원을 지나 반대편 포물면 → 축과 평행 출사
      // 포물면 교점: a2·t² − 4p·d2y·t − 4p·bulbY = 0  (원본의 부호 오류 수정)
      const d2 = dl.clone().negate();
      const a2 = d2.x*d2.x + d2.z*d2.z, b2 = -4*p*d2.y, c2 = -4*p*bulbY;
      const disc = b2*b2 - 4*a2*c2;
      if(a2 < 1e-9 || disc < 0) continue;
      const t2 = (-b2 + Math.sqrt(disc))/(2*a2);
      if(!(t2 > 0)) continue;
      const Pb = S.clone().add(d2.clone().multiplyScalar(t2));
      const nb = new T.Vector3(-Pb.x/(2*p), 1, -Pb.z/(2*p)).normalize();
      const rb = d2.clone().sub(nb.clone().multiplyScalar(2*d2.dot(nb))).normalize();
      lampGroup.add(new T.Line(new T.BufferGeometry().setFromPoints([toWorld(stop), toWorld(Pb)]), backMat));
      lampGroup.add(new T.Line(new T.BufferGeometry().setFromPoints(
        [toWorld(Pb), toWorld(Pb.clone().add(rb.clone().multiplyScalar(9)))]), backMat));
    }
  }

  // 빛다발 글로우 + 노면 스포트 — tanθ = −오차/p (뒤: 발산 · 초점: 평행 · 앞: 수렴)
  const tanSpread = -v.off/p*0.35;
  const rNear = R*1.15, rFar = Math.max(0.06, rNear + tanSpread*13);
  const cone = new T.Mesh(new T.CylinderGeometry(rFar,rNear,13,30,1,true),
    new T.MeshBasicMaterial({ color:0xffeeb4, transparent:true, opacity:0.05, side:T.DoubleSide, depthWrite:false, blending:T.AdditiveBlending }));
  cone.rotation.z = -Math.PI/2;
  cone.position.set(0.02+6.5, car.lampY, -car.lampZ);
  lampGroup.add(cone);
  const pool = new T.Mesh(new T.PlaneGeometry(13,3.4), new T.MeshBasicMaterial({
    map:glowTex, transparent:true, depthWrite:false, opacity:0.32, blending:T.AdditiveBlending }));
  pool.rotation.x = -Math.PI/2;
  pool.position.set(7.5, 0.02, -car.lampZ);
  lampGroup.add(pool);

  if(head.showCar){
    buildCarBody(car);
    const coverMat = new T.MeshPhysicalMaterial({
      color:0xe8f4ff, transparent:true, opacity:0.16, roughness:0.04, metalness:0,
      side:T.DoubleSide, envMapIntensity:1.6 });
    let cover;
    if(car.lamp === 'bar') cover = new T.Mesh(new T.BoxGeometry(0.05, R*1.5, R*5.4), coverMat);
    else if(car.lamp === 'sweep'){
      cover = new T.Mesh(new T.SphereGeometry(R*1.15,20,12), coverMat);
      cover.scale.set(0.4,0.85,1.7);
    } else cover = new T.Mesh(new T.SphereGeometry(R*1.1,22,14), coverMat);
    cover.position.set(0.08, car.lampY, -car.lampZ);
    lampGroup.add(cover);
  }
}

/* ── 차체: 벨트라인 아래 바디 + 그 위 캐빈, 두 볼륨을 로프트 (원본 그대로) ── */
function buildCarBody(car){
  const body = rows(car,'lower'), cab = rows(car,'green');
  const pick = (rws,u) => rws[Math.max(0, Math.min(rws.length-1,
    Math.round((u-rws[0].u)/(rws[rws.length-1].u-rws[0].u)*(rws.length-1))))];
  const bodyOpt = { exp:car.bodyExp, tumble:car.tumble };

  const paint = new T.MeshPhysicalMaterial({
    color:car.paint, metalness:0.45, roughness:car.boxy?0.32:0.18,
    clearcoat:car.clear, clearcoatRoughness:0.05, envMapIntensity:1.4 });
  const shell = new T.Mesh(loft(bodyOpt, body, 0, Math.PI*2, 56, 1, true), paint);
  shell.castShadow = true; shell.receiveShadow = true;
  carGroup.add(shell);

  // 캐빈: 페인트 볼륨(필러·루프) + 창문 유리 패널
  const glassMat = new T.MeshPhysicalMaterial({
    color:0x080d14, metalness:0.35, roughness:0.05, clearcoat:1,
    envMapIntensity:2.2, transparent:true, opacity:0.96, side:T.DoubleSide });
  const wOf = (row,Y) => {
    const n = car.roofExp, rw = car.roofW;
    const s = Math.pow(Math.max(0, 1-Math.pow(Math.max(0,Y),n)), 1/n);   // Y가 −0으로 떨어지는 부동소수 오차 방어
    return row.hw*(s*(1-rw)+rw);
  };
  const cabPt = (row,s,grow) => {
    const g = grow||1;
    if(s <= 0.42){
      const Y = s/0.42;
      return [row.x, row.bot+(row.top-row.bot)*Y, wOf(row,Y)*g];
    }
    if(s <= 0.58){
      const t = (s-0.42)/0.16, w1 = wOf(row,1)*g;
      return [row.x, row.top+(g-1)*0.01, w1-2*w1*t];
    }
    const Y = 1-(s-0.58)/0.42;
    return [row.x, row.bot+(row.top-row.bot)*Y, -wOf(row,Y)*g];
  };
  const cabin = new T.Mesh(sheet(cab, 0, 1, 46, (r,s)=>cabPt(r,s,1)), paint);
  cabin.castShadow = true;
  carGroup.add(cabin);
  if(car.roofGlass){
    carGroup.add(new T.Mesh(sheet(cab, 0.44, 0.56, 8, (r,s)=>cabPt(r,s,1.006)), glassMat));
  }
  // 창문: 필러 사이 구간마다 측면 유리
  const cu0 = cab[0].u, cu1 = cab[cab.length-1].u;
  for(const [f0,f1] of car.glassBands){
    const seg = cab.filter(r => r.u >= cu0+(cu1-cu0)*f0 && r.u <= cu0+(cu1-cu0)*f1);
    if(seg.length < 3) continue;
    for(const side of [1,-1]){
      carGroup.add(new T.Mesh(sheet(seg, 0, 1, 14, (r,s)=>{
        const Y = 0.1+0.78*s;
        return [r.x, r.bot+(r.top-r.bot)*Y, side*wOf(r,Y)*1.012];
      }), glassMat));
    }
  }
  // 벨트라인 몰딩
  const beltRows = cab.map(r=>({ u:r.u, x:r.x, top:car.belt+0.015, bot:car.belt-0.045, hw:r.hw*1.004 }));
  carGroup.add(new T.Mesh(loft({ exp:car.roofExp, tumble:0 }, beltRows, 0.15, Math.PI-0.15, 20, 1, false),
    new T.MeshStandardMaterial({ color:0x2c3238, metalness:0.8, roughness:0.3, side:T.DoubleSide })));

  // 휠 아치(어두운 개구부) + 바퀴
  const tireMat = new T.MeshStandardMaterial({ color:0x111317, roughness:0.92, metalness:0.03 });
  const rimColor = car.rim==='dark'?0x2f333a:car.rim==='aero'?0x99a2ac:0xc4cad1;
  const rimMat = new T.MeshPhysicalMaterial({ color:rimColor, metalness:1, roughness:car.rim==='dark'?0.3:0.15, envMapIntensity:1.5 });
  const archMat = new T.MeshStandardMaterial({ color:0x0b0d10, roughness:0.9, side:T.DoubleSide });
  for(const au of car.axles){
    const row = pick(body,au), ax = row.x, hw = row.hw;
    for(const sgn of [-1,1]){
      const arch = new T.Mesh(new T.TorusGeometry(car.wheelR*1.12, car.boxy?0.05:0.028, 8, 24, Math.PI), archMat);
      arch.rotation.y = Math.PI/2;
      arch.position.set(ax, car.wheelR, sgn*(hw-0.005));
      carGroup.add(arch);
      if(car.boxy){
        const flare = new T.Mesh(new T.TorusGeometry(car.wheelR*1.22, 0.055, 6, 20, Math.PI),
          new T.MeshStandardMaterial({ color:0x14171b, roughness:0.75 }));
        flare.rotation.y = Math.PI/2;
        flare.position.set(ax, car.wheelR, sgn*(hw+0.02));
        carGroup.add(flare);
      }
      const wheel = new T.Group();
      wheel.position.set(ax, car.wheelR, sgn*(hw-0.10));
      const tire = new T.Mesh(new T.CylinderGeometry(car.wheelR, car.wheelR, 0.24, 30), tireMat);
      tire.rotation.x = Math.PI/2;
      tire.castShadow = true;
      wheel.add(tire);
      const face = new T.Mesh(new T.CylinderGeometry(car.wheelR*0.7, car.wheelR*0.7, 0.25, 26), rimMat);
      face.rotation.x = Math.PI/2;
      wheel.add(face);
      if(car.rim !== 'aero') for(let s=0;s<car.spokes;s++){
        const spoke = new T.Mesh(new T.BoxGeometry(car.wheelR*1.26, 0.04, 0.055), rimMat);
        spoke.rotation.z = s*Math.PI/car.spokes;
        spoke.position.z = sgn*0.125;
        wheel.add(spoke);
      }
      carGroup.add(wheel);
    }
  }

  // 사이드미러
  const mu = car.green[0][0]+0.3, mcab = pick(cab,mu);
  const mw = wOf(mcab, 0.13);
  for(const sgn of [-1,1]){
    const m = new T.Mesh(new T.BoxGeometry(0.08,0.085,0.14), paint);
    m.position.set(0.1-mu, car.belt+0.07, sgn*(mw+0.08));
    carGroup.add(m);
    const arm = new T.Mesh(new T.BoxGeometry(0.04,0.03,0.09), paint);
    arm.position.set(0.1-mu, car.belt+0.05, sgn*(mw+0.02));
    carGroup.add(arm);
  }

  // ── 전조등: 차종별 실제 형상 ──
  const key = head.car;
  const rz = car.lampZ, ly = car.lampY, rL = car.lampR;
  const litMat = new T.MeshBasicMaterial({ color:0xfff8dd });
  const chrome = new T.MeshPhysicalMaterial({ color:0xd9dee4, metalness:1, roughness:0.12, envMapIntensity:1.8 });
  const house = new T.MeshStandardMaterial({ color:0x0a0d11, roughness:0.4, metalness:0.45 });
  const coverMat2 = new T.MeshPhysicalMaterial({ color:0xe8f4ff, transparent:true, opacity:0.18, roughness:0.04, metalness:0, side:T.DoubleSide, envMapIntensity:1.6 });

  // 반사판 컵(오른쪽 렌즈 뒤) — 차종별 크기
  const cupProf = [];
  for(let i=0;i<=18;i++){ const r = rL*i/18; cupProf.push(new T.Vector2(r, r*r/(4*rL*0.55))); }
  const nCups = key==='t'?3:1;
  for(let i=0;i<nCups;i++){
    const cup = new T.Mesh(new T.LatheGeometry(cupProf,36), new T.MeshPhysicalMaterial({
      color:0xf4f8fc, metalness:0.85, roughness:0.1, side:T.DoubleSide, envMapIntensity:2.0 }));
    cup.rotation.z = -Math.PI/2;
    cup.position.set(0.0, ly, rz+(i-(nCups-1)/2)*rL*2.6);
    carGroup.add(cup);
    const b = new T.Mesh(new T.SphereGeometry(0.011,14,10), litMat);
    b.position.set(rL*0.55, ly, cup.position.z);
    carGroup.add(b);
    const pl2 = new T.PointLight(0xfff2c8, 1.5/nCups, 5, 2);
    pl2.position.copy(b.position);
    carGroup.add(pl2);
  }

  if(key === 'p911'){
    // 펜더 위 봉긋한 램프: 링 + 돔 유리 + 4점 DRL
    for(const sgn of [-1,1]){
      const bulge = new T.Mesh(new T.SphereGeometry(0.17,20,14), paint);
      bulge.scale.set(0.75,0.55,0.9);
      bulge.position.set(-0.06, ly-0.03, sgn*rz);
      carGroup.add(bulge);
      const ring = new T.Mesh(new T.TorusGeometry(0.1,0.011,10,36), house);
      ring.rotation.y = Math.PI/2;
      ring.position.set(0.1, ly, sgn*rz);
      carGroup.add(ring);
      if(sgn > 0){
        const disc = new T.Mesh(new T.CircleGeometry(0.088,28), litMat);
        disc.rotation.y = Math.PI/2;
        disc.position.set(0.104, ly, rz);
        carGroup.add(disc);
        for(const [dy,dz] of [[0.045,0.045],[0.045,-0.045],[-0.045,0.045],[-0.045,-0.045]]){
          const dot = new T.Mesh(new T.CircleGeometry(0.016,12), new T.MeshBasicMaterial({ color:0xffffff }));
          dot.rotation.y = Math.PI/2;
          dot.position.set(0.11, ly+dy, rz+dz);
          carGroup.add(dot);
        }
        const dome = new T.Mesh(new T.SphereGeometry(0.1,20,12,0,Math.PI*2,0,Math.PI/2), coverMat2);
        dome.rotation.z = -Math.PI/2;
        dome.scale.set(0.55,1,1);
        dome.position.set(0.1, ly, rz);
        carGroup.add(dome);
      }
    }
  } else if(key === 't'){
    // 주니퍼: 차폭 전체 라이트 바 + 코너 슬림 유닛, 그릴 없는 매끈한 프론트
    const bar = new T.Mesh(new T.BoxGeometry(0.016,0.028,rz*2+0.1), litMat);
    bar.position.set(0.112, ly+0.07, 0);
    carGroup.add(bar);
    for(const sgn of [-1,1]){
      const recess = new T.Mesh(new T.BoxGeometry(0.03,0.055,0.36), house);
      recess.position.set(0.095, ly, sgn*rz);
      carGroup.add(recess);
      if(sgn > 0){
        const slim = new T.Mesh(new T.BoxGeometry(0.014,0.024,0.3), litMat);
        slim.position.set(0.112, ly, rz);
        carGroup.add(slim);
      }
    }
  } else if(key === 'g'){
    // G바겐: 원형 램프 + LED 헤일로 링 + 펜더 방향지시등 + 가로 슬랫 그릴
    for(const sgn of [-1,1]){
      const ring = new T.Mesh(new T.TorusGeometry(0.115,0.014,10,36), chrome);
      ring.rotation.y = Math.PI/2;
      ring.position.set(0.105, ly, sgn*rz);
      carGroup.add(ring);
      const ind = new T.Mesh(new T.BoxGeometry(0.07,0.035,0.1), new T.MeshBasicMaterial({ color:0xffc890 }));
      ind.position.set(-0.05, 1.335, sgn*(pick(body,0.35).hw-0.14));
      carGroup.add(ind);
      if(sgn > 0){
        const halo = new T.Mesh(new T.TorusGeometry(0.088,0.007,8,32), new T.MeshBasicMaterial({ color:0xffffff }));
        halo.rotation.y = Math.PI/2;
        halo.position.set(0.108, ly, rz);
        carGroup.add(halo);
        const disc = new T.Mesh(new T.CircleGeometry(0.08,28), litMat);
        disc.rotation.y = Math.PI/2;
        disc.position.set(0.104, ly, rz);
        carGroup.add(disc);
      }
    }
    for(let i=0;i<4;i++){
      const slat = new T.Mesh(new T.BoxGeometry(0.03,0.03,rz*2-0.34), chrome);
      slat.position.set(0.1, ly-0.1+i*0.07, 0);
      carGroup.add(slat);
    }
  } else {
    // SM3: 코너로 감기는 스웹백 헤드램프 + 프로젝터 렌즈 + 크롬 스트립
    for(const sgn of [-1,1]){
      const swoop = new T.Mesh(new T.SphereGeometry(0.13,20,12), house);
      swoop.scale.set(0.4,0.42,1.75);
      swoop.position.set(0.03, ly, sgn*(rz-0.02));
      carGroup.add(swoop);
      if(sgn > 0){
        const pr = new T.Mesh(new T.TorusGeometry(0.045,0.008,8,24), chrome);
        pr.rotation.y = Math.PI/2;
        pr.position.set(0.096, ly, rz+0.03);
        carGroup.add(pr);
        const disc = new T.Mesh(new T.CircleGeometry(0.04,20), litMat);
        disc.rotation.y = Math.PI/2;
        disc.position.set(0.098, ly, rz+0.03);
        carGroup.add(disc);
        const dot = new T.Mesh(new T.CircleGeometry(0.024,16), new T.MeshBasicMaterial({ color:0xfff2c0 }));
        dot.rotation.y = Math.PI/2;
        dot.position.set(0.085, ly+0.01, rz-0.12);
        carGroup.add(dot);
        const cover = new T.Mesh(new T.SphereGeometry(0.128,20,12), coverMat2);
        cover.scale.set(0.42,0.44,1.78);
        cover.position.set(0.035, ly, rz-0.02);
        carGroup.add(cover);
      }
    }
    const strip = new T.Mesh(new T.BoxGeometry(0.02,0.028,rz*2-0.28), chrome);
    strip.position.set(0.105, ly-0.01, 0);
    carGroup.add(strip);
  }

  // 빔(광추 + 노면 스포트 + 광선) — 오른쪽 램프
  const tanR = -head.off/head.hp*0.35;
  const rn = rL*1.6, rf = Math.max(0.05, rn+tanR*13);
  const rCone = new T.Mesh(new T.CylinderGeometry(rf,rn,13,24,1,true),
    new T.MeshBasicMaterial({ color:0xffeeb4, transparent:true, opacity:0.06, side:T.DoubleSide, depthWrite:false, blending:T.AdditiveBlending }));
  rCone.rotation.z = -Math.PI/2;
  rCone.position.set(6.7, ly, rz);
  carGroup.add(rCone);
  const rayMat = new T.LineBasicMaterial({ color:0xfff0b8, transparent:true, opacity:0.38 });
  const LEN = 9.2;
  for(let i=0;i<6;i++){
    const a = (i/6)*Math.PI*2;
    const dy = Math.sin(a)*rL*0.8;
    const dz = Math.cos(a)*rL*(key==='t'?3.4:0.85);
    const len = Math.hypot(dy,dz)||1;
    carGroup.add(new T.Line(new T.BufferGeometry().setFromPoints([
      new T.Vector3(0.1, ly+dy, rz+dz),
      new T.Vector3(0.1+LEN, ly+dy+dy/len*tanR*LEN, rz+dz+dz/len*tanR*LEN)
    ]), rayMat));
  }
  const rPool = new T.Mesh(new T.PlaneGeometry(13,3.4), new T.MeshBasicMaterial({
    map:glowTex, transparent:true, depthWrite:false, opacity:0.32, blending:T.AdditiveBlending }));
  rPool.rotation.x = -Math.PI/2;
  rPool.position.set(7.5, 0.02, rz);
  carGroup.add(rPool);

  // 앞 범퍼 · 번호판 · 후미등
  const dark = new T.MeshStandardMaterial({ color:0x0d1013, roughness:0.55, metalness:0.3 });
  const nose = body[0];
  if(key !== 't'){
    const intake = new T.Mesh(new T.BoxGeometry(0.055, car.boxy?0.24:0.16, nose.hw*1.45), dark);
    intake.position.set(0.09, nose.bot+(car.boxy?0.2:0.14), 0);
    carGroup.add(intake);
  } else {
    const lip = new T.Mesh(new T.BoxGeometry(0.04,0.05,nose.hw*1.5), dark);
    lip.position.set(0.09, nose.bot+0.05, 0);
    carGroup.add(lip);
  }
  const plate = new T.Mesh(new T.BoxGeometry(0.025,0.11,0.33),
    new T.MeshStandardMaterial({ color:0xe9edf1, roughness:0.6 }));
  plate.position.set(0.115, nose.bot+(car.boxy?0.52:0.38), car.boxy?-0.24:0);
  carGroup.add(plate);

  const tailRow = body[body.length-6];
  const tailMat = new T.MeshBasicMaterial({ color:0xd6231c });
  if(car.tail === 'box'){
    for(const sgn of [-1,1]){
      const t2 = new T.Mesh(new T.BoxGeometry(0.05,0.3,0.13), tailMat);
      t2.position.set(tailRow.x-0.03, car.belt-0.26, sgn*(tailRow.hw-0.1));
      carGroup.add(t2);
    }
  } else {
    const t2 = new T.Mesh(new T.BoxGeometry(0.05,0.07,tailRow.hw*1.5), tailMat);
    t2.position.set(tailRow.x-0.03, tailRow.top-0.22, 0);
    carGroup.add(t2);
  }
  const tGlow = new T.Sprite(new T.SpriteMaterial({ map:glowTex, transparent:true, depthWrite:false, opacity:0.2, color:0xff4530, blending:T.AdditiveBlending }));
  tGlow.scale.set(0.9,0.55,1);
  tGlow.position.set(tailRow.x-0.12, tailRow.top-0.24, 0);
  carGroup.add(tGlow);

  // G바겐 전용 디테일: 루프 레일 · 사이드 스텝 · 스페어 타이어 · 도어 힌지
  if(car.boxy){
    const roofY = car.green[2][1];
    for(const sgn of [-1,1]){
      const rail = new T.Mesh(new T.BoxGeometry(2.9,0.05,0.06), dark);
      rail.position.set(-2.5, roofY+0.03, sgn*(pick(cab,2.6).hw-0.1));
      carGroup.add(rail);
      const step = new T.Mesh(new T.BoxGeometry(2.2,0.06,0.15),
        new T.MeshStandardMaterial({ color:0x8d959e, metalness:0.85, roughness:0.35 }));
      step.position.set(-2.4, 0.44, sgn*(pick(body,2.5).hw+0.05));
      carGroup.add(step);
      for(const hu of [2.05,3.35]){
        const hinge = new T.Mesh(new T.BoxGeometry(0.07,0.09,0.05),
          new T.MeshStandardMaterial({ color:0x2a3038, metalness:0.7, roughness:0.35 }));
        hinge.position.set(0.1-hu, car.belt+0.32, sgn*(pick(cab,hu).hw+0.03));
        carGroup.add(hinge);
      }
    }
    const spare = new T.Mesh(new T.CylinderGeometry(0.36,0.36,0.14,26), dark);
    spare.rotation.z = Math.PI/2;
    spare.position.set(0.1-car.L+0.02, 1.05, 0.14);
    carGroup.add(spare);
  }

  // 접지 그림자
  const scv = document.createElement('canvas');
  scv.width = scv.height = 128;
  const sx = scv.getContext('2d');
  const sg2 = sx.createRadialGradient(64,64,0,64,64,64);
  sg2.addColorStop(0,'rgba(0,0,0,0.72)');
  sg2.addColorStop(0.6,'rgba(0,0,0,0.26)');
  sg2.addColorStop(1,'rgba(0,0,0,0)');
  sx.fillStyle = sg2; sx.fillRect(0,0,128,128);
  const shadow = new T.Mesh(new T.PlaneGeometry(car.L+1.0, car.W+0.8),
    new T.MeshBasicMaterial({ map:new T.CanvasTexture(scv), transparent:true, depthWrite:false }));
  shadow.rotation.x = -Math.PI/2;
  shadow.position.set(0.1-car.L/2, 0.012, 0);
  carGroup.add(shadow);
}

/* 전조등 카메라 프리셋: 램프 클로즈업 / 차 전체 자동 맞춤 */
function applyHeadPreset(){
  /* 항상 전조등(램프)이 화면 중심 — 차체가 생겨도 관점 유지, 살짝만 물러나 차가 보이게 */
  const car = CARS[head.car];
  orbitHead.target = [0.42, car.lampY+0.04, -car.lampZ];
  orbitHead.theta = 0.75; orbitHead.phi = 1.30;
  orbitHead.radius = head.showCar ? 4.2 : 1.3;
  applyCamera();
}

/* 궤도 컨트롤 (원본 방식) */
function bindControls(canvas){
  const pts = new Map();
  let lastDist = 0;
  const dist = ()=>{ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); };
  canvas.addEventListener('pointerdown', e=>{
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2) lastDist=dist();
  });
  canvas.addEventListener('pointermove', e=>{
    const prev=pts.get(e.pointerId);
    if(!prev) return;
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const o=orbit();
    if(pts.size===1){
      o.theta -= dx*0.006;
      o.phi = Math.max(0.22, Math.min(1.5, o.phi - dy*0.005));
    } else if(pts.size===2){
      const d=dist();
      if(lastDist) o.radius = Math.max(0.4, Math.min(40, o.radius*lastDist/d));
      lastDist=d;
    }
    applyCamera();
  });
  const up=e=>{ pts.delete(e.pointerId); lastDist=0; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e=>{
    e.preventDefault();
    const o=orbit();
    o.radius = Math.max(0.4, Math.min(40, o.radius*(1+e.deltaY*0.0012)));
    applyCamera();
  }, {passive:false});
}

/* ── 초기화 ── */
(async function init(){
  try{
    T = await loadTHREE();
  }catch(e){
    $id('glLoad').textContent = '3D 모듈을 불러오지 못했어요. 새로고침 해주세요.';
    return;
  }
  const canvas = $id('cv');
  renderer = new T.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  camera = new T.PerspectiveCamera(40, 1, 0.05, 400);
  glowTex = glow([[0,'rgba(255,252,214,1)'],[0.26,'rgba(255,226,90,0.95)'],[0.55,'rgba(255,205,60,0.32)'],[1,'rgba(255,200,60,0)']]);
  envDay = buildEnv(false);
  envNight = buildEnv(true);
  sceneSolar = buildSolarScene();
  sceneSolar.environment = envDay;
  sceneHead  = buildHeadScene();
  sceneHead.environment = envNight;
  rebuildSolar(); rebuildHead();
  bindControls(canvas);
  const doResize = ()=>{
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/Math.max(h,1);
    camera.updateProjectionMatrix();
  };
  new ResizeObserver(doResize).observe(stage);
  doResize();
  applyCamera();
  $id('glLoad').style.display='none';
  hud.style.display='block';
  updateHud();
  let t0 = performance.now();
  renderer.setAnimationLoop(()=>{
    const t = performance.now()-t0;
    for(const s of steamSprites){
      const ph = (t*0.00045 + s.userData.k*0.33) % 1;
      s.position.set(Math.sin(ph*9 + s.userData.k)*0.05,
        solar.hPot + solar.potR*1.6 + ph*0.55, 0.02*s.userData.k);
      s.material.opacity = 0.85*(1-ph);
      s.scale.setScalar(0.14 + ph*0.2);
    }
    renderer.render(tab==='solar'?sceneSolar:sceneHead, camera);
  });
})();
buildCars();
setTab('solar');
</script>
