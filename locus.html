<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* 입장 가드 */
if (localStorage.getItem('geoAppOk') !== '1') location.replace('index.html');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="자취 연습">
<title>지오지브라로 이차곡선 자취 그리기 — 연습용</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    background:#f1f5fb; color:#1e293b; display:flex; flex-direction:column;
  }
  i, .rm { font-family:Georgia,'Times New Roman',serif; }
  header {
    padding:9px 16px 7px; background:#fff; border-bottom:1px solid #e2e8f0;
    display:flex; align-items:baseline; gap:11px; flex-wrap:wrap;
  }
  header h1 { font-size:17.5px; color:#0f172a; letter-spacing:-.01em; }
  header .sub { font-size:12.5px; color:#64748b; }

  /* ── 탭 (깔끔한 알약형) ── */
  #tabs { display:flex; gap:9px; padding:9px 16px 9px; background:#fff; border-bottom:1px solid #e2e8f0; }
  #tabs button {
    display:flex; align-items:center; gap:8px;
    padding:8px 20px 8px 16px; font-size:14.5px; font-weight:800; border-radius:999px; cursor:pointer;
    border:none; background:#f1f5f9; color:#475569; font-family:inherit; transition:all .13s;
  }
  #tabs button:hover { background:#e2e8f0; }
  #tabs button .dt { width:9px; height:9px; border-radius:50%; background:currentColor; flex:none; }
  #tabs button[data-t="para"] .dt { background:#1d6fa5; }
  #tabs button[data-t="ell"]  .dt { background:#a78bfa; }
  #tabs button[data-t="hyp"]  .dt { background:#f59e0b; }
  #tabs button.on { background:#12608f; color:#fff; }
  #tabs button.on .dt { background:#fff !important; }

  #main { flex:1; min-height:0; display:flex; --sbw:380px; }

  /* ── 왼쪽: 단계 ── */
  #steps {
    width:var(--sbw,380px); flex:none; background:#fff; border-right:1px solid #e2e8f0;
    padding:13px 15px; overflow-y:auto;
  }
  #goal {
    border:1.5px solid #bae6fd; background:#f0f9ff; border-radius:12px;
    padding:10px 13px; font-size:13px; color:#0c4a6e; line-height:1.65; margin-bottom:10px;
  }
  #goal b { color:#075985; }
  .stepRow {
    display:flex; gap:10px; align-items:flex-start; padding:9px 12px; margin-bottom:7px;
    border:1.5px solid #e2e8f0; border-radius:12px; background:#fbfdff; cursor:pointer;
    transition:all .13s;
  }
  .stepRow:hover { border-color:#93c5fd; }
  .stepRow.cur { border-color:#0284c7; background:#eff8ff; box-shadow:0 2px 10px rgba(2,132,199,.13); }
  .stepRow.done .num { background:#16a34a; }
  .stepRow .num {
    flex:none; width:23px; height:23px; border-radius:50%; background:#94a3b8; color:#fff;
    font-size:12.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .stepRow .bd { flex:1; min-width:0; }
  .stepRow .tool {
    display:inline-block; font-size:11.5px; font-weight:800; padding:2px 8px; border-radius:7px;
    background:#ede9fe; color:#6d28d9; margin-bottom:3px;
  }
  .stepRow .tool.pt { background:#dcfce7; color:#15803d; }
  .stepRow .tool.ln { background:#dbeafe; color:#1d4ed8; }
  .stepRow .tool.sp { background:#ffedd5; color:#c2410c; }
  .stepRow .txt { font-size:13.4px; color:#334155; line-height:1.6; word-break:keep-all; }
  .stepRow .txt b { color:#0f172a; }
  #whyBox {
    border:1.5px solid #fecaca; background:#fef2f2; border-radius:12px;
    padding:11px 14px; font-size:12.8px; color:#7f1d1d; line-height:1.75; margin-top:5px;
  }
  #whyBox .eq { font-family:Georgia,serif; font-size:14.5px; font-weight:800; color:#b91c1c; }
  #whyBox b { color:#991b1b; }


  /* 화면이 낮을 때 — 7단계가 한눈에 다 보이도록 촘촘하게 */
  @media (max-height: 860px){
    #goal { padding:8px 11px; margin-bottom:8px; font-size:12.4px; line-height:1.55; }
    .stepRow { padding:6px 11px; margin-bottom:5px; }
    .stepRow .tool { font-size:11px; margin-bottom:2px; }
    .stepRow .txt { font-size:12.8px; line-height:1.5; }
    .stepRow .num { width:21px; height:21px; font-size:12px; }
    #whyBox { padding:9px 12px; font-size:12.2px; line-height:1.6; }
    #whyBox .eq { font-size:13.6px; }
    #steps { padding:11px 13px; }
  }

  /* ── 지오지브라 전체화면 ──
     아이패드는 브라우저 주소창 + 앱 상단바 + 페이지 머리말 + 하단바까지 빼고 나면
     지오지브라가 쓸 높이가 350px 넘게 줄어든다. 그러면 지오지브라가 스스로
     대수창을 접어 버리고, 설정 창도 높이가 모자라 아래가 잘린다.
     → 전체화면으로 화면 전체를 내주면 둘 다 해결. */
  /* 컨트롤은 지오지브라 화면 '안'에 두지 않는다 —
     지오지브라가 왼쪽 아래에 도구 도움말을 띄우기 때문에 겹쳐서 가려진다.
     보통 때는 지오지브라 밖(아래 버튼줄 / 오른쪽 아래), 전체화면일 때는 위쪽 띠로 옮긴다. */
  #fsBar { display:flex; gap:7px; align-items:center; min-width:0; }
  #fsBtn, #algBtn, #fsPrev, #fsNext {
    padding:7px 15px; font-size:12.8px; font-weight:800; font-family:inherit; cursor:pointer;
    border:1.5px solid #cbd5e1; border-radius:999px; background:rgba(255,255,255,.94); color:#475569;
    white-space:nowrap;
  }
  #fsBtn:hover, #algBtn:hover, #fsPrev:hover, #fsNext:hover { border-color:#12608f; color:#12608f; }
  #fsPrev:disabled, #fsNext:disabled { opacity:.4; cursor:default; border-color:#e2e8f0; }
  #fsCurve {
    display:inline-flex; align-items:center; gap:8px; padding:6px 15px; border-radius:999px;
    font-size:14px; font-weight:900; background:#f8fafc; border:1.5px solid #e2e8f0;
    white-space:nowrap; flex:none;
  }
  #fsCurve .dt { width:10px; height:10px; border-radius:50%; background:currentColor; flex:none; }
  #fsStep {
    flex:1; min-width:0; font-size:13px; color:#64748b;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  body.ggbFull #fsBar { flex:1; }
  #fsClock {
    padding:6px 15px; border-radius:999px; background:#12283f; color:#fff; flex:none;
    font-family:Georgia,'Times New Roman',serif; font-size:15px; font-weight:900;
  }
  /* 전체화면 위쪽 띠 */
  #fsTop { display:none; }
  body.ggbFull #fsTop {
    display:flex; flex:none; align-items:center; gap:10px; padding:7px 12px;
    background:#fff; border-bottom:1px solid #e2e8f0;
  }
  body.ggbFull #main { flex-direction:column; }
  /* 보통 때는 곡선·단계 표시를 숨긴다 (옆 패널에 이미 있으니까) */
  body:not(.ggbFull) #fsCurve, body:not(.ggbFull) #fsStep,
  body:not(.ggbFull) #fsPrev, body:not(.ggbFull) #fsNext,
  body:not(.ggbFull) #fsClock { display:none; }
  body.ggbFull > *:not(#main) { display:none !important; }
  body.ggbFull #main { position:fixed; inset:0; z-index:9000; }
  body.ggbFull #steps, body.ggbFull #panel,
  body.ggbFull #sbGrip, body.ggbFull #stepsTgl { display:none !important; }
  body.ggbFull #bar { display:none !important; }   /* 전체화면에선 지오지브라에 높이를 모두 준다 */
  #fsHome { display:none; }
  body.ggbMode #fsHome { display:inline-flex; }

  /* ── 왼쪽 설명 접기 ── */
  #main { position:relative; }
  #steps { transition:width .22s ease, padding .22s ease; }
  body.stepsOff #sbGrip { display:none; }
  body.stepsOff #steps { width:0; padding-left:0; padding-right:0; border-right-width:0; overflow:hidden; }
  #stepsTgl {
    position:absolute; left:calc(var(--sbw,380px) + 4px); top:50%; margin-left:-14px; margin-top:-33px; z-index:30;
    width:28px; height:66px; padding:0; border:1.5px solid #dbe3ec; border-radius:10px;
    background:#fff; color:#64748b; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 12px rgba(16,24,40,.13);
    transition:left .22s ease, margin-left .22s ease, color .13s, border-color .13s;
  }
  #stepsTgl:hover { color:#12608f; border-color:#93c5fd; }
  #stepsTgl svg { width:15px; height:15px; transition:transform .22s ease; }
  body.stepsOff #stepsTgl { left:0; margin-left:0; border-radius:0 10px 10px 0; border-left:none; }
  body.stepsOff #stepsTgl svg { transform:rotate(180deg); }

  /* 경계선을 끌어 사이드바 폭 조절 */
  #sbGrip {
    flex:none; width:7px; background:#eef2f7; border-right:1px solid #e2e8f0;
    cursor:col-resize; position:relative; touch-action:none;
  }
  #sbGrip::before {
    content:''; position:absolute; left:2px; top:50%; margin-top:-15px;
    width:3px; height:30px; border-radius:2px; background:#c3cedb;
  }
  #sbGrip:hover, body.sbDrag #sbGrip { background:#dbeafe; }
  #sbGrip:hover::before, body.sbDrag #sbGrip::before { background:#12608f; }
  #sbGrip::after { content:''; position:absolute; top:0; bottom:0; left:-8px; right:-8px; }
  body.sbDrag { cursor:col-resize; user-select:none; }
  body.sbDrag #steps, body.sbDrag #panel, body.sbDrag #sbGrip { transition:none; }

  /* ── 오른쪽 ── */
  #view { flex:1; min-width:0; display:flex; flex-direction:column; background:#fff; }
  #stage { flex:1; min-height:0; position:relative; }
  #cvWrap { position:absolute; inset:0; }
  #cv { width:100%; height:100%; display:block; touch-action:none; }
  #ggbWrap { position:absolute; inset:0; display:none; background:#fff; overflow:hidden; }
  #ggbWrap.show { display:block; }
  #ggb { width:100%; height:100%; }
  /* 두 손가락으로 오므리면 축소 / 벌리면 확대 (브라우저가 아닌 지오지브라가 처리) */
  #ggb canvas { touch-action:none; }
  #ggbMsg {
    position:absolute; inset:0; display:flex; flex-direction:column; gap:11px;
    align-items:center; justify-content:center; text-align:center;
    color:#64748b; font-size:14.5px; line-height:1.8; padding:24px;
  }
  #ggbMsg.hide { display:none; }
  .spin { width:36px; height:36px; border-radius:50%; border:4px solid #e2e8f0;
    border-top-color:#12608f; animation:sp .9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }

  .badge {
    position:absolute; left:12px; top:12px; background:rgba(255,255,255,.95);
    border:1px solid #e2e8f0; border-radius:12px; padding:9px 14px; font-size:13px;
    color:#334155; line-height:1.6; max-width:330px; box-shadow:0 4px 16px rgba(16,24,40,.10);
    pointer-events:none;
  }
  .badge b { color:#0f172a; }
  .hintDrag {
    position:absolute; right:12px; bottom:12px; background:rgba(255,255,255,.92);
    border:1px solid #e2e8f0; border-radius:999px; padding:6px 13px; font-size:12.5px;
    color:#64748b; pointer-events:none;
  }
  #bar {
    flex:none; padding:9px 14px; background:#fff; border-top:1px solid #e2e8f0;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center;
  }
  #bar button {
    padding:9px 16px; font-size:13.5px; font-weight:700; border-radius:10px; cursor:pointer;
    border:1.5px solid #cbd5e1; background:#fff; color:#334155; font-family:inherit; transition:all .12s;
  }
  #bar button:hover:not(:disabled) { border-color:#0284c7; color:#0369a1; }
  #bar button:disabled { opacity:.45; cursor:default; }
  #bar button.main { background:#12608f; border:none; color:#fff; }
  #bar button.main:hover:not(:disabled) { background:#0e4f76; color:#fff; }
  #bar button.on { background:#0284c7; border-color:#0284c7; color:#fff; }
  #bar .sep { width:1px; height:24px; background:#e2e8f0; margin:0 3px; }
  #ggbBtn { border-color:#12608f; color:#12608f; font-weight:800; }
  #ggbBtn.on { background:#12608f; border-color:#12608f; color:#fff; }
  #prog { font-size:13px; font-weight:800; color:#0369a1; margin-right:6px; font-family:Georgia,serif; }
  body.ggbMode .previewOnly { display:none; }
</style>
</head>
<body>
<header>
  <h1>지오지브라로 이차곡선 자취 그리기</h1>
  <span class="sub">단계를 눌러 가며 그대로 따라 해 보세요 — 오른쪽 그림이 그 단계까지 그려집니다</span>
</header>
<div id="tabs">
  <button data-t="para" class="on"><span class="dt"></span>포물선</button>
  <button data-t="ell"><span class="dt"></span>타원</button>
  <button data-t="hyp"><span class="dt"></span>쌍곡선</button>
</div>

<div id="main">
  <div id="fsTop"></div>
  <button id="stepsTgl" type="button" title="설명 접기" aria-label="설명 접기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>
  </button>
  <div id="steps">
    <div id="goal"></div>
    <div id="stepList"></div>
    <div id="whyBox"></div>
  </div>
  <div id="sbGrip" title="좌우로 끌어 폭 조절 (더블클릭: 기본 폭)"></div>
  <div id="view">
    <div id="stage">
      <div id="cvWrap">
        <canvas id="cv"></canvas>
        <div class="badge" id="badge"></div>
        <div class="hintDrag" id="dragHint">점 <b class="rm">A</b>를 끌어 보세요</div>
      </div>
      <div id="ggbWrap">
        <div id="ggb"></div>
        <div id="ggbMsg"><div class="spin"></div>지오지브라를 불러오는 중이에요…</div>
      </div>
    </div>
    <div id="bar">
      <span id="prog"></span>
      <button id="prevBtn">이전 단계</button>
      <button id="nextBtn" class="main">다음 단계</button>
      <span class="sep previewOnly"></span>
      <button id="animBtn" class="previewOnly">자취 그리기</button>
      <button id="traceBtn" class="previewOnly">자취 남기기</button>
      <button id="resetBtn" class="previewOnly">처음부터</button>
      <span class="sep"></span>
      <button id="ggbBtn">실전 연습</button>
      <span id="fsHome"><div id="fsBar">
        <span id="fsCurve"></span>
        <span id="fsStep"></span>
        <button id="fsPrev" type="button">‹ 이전 단계</button>
        <button id="fsNext" type="button">다음 단계 ›</button>
        <button id="algBtn" type="button">대수창 숨기기</button>
        <button id="fsBtn" type="button">전체화면</button>
        <span id="fsClock"></span>
      </div></span>
    </div>
  </div>
</div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════
   지오지브라 자취 작도 — 포물선 / 타원 / 쌍곡선  (연습용)
   세 작도 모두 "선분의 수직이등분선"이 핵심!
   ══════════════════════════════════════════════════════════ */
const CONF = {
  para: {
    name:'포물선',
    goal:'준선 <span class="rm">l</span> 과 초점 <span class="rm">F</span> 에서 <b>같은 거리</b>에 있는 점 <span class="rm">P</span>의 자취를 그립니다.',
    why:'점 <span class="rm">P</span>는 선분 <span class="rm">AF</span>의 수직이등분선 위에 있으므로 <span class="eq">P̅F̅ = P̅A̅</span> 이고,<br>'
       +'<span class="rm">P̅A̅</span>는 <span class="rm">P</span>에서 준선까지의 거리예요.<br>'
       +'→ <span class="eq">(초점까지 거리) = (준선까지 거리)</span> 인 점의 자취 = <b>포물선</b>',
    steps:[
      { tool:'직선', cls:'ln',  txt:'<b>직선</b> 도구로 가로 직선 하나를 긋고 이름을 <span class="rm">l</span>(준선)이라 하자.' },
      { tool:'점', cls:'pt',   txt:'<b>점</b> 도구로 직선 <span class="rm">l</span> <b>위가 아닌 곳</b>에 점 <span class="rm">F</span>(초점)를 찍자.' },
      { tool:'대상 위의 점', cls:'pt', txt:'<b>대상 위의 점</b> 도구로 직선 <span class="rm">l</span> 위에 점 <span class="rm">A</span>를 찍자.' },
      { tool:'수직이등분선', cls:'', txt:'<b>수직이등분선</b> 도구로 두 점 <span class="rm">A</span>, <span class="rm">F</span>를 차례로 클릭해 수직이등분선 <span class="rm">m</span>을 그리자.' },
      { tool:'수직선', cls:'ln', txt:'<b>수직선</b> 도구로 점 <span class="rm">A</span>를 지나고 직선 <span class="rm">l</span>에 수직인 직선 <span class="rm">n</span>을 그리자.' },
      { tool:'교점', cls:'pt', txt:'<b>교점</b> 도구로 두 직선 <span class="rm">m</span>, <span class="rm">n</span>의 교점 <span class="rm">P</span>를 찍자.' },
      { tool:'자취', cls:'sp', txt:'<b>자취</b> 도구로 <span class="rm">P</span> → <span class="rm">A</span> 순서로 클릭! (또는 <span class="rm">P</span>를 우클릭 → <b>자취 보이기</b> 후 <span class="rm">A</span>를 움직이기)' }
    ]
  },
  ell: {
    name:'타원',
    goal:'원의 중심 <span class="rm">F</span>와 원 <b>안</b>의 점 <span class="rm">F′</span>에서 거리의 <b>합</b>이 일정한 점 <span class="rm">P</span>의 자취를 그립니다.',
    why:'수직이등분선 위의 점이므로 <span class="eq">P̅F̅′ = P̅A̅</span>,<br>'
       +'따라서 <span class="eq">P̅F̅ + P̅F̅′ = P̅F̅ + P̅A̅ = F̅A̅ = (반지름)</span> 으로 <b>항상 일정</b>!<br>'
       +'→ 두 점까지 거리의 합이 일정한 점의 자취 = <b>타원</b> (두 초점: <span class="rm">F</span>, <span class="rm">F′</span>)',
    steps:[
      { tool:'원', cls:'ln', txt:'<b>원(중심과 한 점)</b> 도구로 원을 그리고 중심을 <span class="rm">F</span>라 하자.' },
      { tool:'점', cls:'pt', txt:'<b>점</b> 도구로 원의 <b>내부</b>에 점 <span class="rm">F′</span>을 찍자. (중심 <span class="rm">F</span>와는 다른 곳!)' },
      { tool:'대상 위의 점', cls:'pt', txt:'<b>대상 위의 점</b> 도구로 원 위에 점 <span class="rm">A</span>를 찍자.' },
      { tool:'직선', cls:'ln', txt:'<b>직선</b> 도구로 두 점 <span class="rm">A</span>, <span class="rm">F</span>를 지나는 직선을 그리자.' },

  },
  hyp: {

    why:'수직이등분선 위의 점이므로 <span class="eq">P̅F̅′ = P̅A̅</span>,<br>'
       +'따라서 <span class="eq">| P̅F̅ − P̅F̅′ | = | P̅F̅ − P̅A̅ | = F̅A̅ = (반지름)</span> 으로 <b>항상 일정</b>!<br>'
       +'→ 두 점까지 거리의 차가 일정한 점의 자취 = <b>쌍곡선</b> (두 가지가 모두 나와요)',
    steps:[
      { tool:'원', cls:'ln', txt:'<b>원(중심과 한 점)</b> 도구로 원을 그리고 중심을 <span class="rm">F</span>라 하자.' },
      { tool:'점', cls:'pt', txt:'<b>점</b> 도구로 원의 <b>바깥</b>에 점 <span class="rm">F′</span>을 찍자. ← 타원과 다른 점!' },
      { tool:'대상 위의 점', cls:'pt', txt:'<b>대상 위의 점</b> 도구로 원 위에 점 <span class="rm">A</span>를 찍자.' },
      { tool:'직선', cls:'ln', txt:'<b>직선</b> 도구로 두 점 <span class="rm">A</span>, <span class="rm">F</span>를 지나는 직선을 그리자.' },
      { tool:'수직이등분선', cls:'', txt:'<b>수직이등분선</b> 도구로 두 점 <span class="rm">A</span>, <span class="rm">F′</span>을 차례로 클릭해 수직이등분선 <span class="rm">m</span>을 그리자.' },
      { tool:'교점', cls:'pt', txt:'<b>교점</b> 도구로 직선 <span class="rm">AF</span>와 <span class="rm">m</span>의 교점 <span class="rm">P</span>를 찍자.' },
      { tool:'자취', cls:'sp', txt:'<b>자취</b> 도구로 <span class="rm">P</span> → <span class="rm">A</span> 순서로 클릭! 두 갈래 곡선이 나오면 성공!' }
    ]
  }

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let type = 'para', step = 0, dirty = true;
let showTrace = false, anim = null, dragging = false;
let alpha = 0.85;                 // 원 위 A의 각도 (타원·쌍곡선)
let ax = 0.42;                    // 준선 위 A의 위치 비율 (포물선)

/* ── 좌표계 ── */
let S = 1, O = { x:0, y:0 };
function layout(){
  const w = cv.clientWidth, h = cv.clientHeight;
  if(!w || !h) return;
  S = Math.min(w, h) / 12;
  O = { x: w*0.5, y: h*(type==='para' ? 0.62 : 0.5) };
  dirty = true;
}
const P2 = p => ({ x:O.x + p.x*S, y:O.y - p.y*S });
const W2 = q => ({ x:(q.x-O.x)/S, y:-(q.y-O.y)/S });

/* ── 도형 정의 ── */
const DIR_Y = -2.0;               // 포물선 준선 y
const F_PARA = { x:0, y:1.1 };
const R_C = 3.4;                  // 원 반지름
const F_C = { x:0, y:0 };
const F2_ELL = { x:1.35, y:0.45 };
const F2_HYP = { x:5.2, y:0.9 };

function A_pt(){
  if(type==='para') return { x: ax*8 - 4, y: DIR_Y };
  return { x: F_C.x + R_C*Math.cos(alpha), y: F_C.y + R_C*Math.sin(alpha) };
}
function F2_pt(){ return type==='ell' ? F2_ELL : F2_HYP; }

/* P 계산 */
function P_pt(A){
  if(type==='para'){
    const F = F_PARA;
    const y = (A.x-F.x)*(A.x-F.x)/(2*(F.y-DIR_Y)) + (F.y+DIR_Y)/2;
    return { x:A.x, y };
  }
  const F = F_C, G = F2_pt();
  const d = { x:(F.x-A.x)/R_C, y:(F.y-A.y)/R_C };
  const v = { x:G.x-A.x, y:G.y-A.y };
  const t = (v.x*v.x+v.y*v.y) / (2*(d.x*v.x + d.y*v.y));
  return { x:A.x + t*d.x, y:A.y + t*d.y };
}

/* 단계 인덱스 (0-based) — 7단계 구성 */
const IDX = {
  para: { base:0, foc:1, A:2, mid:3, perp:4, P:5, locus:6 },
  conic:{ base:0, foc:1, A:2, line:3, mid:4, P:5, locus:6 }
};
function ix(){ return type==='para' ? IDX.para : IDX.conic; }

/* ── 그리기 ── */
function draw(){
  const w = cv.clientWidth, h = cv.clientHeight;
  if(!w || !h) return;
  const dpr = Math.min(devicePixelRatio||1, 2);
  if(cv.width !== Math.round(w*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  else if(cv.height !== Math.round(h*dpr)) cv.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);

  /* 모눈 */
  ctx.strokeStyle = '#eef2f7'; ctx.lineWidth = 1;
  for(let gx=O.x%S; gx<w; gx+=S){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke(); }
  for(let gy=O.y%S; gy<h; gy+=S){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }

  const A = A_pt(), P = P_pt(A), G = F2_pt();
  const F = (type==='para') ? F_PARA : F_C;
  const I = ix();
  const cur = step;

  /* 자취 (마지막 단계) */
  if(cur >= I.locus || showTrace) drawLocus();

  /* 1) 준선 / 원 */
  if(cur >= I.base){
    ctx.strokeStyle = hl(I.base,'#2ea7d8'); ctx.lineWidth = wd(I.base,3.2);
    if(type==='para'){
      const p1 = P2({x:-9,y:DIR_Y}), p2 = P2({x:9,y:DIR_Y});
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
      lab('l', p2.x-24, p2.y-12, '#0e7fa8');
    } else {
      const c = P2(F_C);
      ctx.beginPath(); ctx.arc(c.x, c.y, R_C*S, 0, 7); ctx.stroke();
    }
  }
  /* 2) F′ 또는 F */
  if(cur >= I.foc){
    if(type==='para'){ dot(P2(F), 6, '#dc2626'); lab('F', P2(F).x+11, P2(F).y-8, '#b91c1c'); }
    else {
      dot(P2(F_C), 5.5, '#111'); lab('F', P2(F_C).x-20, P2(F_C).y+18, '#111');
      dot(P2(G), 6, '#dc2626'); lab('F′', P2(G).x+11, P2(G).y+18, '#b91c1c');
    }
  } else if(cur >= I.base && type !== 'para'){
    dot(P2(F_C), 5.5, '#111'); lab('F', P2(F_C).x-20, P2(F_C).y+18, '#111');
  }
  /* 3) A */
  if(cur >= I.A){
    dot(P2(A), 6.5, '#0e7fa8'); lab('A', P2(A).x+11, P2(A).y+(type==='para'?20:-10), '#0e7fa8');
    ctx.beginPath(); ctx.arc(P2(A).x, P2(A).y, 14, 0, 7);
    ctx.strokeStyle = 'rgba(14,127,168,.45)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
  }
  /* 4) 직선 AF (타원·쌍곡선) */
  if(type!=='para' && cur >= I.line){
    const d = { x:F_C.x-A.x, y:F_C.y-A.y };
    const L = Math.hypot(d.x,d.y)||1;
    const s1 = P2({ x:A.x - d.x/L*12, y:A.y - d.y/L*12 });
    const s2 = P2({ x:A.x + d.x/L*12, y:A.y + d.y/L*12 });
    ctx.strokeStyle = hl(I.line,'#1f2937'); ctx.lineWidth = wd(I.line,2);
    ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.stroke();
  }
  /* 5) 수직이등분선 m (+ 기준이 되는 두 점을 잇는 보조선) */
  if(cur >= I.mid){
    const Q = (type==='para') ? F : G;
    seg(P2(A), P2(Q), hl(I.mid,'#f59e0b'), wd(I.mid,2.4));
    const M = { x:(A.x+Q.x)/2, y:(A.y+Q.y)/2 };
    const vx = Q.x-A.x, vy = Q.y-A.y, L = Math.hypot(vx,vy)||1;
    const nx = -vy/L, ny = vx/L;
    const s1 = P2({ x:M.x - nx*14, y:M.y - ny*14 });
    const s2 = P2({ x:M.x + nx*14, y:M.y + ny*14 });
    ctx.strokeStyle = hl(I.mid,'#8b5cf6'); ctx.lineWidth = wd(I.mid,2.4);
    ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.stroke();
    lab('m', s2.x-16, s2.y+16, '#6d28d9');
    const pm = P2(M);
    ctx.strokeStyle = 'rgba(109,40,217,.75)'; ctx.lineWidth = 1.4;
    const ex = vx/L, ey = -vy/L;
    ctx.beginPath();
    ctx.moveTo(pm.x+ex*8, pm.y+ey*8);
    ctx.lineTo(pm.x+ex*8+nx*8, pm.y+ey*8-ny*8);
    ctx.lineTo(pm.x+nx*8, pm.y-ny*8);
    ctx.stroke();
  }
  /* 6) 수직선 n (포물선만) */
  if(type==='para' && cur >= I.perp){
    const s1 = P2({x:A.x, y:DIR_Y-1}), s2 = P2({x:A.x, y:DIR_Y+11});
    ctx.strokeStyle = hl(I.perp,'#0d9488'); ctx.lineWidth = wd(I.perp,2.2);
    ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.stroke();
    lab('n', s2.x+9, s2.y+16, '#0f766e');
  }
  /* 7) 교점 P + 같은 길이 표시 */
  if(cur >= I.P){
    if(type==='para'){
      seg(P2(P), P2(F), '#ea580c', 2.8);
      seg(P2(P), P2(A), '#ea580c', 2.8);
      tick(P2(P), P2(F)); tick(P2(P), P2(A));
    } else {
      seg(P2(P), P2(G), '#ea580c', 2.8);
      seg(P2(P), P2(A), '#ea580c', 2.8);
      tick(P2(P), P2(G)); tick(P2(P), P2(A));
      seg(P2(P), P2(F_C), '#0e7490', 2.4);
    }
    dot(P2(P), 7, '#16a34a'); lab('P', P2(P).x+12, P2(P).y-10, '#15803d');
  }

  function hl(i, c){ return i===cur ? c : fade(c); }
  function wd(i, w2){ return i===cur ? w2+1.2 : w2; }
}
function fade(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+',.55)';
}
function drawLocus(){
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.lineCap='round';
  if(type==='para'){
    ctx.beginPath(); let st=false;
    for(let i=0;i<=120;i++){
      const x = -6 + 12*i/120;
      const y = (x-F_PARA.x)*(x-F_PARA.x)/(2*(F_PARA.y-DIR_Y)) + (F_PARA.y+DIR_Y)/2;
      const q = P2({x,y});
      if(!st){ ctx.moveTo(q.x,q.y); st=true; } else ctx.lineTo(q.x,q.y);
    }
    ctx.stroke(); return;
  }
  const G = F2_pt();
  const c = Math.hypot(G.x-F_C.x, G.y-F_C.y)/2, a = R_C/2;
  const cx = (F_C.x+G.x)/2, cy = (F_C.y+G.y)/2;
  const rot = Math.atan2(G.y-F_C.y, G.x-F_C.x), cr=Math.cos(rot), sr=Math.sin(rot);
  if(type==='ell'){
    const b = Math.sqrt(Math.max(0.01, a*a - c*c));
    ctx.beginPath();
    for(let i=0;i<=180;i++){
      const t=i/180*Math.PI*2;
      const ex=a*Math.cos(t), ey=b*Math.sin(t);
      const q=P2({ x:cx+ex*cr-ey*sr, y:cy+ex*sr+ey*cr });
      i? ctx.lineTo(q.x,q.y) : ctx.moveTo(q.x,q.y);
    }
    ctx.closePath(); ctx.stroke();
  } else {
    const b = Math.sqrt(Math.max(0.01, c*c - a*a));
    for(const sg of [1,-1]){
      ctx.beginPath(); let st=false;
      for(let i=0;i<=140;i++){
        const t=-2.4+4.8*i/140;
        const ex=sg*a*Math.cosh(t), ey=b*Math.sinh(t);
        const q=P2({ x:cx+ex*cr-ey*sr, y:cy+ex*sr+ey*cr });
        if(q.x>-60&&q.x<cv.clientWidth+60&&q.y>-60&&q.y<cv.clientHeight+60){
          if(!st){ ctx.moveTo(q.x,q.y); st=true; } else ctx.lineTo(q.x,q.y);
        } else st=false;
      }
      ctx.stroke();
    }
  }
}
function dot(p,r,c){ ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fillStyle=c; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
function lab(t,x,y,c){ ctx.font='bold 16px Georgia,serif'; ctx.lineJoin='round';
  ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.lineWidth=4; ctx.strokeText(t,x,y);
  ctx.fillStyle=c; ctx.fillText(t,x,y); }
function seg(a,b,c,w){ ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
function tick(a,b){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  let dx=b.x-a.x, dy=b.y-a.y; const L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L;
  ctx.strokeStyle='#ea580c'; ctx.lineWidth=2.4;
  for(const o of [-2.6,2.6]){
    const cx2=mx+(dx/L)*o, cy2=my+(dy/L)*o;
    ctx.beginPath(); ctx.moveTo(cx2-nx*7,cy2-ny*7); ctx.lineTo(cx2+nx*7,cy2+ny*7); ctx.stroke();
  }
}

/* ── 단계 UI ── */
function renderSteps(){
  const c = CONF[type];
  document.getElementById('goal').innerHTML = '<b>목표</b> — ' + c.goal;
  document.getElementById('stepList').innerHTML = c.steps.map((s,i)=>
    `<div class="stepRow${i===step?' cur':''}${i<step?' done':''}" data-i="${i}">
       <div class="num">${i<step?'✓':i+1}</div>
       <div class="bd">
         <span class="tool ${s.cls}">${s.tool}</span>
         <div class="txt">${s.txt}</div>
       </div>
     </div>`).join('');
  document.querySelectorAll('.stepRow').forEach(el=>
    el.addEventListener('click', ()=>{ step = +el.dataset.i; sync(); }));
  document.getElementById('whyBox').innerHTML = '<b>왜 그럴까?</b><br>' + c.why;
  document.getElementById('whyBox').style.display = step >= c.steps.length-1 ? 'block' : 'none';
}
function sync(){
  const n = CONF[type].steps.length;
  document.getElementById('prog').textContent = (step+1) + ' / ' + n;
  document.getElementById('prevBtn').disabled = step<=0;
  document.getElementById('nextBtn').disabled = step>=n-1;
  document.getElementById('badge').innerHTML =
    '<b>' + (step+1) + '단계</b> · ' + CONF[type].steps[step].tool +
    (step>=n-1 ? ' — 완성! <b style="color:#dc2626">' + CONF[type].name + '</b>' : '');
  document.getElementById('dragHint').style.display = step>=2 ? 'block' : 'none';
  renderSteps();
  dirty = true;
}

/* ── 버튼 ── */
document.getElementById('prevBtn').onclick = ()=>{ if(step>0){ step--; sync(); } };
document.getElementById('nextBtn').onclick = ()=>{ const n=CONF[type].steps.length; if(step<n-1){ step++; sync(); } };
document.getElementById('resetBtn').onclick = ()=>{ step=0; showTrace=false; stopAnim(); syncTrace(); sync(); };
document.getElementById('traceBtn').onclick = ()=>{ showTrace=!showTrace; syncTrace(); dirty=true; };
function syncTrace(){ document.getElementById('traceBtn').classList.toggle('on', showTrace); }
const animBtn = document.getElementById('animBtn');
animBtn.onclick = ()=>{
  if(anim){ stopAnim(); return; }
  step = CONF[type].steps.length-1; sync();
  showTrace = true; syncTrace();
  animBtn.textContent = '멈추기'; animBtn.classList.add('on');
  const t0 = (type==='para') ? ax : alpha;
  let k = 0;
  anim = setInterval(()=>{
    k++;
    if(type==='para'){ ax = (t0 + k/140) % 1; }
    else { alpha = t0 + k/140*Math.PI*2; }
    dirty = true;
    if(k>=140) stopAnim();
  }, 26);
};
function stopAnim(){ if(anim){ clearInterval(anim); anim=null; }
  animBtn.textContent='자취 그리기'; animBtn.classList.remove('on'); }

document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x===b));
  type = b.dataset.t; step = 0; showTrace = false; stopAnim(); syncTrace();
  layout(); sync();
}));

/* ══════════════════════════════════════════
   실전 연습 — 오른쪽 모눈종이를 지오지브라로
   (왼쪽 가이드라인은 그대로 유지)
   ══════════════════════════════════════════ */
const ggbBtn  = document.getElementById('ggbBtn');
const ggbWrap = document.getElementById('ggbWrap');
const ggbMsg  = document.getElementById('ggbMsg');
let ggbLoaded = false, ggbBooted = false, ggbApi = null;

function ggbFail(){
  ggbMsg.classList.remove('hide');
  ggbMsg.innerHTML = '지오지브라를 불러오지 못했어요.<br>'
    + '와이파이(인터넷) 연결을 확인하고 새로고침 해주세요.<br>'
    + '<span style="font-size:12.5px;color:#94a3b8">(지오지브라는 인터넷이 연결되어 있어야 실행됩니다)</span>';
}
function bootGgb(){
  if(typeof GGBApplet === 'undefined'){ ggbFail(); return; }
  document.getElementById('ggb').innerHTML = '';
  ggbMsg.classList.remove('hide');
  ggbMsg.innerHTML = '<div class="spin"></div>지오지브라를 불러오는 중이에요…';
  try{
    const app = new GGBApplet({
      appName:'classic',
      width:  ggbWrap.clientWidth,
      height: ggbWrap.clientHeight,
      language:'ko',
      showToolBar:true, showAlgebraInput:true, showMenuBar:false,
      allowStyleBar:true, enableFileFeatures:false, borderColor:'#e2e8f0',
      enableShiftDragZoom:true, showZoomButtons:true, enableRightClick:false,
      appletOnLoad: (api)=>{ ggbApi = api; ggbMsg.classList.add('hide'); ggbBooted = true;
        lastW = lastH = 0; fitSoon(500, true); },
      scaleContainerClass:'noscale'
    }, true);
    app.inject('ggb');
  }catch(e){ ggbFail(); }
}
function loadGgb(){
  if(ggbLoaded) { bootGgb(); return; }
  ggbLoaded = true;
  const s = document.createElement('script');
  s.src = 'https://www.geogebra.org/apps/deployggb.js';
  s.onload  = bootGgb;
  s.onerror = ggbFail;
  document.head.appendChild(s);
}
ggbBtn.onclick = ()=>{
  const on = !ggbWrap.classList.contains('show');
  ggbWrap.classList.toggle('show', on);
  ggbBtn.classList.toggle('on', on);
  document.body.classList.toggle('ggbMode', on);
  ggbBtn.textContent = on ? '미리보기로' : '실전 연습';
  if(on){ stopAnim(); loadGgb(); }
};
/* ── 지오지브라를 칸에 딱 맞추기 ──
   애플릿은 만들 때 정한 px 크기를 그대로 갖고 있어서, 나중에 칸이 줄면(하단 바가
   생기거나, 화면을 돌리거나, 사이드바를 끌거나) 애플릿이 칸보다 커져서 아래·오른쪽이
   잘린다. 설정 창 아래가 잘리는 것도 같은 이유.
   → 칸 크기가 바뀔 때마다 setSize + recalculateEnvironments 로 다시 맞춘다. */
let fitT = null, lastW = 0, lastH = 0;
function fitGgb(force){
  if(!ggbBooted) return;
  if(!ggbWrap.classList.contains('show')) return;
  const w = Math.round(ggbWrap.clientWidth), h = Math.round(ggbWrap.clientHeight);
  if(!w || !h) return;
  /* 몇 px 차이로 자꾸 크기를 바꾸면 지오지브라가 배치를 다시 짜다가
     대수창을 접어 버린다. 의미 있는 변화일 때만 건드린다. */
  if(!force && Math.abs(w - lastW) < 6 && Math.abs(h - lastH) < 6) return;
  lastW = w; lastH = h;
  if(ggbApi){
    try{
      if(ggbApi.setSize) ggbApi.setSize(w, h);
      else { ggbApi.setWidth(w); ggbApi.setHeight(h); }
      /* 이걸 빼먹으면 지오지브라가 예전 크기·위치를 기억해서 클릭 위치가 어긋나고
         설정 창이 잘린다 */
      if(ggbApi.recalculateEnvironments) ggbApi.recalculateEnvironments();
      return;
    }catch(e){}
  }
  bootGgb();
}
function fitSoon(ms, force){ clearTimeout(fitT); fitT = setTimeout(()=>fitGgb(force), ms || 240); }

/* 칸 크기가 바뀌면(사이드바 끌기·설명 접기·하단 바 생성·화면 회전 …) 자동으로 다시 맞춤 */
if(window.ResizeObserver){
  try{ new ResizeObserver(()=>fitSoon(240)).observe(ggbWrap); }catch(e){}
}
addEventListener('resize', ()=>fitSoon(240));
addEventListener('orientationchange', ()=>fitSoon(500, true));
if(window.visualViewport){
  try{ visualViewport.addEventListener('resize', ()=>fitSoon(320)); }catch(e){}
}

/* ── 사이드바 폭 조절 (경계선을 좌우로 끌기 / 더블클릭하면 기본값) ── */
(function(){
  const KEY = 'locusSbW', DEF = 380, MIN = 240, MAX = 680;
  const main = document.getElementById('main'), grip = document.getElementById('sbGrip');
  if(!main || !grip) return;
  function setW(w){
    w = Math.max(MIN, Math.min(MAX, Math.round(w)));
    const lim = Math.max(MIN, Math.round(innerWidth * 0.62));
    w = Math.min(w, lim);
    main.style.setProperty('--sbw', w + 'px');
    return w;
  }
  let w0 = DEF;
  try{ const v = parseInt(localStorage.getItem(KEY), 10); if(v) w0 = v; }catch(e){}
  setW(w0);
  let on = false;
  grip.addEventListener('pointerdown', e=>{
    on = true; grip.setPointerCapture(e.pointerId);
    document.body.classList.add('sbDrag'); e.preventDefault();
  });
  grip.addEventListener('pointermove', e=>{
    if(!on) return;
    const w = setW(e.clientX - main.getBoundingClientRect().left);
    try{ localStorage.setItem(KEY, w); }catch(err){}
  });
  const end = ()=>{ if(!on) return; on = false;
    document.body.classList.remove('sbDrag'); dispatchEvent(new Event('resize')); };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  grip.addEventListener('dblclick', ()=>{
    setW(DEF); try{ localStorage.setItem(KEY, DEF); }catch(e){}
    dispatchEvent(new Event('resize'));
  });
  addEventListener('resize', ()=>{
    let w = DEF; try{ const v = parseInt(localStorage.getItem(KEY),10); if(v) w = v; }catch(e){}
    setW(w);
  });
})();

/* ── 지오지브라 전체화면 ── */
(function(){
  const btn  = document.getElementById('fsBtn'); if(!btn) return;
  const bar  = document.getElementById('fsBar');
  const home = document.getElementById('fsHome');
  const top  = document.getElementById('fsTop');
  const curve = document.getElementById('fsCurve'), stepEl = document.getElementById('fsStep');
  const clk = document.getElementById('fsClock');
  if(!document.getElementById('tBig') && clk) clk.remove();   /* 타이머 없는 연습 페이지 */
  function set(on){
    document.body.classList.toggle('ggbFull', on);
    (on ? top : home).appendChild(bar);
    btn.textContent = on ? '전체화면 해제' : '전체화면';
    refresh();
    setTimeout(()=>fitSoon(60, true), 80);
    setTimeout(()=>fitSoon(60), 420);
  }
  btn.onclick = ()=>set(!document.body.classList.contains('ggbFull'));
  /* 전체화면에서는 아래 버튼줄이 숨겨지므로 단계 이동을 띠에 둔다 */
  const pv = document.getElementById('fsPrev'), nx = document.getElementById('fsNext');
  const rp = document.getElementById('prevBtn'), rn = document.getElementById('nextBtn');
  if(rp && rn){
    pv.onclick = ()=>{ rp.click(); refresh(); };
    nx.onclick = ()=>{ rn.click(); refresh(); };
  } else { pv.remove(); nx.remove(); }
  addEventListener('keydown', e=>{
    if(e.key === 'Escape' && document.body.classList.contains('ggbFull')) set(false);
  });
  /* 지금 어떤 곡선을, 몇 단계까지 그려야 하는지 */
  const NAME = { para:'포물선', ell:'타원', hyp:'쌍곡선' };
  const COL  = { para:'#1d6fa5', ell:'#a78bfa', hyp:'#f59e0b' };
  function refresh(){
    const L = window.__lesson; if(!L || !curve) return;
    curve.innerHTML = '<span class="dt"></span>' + (NAME[L.type] || '');
    curve.style.color = COL[L.type] || '#334155';
    const cur = document.querySelector('.stepRow.cur');
    const pg  = document.getElementById('prog');
    stepEl.textContent = (pg ? pg.textContent + ' · ' : '')
      + (cur ? (cur.querySelector('.txt') || {}).textContent.trim() : '');
    const pv2 = document.getElementById('fsPrev'), nx2 = document.getElementById('fsNext');
    const rp2 = document.getElementById('prevBtn'), rn2 = document.getElementById('nextBtn');
    if(pv2 && rp2){ pv2.disabled = rp2.disabled; nx2.disabled = rn2.disabled; }
  }
  setInterval(()=>{ if(document.body.classList.contains('ggbFull')) refresh(); }, 300);
  refresh();
})();

/* ── 대수창 켜기 / 끄기 ──
   메뉴바를 껐기 때문에, 지오지브라가 스스로 대수창을 접어 버리면 학생이
   되살릴 방법이 없다. 그래서 직접 버튼을 둔다. */
(function(){
  const ab = document.getElementById('algBtn'); if(!ab) return;
  let algOn = true;
  ab.onclick = ()=>{
    algOn = !algOn;
    ab.textContent = algOn ? '대수창 숨기기' : '대수창 보이기';
    try{ if(ggbApi && ggbApi.setPerspective) ggbApi.setPerspective(algOn ? 'AG' : 'G'); }catch(e){}
    fitSoon(120, true);
  };
})();

/* ── 왼쪽 설명 접기 / 펼치기 ── */
(function(){
  const tg = document.getElementById('stepsTgl');
  if(!tg) return;
  tg.onclick = ()=>{
    const off = document.body.classList.toggle('stepsOff');
    tg.title = off ? '설명 펼치기' : '설명 접기';
    tg.setAttribute('aria-label', tg.title);
    try{ localStorage.setItem('locusStepsOff', off ? '1' : '0'); }catch(e){}
    setTimeout(()=>dispatchEvent(new Event('resize')), 250);
  };
  try{
    if(localStorage.getItem('locusStepsOff') === '1'){
      document.body.classList.add('stepsOff');
      tg.title = '설명 펼치기'; tg.setAttribute('aria-label', tg.title);
    }
  }catch(e){}
})();

/* ── A 드래그 ── */
function pos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
cv.addEventListener('pointerdown', e=>{
  if(step < 2) return;
  const p = pos(e), a = P2(A_pt());
  if(Math.hypot(p.x-a.x, p.y-a.y) < 34){ dragging = true; cv.setPointerCapture(e.pointerId); stopAnim(); }
});
cv.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const wpt = W2(pos(e));
  if(type==='para') ax = Math.max(0, Math.min(1, (wpt.x+4)/8));
  else alpha = Math.atan2(wpt.y-F_C.y, wpt.x-F_C.x);
  dirty = true;
});
const up = ()=>{ dragging=false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

/* ── 루프 ── */
let lw=0, lh=0;
(function tick2(){
  requestAnimationFrame(tick2);
  if(cv.clientWidth!==lw || cv.clientHeight!==lh){ lw=cv.clientWidth; lh=cv.clientHeight; layout(); }
  if(dirty){ dirty=false; draw(); }
})();
layout(); sync();
window.__lesson = { get type(){return type;}, get step(){return step;},
  get n(){return CONF[type].steps.length;}, get trace(){return showTrace;},
  get ggb(){return ggbWrap.classList.contains('show');} };
</script>
