<style>

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:var(--paper); color:var(--ink); font-size:14.5px; line-height:1.55; display:flex; flex-direction:column; height:100dvh}

#app{display:flex; flex:1; min-height:0}

canvas{display:block; width:100%; height:100%; touch-action:none}

i.m,.eq i,.m{font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:1.05em}
.rm{font-family:Georgia,'Times New Roman',serif; font-style:normal}
.ov{text-decoration:overline}
.eq{font-family:Georgia,'Times New Roman',serif; font-size:15.5px; line-height:1.8}
.card{border:1px solid var(--line); border-radius:12px; padding:12px 13px 14px; margin-bottom:12px; background:var(--card)}

.pane{display:none} .pane.on{display:block}

.stmt b{color:var(--acc)}
.step{font-size:13.5px; line-height:1.8; min-height:60px}
.step b{color:var(--acc)} .step .hint,.hint{color:var(--dim); font-size:12.5px}
.btnrow{display:flex; gap:7px; align-items:center; margin-top:10px; flex-wrap:wrap}
.btn{border:1.5px solid var(--line2); background:transparent; color:var(--dim); font:inherit; font-size:12px; font-weight:700; padding:0 14px; height:32px; border-radius:999px; cursor:pointer}
.btn:hover{border-color:var(--acc); color:var(--acc)} .btn.pri{background:var(--acc); border-color:var(--acc); color:#fff}

.btn.sm{height:28px; padding:0 11px; font-size:11.5px}
.no{margin-left:auto; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11.5px; color:var(--dim)}
.row{display:flex; align-items:center; gap:10px; margin:9px 0}
.row label{width:118px; flex:none; font-size:12px; color:var(--dim)}
.row input[type=range]{flex:1; accent-color:var(--acc); height:20px; min-width:0}
.row .num{width:62px; text-align:right; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12px; flex:none}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line); align-items:center}
.kv:last-child{border-bottom:0} .kv b{font-family:'IBM Plex Mono',ui-monospace,monospace; font-weight:600; white-space:nowrap}

/* 키워드 목록 복사 금지 */
.keychk, .keychk *, .keys, .keys *{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}

.c3wrap{padding:0; overflow:hidden; width:min(440px,100%)} .c3wrap canvas{display:block; width:100%; height:320px; touch-action:none}

<script>
"use strict";
const $=id=>document.getElementById(id);
const DEG=Math.PI/180, TAU=Math.PI*2;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const fmt=(x,n=1)=>(Math.abs(x)<5e-4?0:x).toFixed(n);
/* ── 3D 벡터 ── */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};
const rotAB=(a,b)=>{ /* a→b 회전행렬 (로드리게스) */
  a=norm(a); b=norm(b); const v=cross(a,b), c=dot(a,b), s=len(v);
  if(s<1e-8) return c>0? (x=>x) : (x=>mul(x,-1));
  const k=norm(v), K=x=>cross(k,x);
  return x=>add(add(mul(x,c),mul(K(x),s)),mul(k,dot(k,x)*(1-c)));
};
/* ── 캔버스 ── */
const cv=$('c'); let ctx=cv.getContext('2d');
let W=0,H=0,DPR=1, tab='det', T=0, DT=0;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2.5); const r=cv.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width)); H=Math.max(1,Math.round(r.height));
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.getContext('2d').setTransform(DPR,0,0,DPR,0,0); }
const INK='#23241D', BLU='#2F45EC', DIM='#A8A79A', ORG='#E0891A', GRN='#12876A', RED='#D9463F', VIO='#7A3FB5', PAPER='#EFEFE3';
const KOR="'IBM Plex Sans KR',system-ui,sans-serif";
/* ── 3D 카메라 · 프림 ── */
let EYE=[0,0,0],FW=[1,0,0],RT=[0,1,0],UPv=[0,0,1],FOC=1,CX=0,CY=0;
function setCam(cm,cx,cy,foch){
  CX=cx===undefined?W/2:cx; CY=cy===undefined?H/2:cy;
  EYE=[cm.target[0]+cm.dist*Math.cos(cm.el)*Math.cos(cm.az),
       cm.target[1]+cm.dist*Math.cos(cm.el)*Math.sin(cm.az),

function hull(pts){ pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
