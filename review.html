<title>중단원 학습 점검</title>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{ --paper:#EFEFE3; --ink:#23241D; --dim:#A8A79A; --line:#DCDACD; --line2:#C7C5B6;
  --acc:#2F45EC; --acc2:#1B2FC4; --card:#F5F5EC; --org:#E0891A; --grn:#12876A; --red:#D9463F; --vio:#7A3FB5; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:var(--paper); color:var(--ink); font-size:14.5px; line-height:1.55; display:flex; flex-direction:column; height:100dvh}
header{padding:12px 22px 10px; border-bottom:1px solid var(--line); display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; flex:none}
h1{font-size:17.5px; margin:0; letter-spacing:-.3px; font-weight:700}
.sub{font-size:12px; color:var(--dim); margin-top:3px}
#tabs{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap}
#tabs button{height:34px; padding:0 13px; border-radius:999px; border:1.5px solid var(--line2); background:transparent;
  font:inherit; font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:7px}
#tabs button .no{font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; color:var(--acc); font-weight:600}
#tabs button.on{background:var(--acc); border-color:var(--acc); color:#fff} #tabs button.on .no{color:#fff}
#app{display:flex; flex:1; min-height:0}
#stage{flex:1; position:relative; min-width:0}
canvas{display:block; width:100%; height:100%; touch-action:none}
#panel{width:392px; flex:none; border-left:1px solid var(--line); overflow-y:auto; overscroll-behavior:contain; padding:16px 18px 80px}
@media (max-width:940px){ #app{flex-direction:column} #stage{flex:0 0 46%; min-height:220px} #panel{width:auto; flex:1; border-left:0; border-top:1px solid var(--line); padding:12px 14px 80px} }
i.m,.eq i,.m{font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:1.05em}
.rm{font-family:Georgia,'Times New Roman',serif; font-style:normal}
.ov{text-decoration:overline}
.eq{font-family:Georgia,'Times New Roman',serif; font-size:15.5px; line-height:1.8}
.card{border:1px solid var(--line); border-radius:12px; padding:12px 13px 14px; margin-bottom:12px; background:var(--card)}
.card h2{font-size:12px; margin:0 0 9px; letter-spacing:.06em; color:var(--dim); font-family:'IBM Plex Mono',ui-monospace,monospace; text-transform:uppercase; font-weight:600; display:flex; align-items:center}
.pane{display:none} .pane.on{display:block}
.stmt{font-size:13.5px; line-height:1.8; padding:10px 13px; border-left:3px solid var(--acc); background:#E9E9DC; border-radius:0 10px 10px 0; margin-bottom:12px}
.stmt b{color:var(--acc)}
.step{font-size:13.5px; line-height:1.8; min-height:60px}
.step b{color:var(--acc)} .step .hint,.hint{color:var(--dim); font-size:12.5px}
.btnrow{display:flex; gap:7px; align-items:center; margin-top:10px; flex-wrap:wrap}
.btn{border:1.5px solid var(--line2); background:transparent; color:var(--dim); font:inherit; font-size:12px; font-weight:700; padding:0 14px; height:32px; border-radius:999px; cursor:pointer}
.btn:hover{border-color:var(--acc); color:var(--acc)} .btn.pri{background:var(--acc); border-color:var(--acc); color:#fff}
.btn.pri:hover{background:var(--acc2); border-color:var(--acc2); color:#fff}
.btn.sm{height:28px; padding:0 11px; font-size:11.5px}
.no{margin-left:auto; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11.5px; color:var(--dim)}
.row{display:flex; align-items:center; gap:10px; margin:9px 0}
.row label{width:118px; flex:none; font-size:12px; color:var(--dim)}
.row input[type=range]{flex:1; accent-color:var(--acc); height:20px; min-width:0}
.row .num{width:62px; text-align:right; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12px; flex:none}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line); align-items:center}
.kv:last-child{border-bottom:0} .kv b{font-family:'IBM Plex Mono',ui-monospace,monospace; font-weight:600; white-space:nowrap}
.kv .ok{color:var(--grn)} .kv .lim{color:var(--org)} .kv .bad{color:var(--red)}
.toggles{display:flex; flex-wrap:wrap; gap:6px}
.toggles label{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line2); border-radius:999px; padding:5px 10px; font-size:12px; cursor:pointer; user-select:none; color:var(--dim)}
.toggles label:has(input:checked){color:var(--acc); border-color:var(--acc)} .toggles input{accent-color:var(--acc); margin:0}
details{border:1px solid var(--line); border-radius:12px; padding:10px 13px; margin-bottom:10px; background:var(--card)}
details summary{cursor:pointer; font-weight:600; font-size:13px; list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ "; color:var(--acc); font-family:'IBM Plex Mono',monospace} details[open] summary::before{content:"− "}
details p,details li{font-size:12.5px; line-height:1.8} details ol,details ul{margin:8px 0 2px; padding-left:19px}
.note{font-size:11.5px; color:var(--dim); line-height:1.6; margin-top:8px}
#hud{position:absolute; left:12px; bottom:12px; display:flex; flex-wrap:wrap; gap:6px; max-width:calc(100% - 24px); pointer-events:none}
.chip{background:rgba(239,239,227,.9); border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:11.5px; font-family:'IBM Plex Mono',ui-monospace,monospace}
.chip i{font-style:normal; color:var(--dim); margin-right:4px}
#tip{position:absolute; left:12px; top:12px; font-size:11.5px; color:var(--dim); background:rgba(239,239,227,.86); border:1px solid var(--line); border-radius:999px; padding:5px 12px; max-width:calc(100% - 130px); pointer-events:none}
#tools{position:absolute; right:12px; top:12px; display:flex; gap:6px}
#tools .btn{background:rgba(239,239,227,.9); height:30px; padding:0 12px; display:flex; align-items:center; gap:5px}
.foot{font-size:11px; color:var(--dim); text-align:center; margin-top:14px; font-family:'IBM Plex Mono',ui-monospace,monospace}
.tag{display:inline-block; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:10.5px; letter-spacing:.06em; color:var(--acc); border:1px solid var(--acc); border-radius:999px; padding:1px 8px; margin-right:6px; vertical-align:2px}
.tag.dim{color:var(--dim); border-color:var(--line2)}
.seg{display:flex; gap:5px; background:#E4E3D6; padding:3px; border-radius:999px; margin-bottom:10px}
.seg button{flex:1; height:28px; border:0; border-radius:999px; background:transparent; font:inherit; font-size:12px; font-weight:700; color:var(--dim); cursor:pointer}
.seg button.on{background:#fff; color:var(--acc); box-shadow:0 1px 3px rgba(0,0,0,.08)}
.plist button{display:flex; align-items:center; gap:9px; width:100%; text-align:left; height:40px; padding:0 10px; border:0;
  border-bottom:1px solid var(--line); background:transparent; font:inherit; font-size:13px; color:var(--ink); cursor:pointer}
.plist button:last-child{border-bottom:0}
.plist button .k{font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; color:var(--dim); width:18px; flex:none}
.plist button.on{color:var(--acc); font-weight:700} .plist button.on .k{color:var(--acc)}

/* 문제 팝업 */
#ov{position:fixed; inset:0; background:rgba(35,36,29,.38); display:none; align-items:center; justify-content:center; z-index:50; padding:18px}
#ov.on{display:flex}
.mcard{background:var(--paper); border:1px solid var(--line2); border-radius:16px; width:min(660px,100%);
  max-height:calc(100dvh - 36px); overflow:auto; padding:18px 20px 20px; box-shadow:0 18px 60px rgba(0,0,0,.25)}
.mhead{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.mhead h3{margin:0; font-size:15.5px; flex:1}
.mx{border:1.5px solid var(--line2); background:transparent; border-radius:999px; width:30px; height:30px; font:inherit; font-weight:700; color:var(--dim); cursor:pointer}
.mq{font-size:13px; line-height:1.7; margin:6px 0 10px}
#mc,#mc2{width:100%; height:300px; border:1px solid var(--line); border-radius:12px; background:var(--card); touch-action:none; display:block}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:10px}
.opts button{border:1.5px solid var(--line2); background:transparent; border-radius:10px; min-height:38px; padding:7px 10px;
  font:inherit; font-size:12.5px; text-align:left; cursor:pointer; color:var(--ink); line-height:1.45}
.opts button.on{border-color:var(--acc); color:var(--acc); font-weight:700; background:#fff}
.verdict{margin-top:10px; font-size:12.5px; line-height:1.65; border-left:3px solid var(--acc); padding:2px 0 2px 10px; min-height:20px; color:var(--ink)}
.verdict.bad{border-left-color:var(--red)}
.verdict:empty{border-left-color:var(--line); color:var(--dim)}
/* 준비물 */
.tray{display:flex; gap:7px; flex-wrap:wrap}
.tray button{border:1.5px solid var(--line2); background:#fff; border-radius:12px; padding:9px 13px; font:inherit; font-size:12.5px;
  font-weight:700; cursor:pointer; display:flex; align-items:center; gap:8px; color:var(--ink)}
.tray button:disabled{opacity:.35; cursor:default}
.tray .cnt{font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; color:var(--acc); border:1px solid var(--acc); border-radius:999px; padding:0 7px}
.tray .glyph{font-family:Georgia,serif; font-size:15px}
.cklist .kv b{font-family:'IBM Plex Mono',ui-monospace,monospace}
.big{font-size:13px; font-weight:700}

.qcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 16px; margin:0 auto 14px; max-width:920px}
.qcard h2{margin:0 0 9px; font-size:12px; letter-spacing:.08em; color:var(--dim); font-weight:700}
.qtext{font-size:14px; line-height:1.85}
.qwrap{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap}
.qwrap .qtext{flex:1; min-width:240px}
.qfig{flex:none; background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px}
.m{font-family:Georgia,'Times New Roman',serif; font-style:italic; font-weight:600}
.rm{font-family:Georgia,'Times New Roman',serif; font-weight:600}
.ov{text-decoration:overline}
.badge{display:inline-block; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:10.5px; letter-spacing:.06em;
  color:#fff; background:var(--acc); border-radius:999px; padding:2px 9px; margin-right:8px; vertical-align:2px}
.defbox{border-left:3px solid var(--acc); background:#E9E9DC; border-radius:0 10px 10px 0; padding:10px 13px; font-size:13.5px; line-height:1.85; margin-top:8px}
.defbox b{color:var(--acc)}
textarea.proof{width:100%; min-height:150px; resize:vertical; border:1.5px solid var(--line2); border-radius:12px;
  background:#fff; color:var(--ink); padding:12px 14px; font-family:'IBM Plex Sans KR',Georgia,serif; font-size:14.5px; line-height:1.95; outline:none}
textarea.proof:focus{border-color:var(--acc)}
.proofsteps{border-left:3px solid var(--acc); padding:2px 0 2px 12px; margin:10px 0 4px; font-size:13.5px; line-height:2.0}
.proofsteps .hidden-step{display:none}
.pass{margin-top:10px; border:1.5px solid var(--grn); color:var(--grn); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700; display:none}
.pass.on{display:block}
.sendRow{display:flex; align-items:center; gap:11px; margin-top:12px; flex-wrap:wrap}
.sendMsg{font-size:12px; color:var(--dim); line-height:1.5}
.helpkeys{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
.helpkeys span{border:1px solid var(--line2); border-radius:8px; padding:3px 8px; font-size:11.5px; font-family:'IBM Plex Mono',ui-monospace,monospace; color:var(--dim)}
.helpkeys b{font-family:Georgia,serif; color:var(--ink)}
details.qcard{padding:12px 16px} details.qcard summary{font-weight:600; font-size:13px; cursor:pointer; list-style:none}
details.qcard summary::-webkit-details-marker{display:none}
details.qcard summary::before{content:"+ "; color:var(--acc); font-family:'IBM Plex Mono',monospace} details.qcard[open] summary::before{content:"− "}
details.keychk #keys{margin-top:9px} details.keychk .note{margin-top:9px}
.keychk .kv b{font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12px}
/* 키워드 목록 복사 금지 */
.keychk, .keychk *, .keys, .keys *{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
@keyframes rowFlash{0%,100%{background:transparent} 40%{background:rgba(242,162,46,.3)}}
.kv.flash{animation:rowFlash 1.15s ease-out 2; border-radius:7px}
.c3wrap{padding:0; overflow:hidden; width:min(440px,100%)} .c3wrap canvas{display:block; width:100%; height:320px; touch-action:none}
.c3bar{display:flex; align-items:center; gap:6px; padding:6px 8px; border-top:1px solid var(--line); font-size:11px; color:var(--dim)}
.c3bar span{flex:1}

#wrap{display:flex; flex:1; min-height:0}
#nums{width:86px; flex:none; border-right:1px solid var(--line); overflow-y:auto; padding:10px 8px 80px; display:flex; flex-direction:column; gap:6px}
#nums button{height:38px; border:1.5px solid var(--line2); border-radius:999px; background:transparent; font:inherit; font-size:13.5px; font-weight:700; color:var(--dim); cursor:pointer; font-family:'IBM Plex Mono',monospace}
#nums button.on{background:var(--acc); border-color:var(--acc); color:#fff}
#stage2{flex:1; min-width:0; display:flex; flex-direction:column; padding:10px 14px 70px}
.fig{display:none; flex:1; min-height:0; flex-direction:column} .fig.on{display:flex}
.fig .cv{flex:1; min-height:320px; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden}
.fig canvas{display:block; width:100%; height:100%; touch-action:none}
.fig .ctl{display:flex; align-items:center; gap:8px; padding:8px 2px 0; flex-wrap:wrap; font-size:13px}
.fig .ctl .no{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--acc); font-size:15px; margin-right:6px}
.fig .ctl .sp{flex:1}
.fig .ctl .msg{font-size:13px; color:var(--ink); font-weight:600}
@media (max-width:640px){ #nums{width:64px; padding:8px 5px} #nums button{height:34px; font-size:12.5px} }

.fb{flex:1; min-height:0; display:grid; grid-template-columns:minmax(260px,0.9fr) minmax(320px,1.3fr); gap:14px; align-items:stretch}
.fb .qimg{width:100%; height:auto; max-height:100%; object-fit:contain; object-position:top; border:1px solid var(--line); border-radius:12px; background:#fff; padding:8px}
.fb .cv{min-height:320px}
@media (max-width:820px){ .fb{grid-template-columns:1fr} .fb .qimg{max-height:260px} }
</style>
</head>

  return {x:CX+dot(v,RT)*FOC/z, y:CY-dot(v,UPv)*FOC/z, z:z}; }

function push(z,fn){prims.push({z,fn});}

function L3(a,b,col,w,dash){ push((dep(a)+dep(b))/2,()=>{ const p=proj(a),q=proj(b); if(!p||!q)return;
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=w||1.4; ctx.setLineDash(dash||[]); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); ctx.restore(); }); }
function P3(p,col,r,ring){ push(dep(p)-0.35,()=>{ const q=proj(p); if(!q)return;

  if(ring){ctx.lineWidth=1.8;ctx.strokeStyle=ring;ctx.stroke();} }); }
function F3(pts,fill,edge,w,dash){ /* 다각형 채우기 */

  push(zc+0.6,()=>{ const q=pts.map(proj); if(q.some(x=>!x)) return;

function arc3(P,u1,u2,r,col,w){ const cosA=clamp(dot(u1,u2),-1,1), A=Math.acos(cosA);

  F3(quad([0.3,1.4,0],X,Y,3.6,2.4),'rgba(35,36,29,.025)','rgba(35,36,29,.28)',1.1);
  F3([[-3.3,0,0],[3.9,0,0],add([3.9,0,0],mul(U30,3.6)),add([-3.3,0,0],mul(U30,3.6))],'rgba(232,69,47,.04)','rgba(232,69,47,.35)',1.1);
  F3(aq,'rgba(47,69,236,.14)','rgba(47,69,236,.8)',1.5); F3(bq,'rgba(47,69,236,.14)','rgba(47,69,236,.8)',1.5);
  for(let i=0;i<4;i++) L3(aq[i],bq[i],'rgba(35,36,29,.5)',1,[4,4]);
  arc3([3.4,0,0],Y,U30,0.7,INK,1.5); flush();
  label3(mul(add(aq[0],aq[2]),0.5),'A',INK,0,0,false,14.5); label3(mul(add(bq[0],bq[2]),0.5),'B',INK,0,0,false,14.5);
  label3(mul(add(bq[0],bq[1]),0.5),'2',BLU,0,13,false,12.5); label3(add(bq[0],mul(norm(add(X,norm(sub(bq[3],bq[0])))),0.55)),'60°',BLU,0,0,false,11.5);
  label3(add([3.4,0,0],mul(norm(add(Y,U30)),1.0)),'30°',INK,0,0,false,12.5);
  label3([-2.6,0.6,0.6*Math.tan(30*DEG)+0.9],'α','#B4661F',0,0,true,15); label3([-2.6,-0.9,0],'β','#B4661F',0,0,true,15); }

/* ── 12 : 45° 로 자른 직육면체의 단면 ── */
const V12=mkView('f12',{az:-0.75,el:0.24,dist:8.4,target:[1,-1,1.8],fov:34});
const PRS=(()=>{ const A=[0,0,0],B=[0,-2,0],C=[2,-2,0],D=[2,0,0]; const zt=p=>1.0+(p[1]+2); const P=[0,0,zt(A)],Q=[0,-2,zt(B)],R=[2,-2,zt(C)],S=[2,0,zt(D)]; return {A,B,C,D,P,Q,R,S}; })();
function draw12(){ if(!begin(V12)) return; const {A,B,C,D,P,Q,R,S}=PRS;
  drawSolid(V12,[[A,B,C,D],[A,B,Q,P],[B,C,R,Q],[C,D,S,R],[D,A,P,S],[P,Q,R,S]],[1,-1,1.2]);
  F3([P,Q,R,S],'rgba(18,135,106,.16)','rgba(18,135,106,.85)',1.6);
  const top=4.4; const T=[[0,0,top],[0,-2,top],[2,-2,top],[2,0,top]]; const base=[A,B,C,D], sec=[P,Q,R,S];
  for(let i=0;i<4;i++){ L3(sec[i],T[i],HID,1.1,[5,4]); L3(T[i],T[(i+1)%4],HID,1.1,[5,4]); }
  for(const q in PRS) P3(PRS[q],INK,3.4,PAPER); flush();
  labels(PRS,{A:[-11,-8],B:[-12,4],C:[0,13],D:[12,4],P:[-12,-4],Q:[-12,0],R:[12,4],S:[12,-4]}); }

/* ── 14 : 선분 AB 의 평면 β 위로의 정사영 ── */
const V14=mkView('f14',{az:1.9,el:0.34,dist:8.8,target:[0.2,0.6,0.5],fov:34});
const U60=[0,Math.cos(60*DEG),Math.sin(60*DEG)];
const QQ14=(()=>{ const B=[2,0,0]; const A=add(B,add(mul(X,-4*Math.cos(30*DEG)),mul(U60,4*Math.sin(30*DEG)))); const Ap=foot(A); const C=[A[0],0,0]; return {A,B,Ap,C}; })();
function draw14(){ if(!begin(V14)) return; const k=mt('m14',0.28); const {A,B,Ap,C:Hh}=QQ14; const XN=mul(X,-1);
  const ph=(a,b)=>clamp((k-a)/(b-a),0,1);            // 구간별 진행 0..1
  const k1=ph(0,0.3), k2=ph(0.3,0.62), k3=ph(0.62,1);
  F3(quad([0,0.6,0],X,Y,4.3,2.4),'rgba(35,36,29,.025)','rgba(35,36,29,.28)',1.1);
  F3([[-4.3,0,0],[4.3,0,0],add([4.3,0,0],mul(U60,3.0)),add([-4.3,0,0],mul(U60,3.0))],'rgba(232,69,47,.04)','rgba(232,69,47,.35)',1.1);
  L3([-4.3,0,0],[4.3,0,0],'rgba(35,36,29,.6)',1.3);
  L3(A,B,INK,1.8); arc3(B,XN,norm(sub(A,B)),0.8,INK,1.3); arc3([-3.6,0,0],Y,U60,0.6,INK,1.3);
  /* 1) A 에서 β 로 내린 수선의 발 A′ */
  if(k1>0){ const [a,b]=grow(k1,A,Ap); L3(a,b,'rgba(35,36,29,.6)',1.2,[4,4]); if(k1>0.98){ P3(Ap,INK,3.2,PAPER); rmark(Ap,norm(sub(A,Ap)),norm(sub(B,Ap)),0.22,INK); } }
  /* 2) A 에서 교선에 내린 수선의 발 H, A′H — 삼수선 정리로 A′H ⊥ BH */
  if(k2>0){ const [a,b]=grow(k2,A,Hh); L3(a,b,BLU,1.6); const [c,d]=grow(k2,Ap,Hh); L3(c,d,BLU,1.6);
    if(k2>0.98){ rmark(Hh,XN,norm(sub(A,Hh)),0.25,RED); rmark(Hh,X,norm(sub(Ap,Hh)),0.25,RED); arc3(Hh,Y,norm(sub(A,Hh)),0.5,RED,1.8); P3(Hh,INK,3.2,PAPER); } }
  /* 3) A′B 와 길이 */
  if(k3>0){ const [a,b]=grow(k3,B,Ap); L3(a,b,RED,2.0); }
  P3(A,INK,3.4,PAPER); P3(B,INK,3.4,PAPER); flush();
  label3(A,'A',INK,10,-8,false,14.5); label3(B,'B',INK,-10,8,false,14.5); label3(mul(add(A,B),0.5),'8',INK,-8,-10,false,12.5);
  label3(add(B,mul(norm(add(XN,norm(sub(A,B)))),1.15)),'30°',INK,0,0,false,12); label3(add([-3.6,0,0],mul(norm(add(Y,U60)),0.95)),'60°',INK,0,0,false,12);
  label3([3.6,0.5,0.5*Math.tan(60*DEG)+0.6],'α','#B4661F',0,0,true,15); label3([3.6,-1.4,0],'β','#B4661F',0,0,true,15);
  if(k1>0.98) label3(Ap,'A′',INK,14,10,false,14.5);
  if(k2>0.98){ label3(Hh,'H',INK,-4,15,false,14.5); label3(add(Hh,mul(norm(add(Y,norm(sub(A,Hh)))),0.8)),'60°',RED,0,0,false,12); }
  if(k3>0.98){ label3(mul(add(A,Hh),0.5),'4',BLU,12,0,false,12.5); label3(mul(add(B,Hh),0.5),'4√3',BLU,0,-11,false,12.5); label3(mul(add(Ap,Hh),0.5),'2',BLU,10,2,false,12.5); label3(mul(add(B,Ap),0.5),'2√13',RED,0,14,false,12.5); } }

/* ── 15 : 기울어진 원기둥의 정사영 ── */
const V15=mkView('f15',{az:2.0,el:0.34,dist:10,target:[0.4,0,0.8],fov:34});
const CYL=(()=>{ const r=0.8, h=2.8, d=[Math.cos(30*DEG),0,Math.sin(30*DEG)], w=[Math.sin(30*DEG),0,-Math.cos(30*DEG)]; const c0=[-1.6,0,r*Math.cos(30*DEG)], c1=add(c0,mul(d,h)); const u=Y, v=norm(cross(d,u));
  const ring=c=>{ const o=[]; for(let i=0;i<40;i++){ const t=i/40*TAU; o.push(add(c,add(mul(u,r*Math.cos(t)),mul(v,r*Math.sin(t))))); } return o; };
  return {r,h,d,w,c0,c1,r0:ring(c0),r1:ring(c1),g0:add(c0,mul(w,r)),g1:add(c1,mul(w,r))}; })();
function hull(pts){ pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
  for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); } for(const p of pts.slice().reverse()){ while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); } return lo.slice(0,-1).concat(up.slice(0,-1)); }
const SH15=hull(CYL.r0.concat(CYL.r1).map(foot));
/* 옆면의 정사영(직사각형) = 두 극단 모선(±Y 방향)의 정사영 / 밑면의 정사영 = 두 밑면 둘레의 정사영(타원) */
const SIDE15=[foot(add(CYL.c0,mul(Y,CYL.r))),foot(add(CYL.c1,mul(Y,CYL.r))),foot(add(CYL.c1,mul(Y,-CYL.r))),foot(add(CYL.c0,mul(Y,-CYL.r)))];
const CAP0=CYL.r0.map(foot), CAP1=CYL.r1.map(foot);
function draw15(){ if(!begin(V15)) return; const k=mt('m15',0.28); const {d,w,c0,c1,r0,r1,g0,g1}=CYL;
  const ph=(a,b)=>clamp((k-a)/(b-a),0,1); const k1=ph(0,0.34), k2=ph(0.34,0.68), k3=ph(0.68,1);
  F3(quad([0.6,0,0],X,Y,4.2,2.6),'rgba(35,36,29,.025)','rgba(35,36,29,.28)',1.1);
  if(k===0) F3(SH15,'rgba(232,69,47,.16)','rgba(232,69,47,.6)',1.2);
  /* 1) 옆면의 정사영 — 직사각형 */
  if(k1>0){ const f=ease(k1); F3(SIDE15,'rgba(47,69,236,'+(0.18*f)+')','rgba(47,69,236,'+(0.8*f)+')',1.3);
    for(const sg of [1,-1]){ L3(add(c0,mul(Y,sg*CYL.r)),foot(add(c0,mul(Y,sg*CYL.r))),'rgba(35,36,29,'+(0.45*f)+')',1,[4,4]); L3(add(c1,mul(Y,sg*CYL.r)),foot(add(c1,mul(Y,sg*CYL.r))),'rgba(35,36,29,'+(0.45*f)+')',1,[4,4]); } }
  /* 2) 밑면의 정사영 — 타원 두 개 (반씩 밖으로 나온다) */
  if(k2>0){ const f=ease(k2); F3(CAP1,'rgba(18,135,106,'+(0.22*f)+')','rgba(18,135,106,'+(0.8*f)+')',1.3); F3(CAP0,'rgba(18,135,106,'+(0.22*f)+')','rgba(18,135,106,'+(0.8*f)+')',1.3); }
  const s=norm(cross(d,sub(EYE,mul(add(c0,c1),0.5)))); const sv=norm(sub(s,mul(d,dot(s,d))));
  F3(r1,'rgba(232,69,47,.10)','rgba(232,69,47,.8)',1.4); F3(r0,null,'rgba(232,69,47,.45)',1.0,[4,3]);
  L3(add(c0,mul(sv,CYL.r)),add(c1,mul(sv,CYL.r)),'rgba(232,69,47,.8)',1.4); L3(add(c0,mul(sv,-CYL.r)),add(c1,mul(sv,-CYL.r)),'rgba(232,69,47,.8)',1.4);
  L3(g0,g1,INK,1.4); L3(g1,foot(g1),'rgba(35,36,29,.5)',1,[4,4]); L3(g0,add(g0,mul(X,4.2)),'rgba(35,36,29,.6)',1.2); arc3(g0,X,d,0.8,INK,1.3);
  L3(c1,add(c1,mul(Y,CYL.r)),INK,1.1); P3(c1,INK,2.8,PAPER); P3(c0,INK,2.8,PAPER);
  /* 3) 밑면이 평면과 이루는 각 60° — 밑면 지름(w 방향)을 늘여 평면과 만나는 점에서 */
  if(k3>0){ const f=ease(k3); const top1=add(c1,mul(w,-CYL.r)); const t=top1[2]/Math.abs(w[2]); const Q=add(top1,mul(mul(w,-1),-t)); /* w 방향으로 내려가 z=0 */
    const q=[top1[0]+w[0]*(top1[2]/(-w[2])), 0, 0];
    L3(top1,add(top1,mul(w,(q[0]-top1[0])/w[0])),'rgba(35,36,29,'+(0.6*f)+')',1.1,[4,4]);
    L3(g1,add(g1,mul(d,1.3)),'rgba(35,36,29,'+(0.5*f)+')',1,[4,4]); L3(add(c0,mul(w,-CYL.r)),add(add(c0,mul(w,-CYL.r)),mul(d,-1.2)),'rgba(35,36,29,'+(0.5*f)+')',1,[4,4]);
    const qq=[top1[0]+w[0]*(top1[2]/(-w[2])),0,0]; if(f>0.98){ arc3(qq,mul(X,-1),norm(sub(top1,qq)),0.7,RED,1.8); label3(add(qq,mul(norm(add(mul(X,-1),norm(sub(top1,qq)))),1.0)),'60°',RED,0,0,false,12); } }
  flush();
  label3(add(g0,mul(norm(add(X,d)),1.1)),'30°',INK,0,0,false,12); label3(mul(add(g0,g1),0.5),'14',INK,10,-8,false,12.5); label3(add(c1,mul(Y,CYL.r*0.5)),'4',INK,0,-10,false,12.5);
  label3([-3.4,-2.2,0],'α','#B4661F',0,0,true,15);
  if(k1>0.98) klabel(mul(add(SIDE15[0],SIDE15[2]),0.5),'옆면의 정사영',BLU,0,0,11.5);
  if(k2>0.98){ klabel(mul(CAP1.reduce((a,p)=>add(a,p),[0,0,0]),1/CAP1.length),'밑면의 정사영','#12876A',10,26,11.5); } }

/* ── 번호 · 시점 · 루프 ── */
const VS={f04:V4,f06:V6,f07:V7,f08:V8,f09:V9,f10:V10,f11:V11,f12:V12,f13:V13,f14:V14,f15:V15};
const DR={'04':draw4,'06':draw6,'07':draw7,'08':draw8,'09':draw9,'10':draw10,'11':draw11,'12':draw12,'13':draw13,'14':draw14,'15':draw15};
let Q='04';
document.querySelectorAll('#nums button').forEach(b=>b.onclick=()=>{ Q=b.dataset.q; document.querySelectorAll('#nums button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.fig').forEach(f=>f.classList.toggle('on',f.dataset.q===Q)); requestAnimationFrame(()=>VS['f'+Q].resize()); geoTask('rev-q'+Q); });
document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>VS[b.dataset.reset].reset());
let t0=performance.now();
function loop(t){ const dt=Math.max(0,Math.min(0.05,(t-t0)/1000)); t0=t; T+=dt; DT=dt; DR[Q](); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
