<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="기하">
<meta name="application-name" content="기하">
<title>기하 탐구실 — 입장</title>
<script src="nav.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    min-height:100vh; background:linear-gradient(160deg,#eef4ff 0%,#f8fafc 55%,#fdf6ec 100%);
    color:#1e293b; display:flex; align-items:center; justify-content:center; padding:22px;
  }
  .wrap { width:100%; max-width:460px; }
  .logo { text-align:center; margin-bottom:18px; }
  .logo .big img { width:64px; height:64px; border-radius:15px; box-shadow:0 4px 14px rgba(146,20,12,.28); }
  .logo h1 { font-size:24px; color:#0f172a; margin-top:6px; }
  .logo p { font-size:13px; color:#64748b; margin-top:5px; }
  .card {
    background:#fff; border:1px solid #e2e8f0; border-radius:18px;
    padding:22px; box-shadow:0 8px 28px rgba(15,23,42,.07);
  }
  label { display:block; font-size:12.5px; font-weight:700; color:#475569; margin:12px 0 5px; }
  input[type=text] {
    width:100%; padding:12px 13px; font-size:16px; border:1.5px solid #cbd5e1;
    border-radius:11px; outline:none; transition:border .15s; background:#fbfdff;
  }
  input[type=text]:focus { border-color:#0284c7; }
  #enterBtn {
    width:100%; margin-top:16px; padding:13px 0; font-size:16px; font-weight:800; color:#fff;
    background:linear-gradient(135deg,#0ea5e9,#6366f1); border:none; border-radius:12px;
    cursor:pointer; box-shadow:0 4px 12px rgba(59,130,246,.35); transition:transform .1s;
  }
  #enterBtn:active { transform:scale(.98); }
  #enterBtn:disabled { opacity:.6; cursor:wait; }
  .msg { margin-top:13px; padding:11px 13px; border-radius:10px; font-size:13.5px; line-height:1.65; display:none; }
  .msg.show { display:block; }
  .msg.wait { background:#fef3c7; color:#92400e; }
  .msg.err  { background:#fee2e2; color:#b91c1c; }
  .msg.ok   { background:#dcfce7; color:#166534; }
  .foot { text-align:center; font-size:11.5px; color:#94a3b8; margin-top:14px; line-height:1.7; }

  /* ── 승인 후 메뉴 ── */
  #menu { display:none; }
  #menu.show { display:block; }
  .hello { font-size:14px; color:#334155; margin-bottom:12px; text-align:center; }
  .hello b { color:#0369a1; }
  .mat {
    display:block; border:1.5px solid #e2e8f0; border-radius:14px; padding:14px 16px;
    background:#fff; text-decoration:none; transition:all .13s; cursor:pointer;
  }
  .mat:hover { border-color:#0284c7; background:#f0f9ff; transform:translateY(-1px); }
  .mat .t { font-size:16.5px; font-weight:800; color:#0f172a; display:flex; align-items:center; gap:8px; }
  .icoImg { width:22px; height:22px; vertical-align:-4px; object-fit:contain; }
  .subItem .icoImg { width:19px; height:19px; }
  .mat .t .arw { margin-left:auto; font-size:13px; color:#94a3b8; transition:transform .18s; }
  .mat.open .arw { transform:rotate(180deg); }
  .subList { display:none; margin:8px 0 2px; padding-left:4px; }
  .mat.open + .subList, .subList.open { display:block; }
  .subItem {
    display:flex; align-items:center; gap:9px; padding:11px 14px; margin-top:7px;
    border:1.5px solid #e2e8f0; border-radius:12px; background:#fbfdff;
    text-decoration:none; color:#334155; font-size:14.5px; font-weight:700; transition:all .12s;
  }
  .subItem:hover { border-color:#0284c7; background:#f0f9ff; color:#0369a1; }
  .subItem .ic { font-size:17px; }
  .subItem .chk { margin-left:auto; font-size:12px; font-weight:800; color:#2563eb; }
  .subItem.done { border-color:#93c5fd; background:#eff6ff; }
  #logout {
    margin-top:14px; width:100%; padding:9px 0; font-size:12.5px; font-weight:700;
    background:#fff; color:#94a3b8; border:1.5px solid #e2e8f0; border-radius:10px; cursor:pointer;
  }
  #logout:hover { color:#64748b; }
  /* ── 단원 목차 ── */
  .unit {
    display:flex; align-items:center; gap:13px; width:100%; text-align:left;
    border:1.5px solid #e2e8f0; border-radius:14px; padding:14px 15px; margin-top:10px;
    background:#fbfdff; cursor:pointer; transition:all .15s; font-family:inherit;
  }
  .unit:not(.soon):hover { border-color:#0284c7; background:#f0f9ff; transform:translateY(-1px); }
  .unit .no {
    flex:none; width:38px; height:38px; border-radius:11px; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800;
  }
  .unit .tt { font-size:15.5px; font-weight:800; color:#0f172a; }
  .unit .dd { font-size:12.3px; color:#64748b; margin-top:3px; line-height:1.55; }
  .unit .tag { margin-left:auto; flex:none; font-size:11.5px; color:#94a3b8; font-weight:700; }
  .unit.soon { opacity:.62; cursor:default; }
  .homeHead { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .homeHead button {
    padding:7px 11px; font-size:12.5px; font-weight:700; border-radius:9px; cursor:pointer;
    border:1.5px solid #cbd5e1; background:#fff; color:#475569; font-family:inherit;
  }
  .homeHead b { font-size:16px; color:#0f172a; }
  .mat { position:relative; }
  .mat.done { border:2.5px solid #2563eb; background:#eff6ff; }
  .stamp {
    position:absolute; right:11px; bottom:10px; color:#2563eb;
    border:2.5px solid #2563eb; border-radius:9px; padding:2px 9px;
    font-size:13px; font-weight:900; transform:rotate(-8deg); background:rgba(255,255,255,.75);
  }
  .setupWarn {
    margin-top:12px; padding:11px 13px; border-radius:10px; font-size:12.5px; line-height:1.7;
    background:#fff7ed; color:#9a3412; border:1px dashed #fdba74; display:none;
  }
</style>
</head>
<body>
<!-- ── 로딩(스플래시) 화면 ── -->
<div id="splash">
  <img id="splashEmblem" src="splash-emblem.png" alt="">
  <div id="splashTitle">GEOMETRY</div>
  <div id="splashLine"></div>
  <div id="splashSub">v1.10&ensp;·&ensp;제작 차지영선생님</div>
  <!-- ★ 로딩화면의 버전 표기는 자동 갱신하지 않음 — 선생님이 바꿔 달라고 할 때만 수정 -->
</div>
<style>
  #splash {
    position:fixed; inset:0; z-index:3000;
    background:radial-gradient(120% 90% at 50% 32%, #c62828 0%, #b71c1c 45%, #7f1010 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .55s ease;
  }
  #splash.hide { opacity:0; pointer-events:none; }
  #splashEmblem { width:118px; height:118px; filter:drop-shadow(0 6px 18px rgba(0,0,0,.35)); }
  #splashTitle {
    margin-top:34px; color:#fff; font-size:31px; font-weight:500;
    letter-spacing:.42em; text-indent:.42em; font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  }
  #splashLine {
    margin-top:18px; width:270px; height:1.5px; border-radius:1px;
    background:rgba(203,213,225,.65);
  }
  #splashSub {
    margin-top:15px; color:rgba(255,255,255,.85); font-size:13.5px; font-weight:500;
    letter-spacing:.06em;
  }
  .sign {
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:20px; font-size:12.5px; color:#94a3b8; font-weight:600;
  }
  .sign img { width:26px; height:26px; }
  .sign b { color:#64748b; }
</style>
<div class="wrap">
  <div class="logo">
    <div class="big"><img src="icon-512.png" alt="기하 탐구실"></div>
    <h1>기하 탐구실</h1>
    <p>2022 개정교육과정 · 기하 수업 자료</p>
  </div>

  <!-- ── 입장 게이트 ── -->
  <div class="card" id="gate">
    <label for="sid">학번</label>
    <input type="text" id="sid" placeholder="예) 20301" autocomplete="off">
    <label for="name">이름</label>
    <input type="text" id="name" placeholder="예) 김기하" autocomplete="off">
    <button id="enterBtn">입장하기</button>
    <div class="msg" id="msg"></div>
    <div class="setupWarn" id="setupWarn">
      ⚠️ 아직 승인 서버(Apps Script URL)가 설정되지 않았어요.<br>
      선생님이라면 <b>배포가이드.md</b>의 1~2단계를 따라 URL을 넣어주세요.
      (설정 전에는 누구나 입장되는 테스트 모드로 동작합니다)
    </div>
  </div>

  <!-- ── 승인 후: 목차 / 홈 ── -->
  <div class="card" id="menu">
    <div id="tocView">
      <div class="hello">👋 <b id="helloName"></b>님, 환영해요! 공부할 단원을 골라 보세요.</div>
      <button class="unit" id="unit1">
        <span class="no" style="background:#3b82f6">1</span>
        <span><span class="tt">이차곡선</span><br>
          <span class="dd">원뿔을 자르면 나타나는 네 가지 곡선 — 포물선·타원·쌍곡선.</span></span>
        <span class="tag">›</span>
      </button>
      <button class="unit soon">
        <span class="no" style="background:#f0a25f">2</span>
        <span><span class="tt">공간도형과 공간좌표</span><br>
          <span class="dd">삼수선의 정리, 정사영, 그리고 좌표공간.</span></span>
        <span class="tag">추후 공개</span>
      </button>
      <button class="unit soon">
        <span class="no" style="background:#6ecb8f">3</span>

          <span class="dd">크기와 방향 — 화살표로 공간을 읽는다.</span></span>

    <div id="homeView" style="display:none">

        <button id="backToc">‹ 목차</button>
        <b>1. 이차곡선</b>
      </div>
      <div id="matList"></div>
    </div>
    <button id="logout">다른 학생으로 입장하기</button>
  </div>

  <div class="sign"><img src="splash-emblem.png" alt=""><span>단국대학교사범대학부속고등학교 <b>차지영선생님</b></span></div>
  <div class="foot">승인된 학생만 입장할 수 있어요.<br>입장이 안 되면 선생님께 승인을 요청하세요 🙂<br><span id="verBadge" style="color:#cbd5e1"></span></div>
</div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════
   ★ 선생님 설정 구역 ★
   1) 배포가이드.md 를 따라 구글시트 + Apps Script 를 만들고
   2) 발급받은 웹 앱 URL(https://script.google.com/macros/s/.../exec)을
      아래 따옴표 안에 붙여넣어 주세요.
   ════════════════════════════════════════════════════════ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3Ay-gudjjSoRlngyu54umJ9uYRAKhINuwcv229UZUN9_oIQfm9vwAxM32FOPR9wV1/exec";   // ← 여기에 붙여넣기!

/* 자료 목록은 nav.js 의 GEO_CONFIG.ACTIVITIES 에서 관리합니다 */
/* ════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const gate=$('gate'), menu=$('menu'), msg=$('msg'), btn=$('enterBtn');

function showMsg(cls, html){ msg.className='msg show '+cls; msg.innerHTML=html; }
function hideMsg(){ msg.className='msg'; }

function doneList(){
  try{ return JSON.parse(localStorage.getItem('geoDone')||'[]'); }catch(e){ return []; }
}
const ico = o => o.img ? `<img class="icoImg" src="${o.img}" alt="">` : o.icon;
function renderActs(){
  const done = doneList();
  const acts = GEO_CONFIG.ACTIVITIES;
  const open = (()=>{ try{ return JSON.parse(sessionStorage.getItem('geoOpenGrp')||'[]'); }catch(e){ return []; } })();
  const html = GEO_CONFIG.HOME_GROUPS.map(g=>{
    const kids = acts.filter(a=>a.grp===g.key);
    if(kids.length===1 && g.key==='conic'){                       // 단일 활동 → 바로 이동
      const k = kids[0], d = done.includes(k.id);
      return `<a class="mat${d?' done':''}" href="${k.href}">
         <div class="t">${ico(g)} ${g.title}</div>
         ${d? '<div class="stamp">완료</div>':''}
       </a>`;
    }
    const allDone = kids.length>0 && kids.every(k=>done.includes(k.id));
    const isOpen = open.includes(g.key);
    return `<div class="mat grpHead${allDone?' done':''}${isOpen?' open':''}" data-grp="${g.key}">
         <div class="t">${ico(g)} ${g.title}<span class="arw">▼</span></div>
         ${allDone? '<div class="stamp">완료</div>':''}
       </div>
       <div class="subList${isOpen?' open':''}" data-sub="${g.key}">
         ${kids.map(k=>{
            const d = done.includes(k.id);
            return `<a class="subItem${d?' done':''}" href="${k.href}">
              <span class="ic">${ico(k)}</span>${k.curve || k.title}
              ${d? '<span class="chk">완료 ✓</span>':''}</a>`;
         }).join('')}
       </div>`;
  }).join('');
  $('matList').innerHTML = html;
  $('matList').querySelectorAll('.grpHead').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.grp;
      const sub = $('matList').querySelector('.subList[data-sub="'+key+'"]');
      const nowOpen = !el.classList.contains('open');
      el.classList.toggle('open', nowOpen);
      sub.classList.toggle('open', nowOpen);
      let arr = [];
      try{ arr = JSON.parse(sessionStorage.getItem('geoOpenGrp')||'[]'); }catch(e){}
      arr = arr.filter(k=>k!==key);
      if(nowOpen) arr.push(key);
      sessionStorage.setItem('geoOpenGrp', JSON.stringify(arr));
    });
  });
}
function showView(){
  const home = location.hash === '#home';
  $('tocView').style.display  = home ? 'none' : 'block';
  $('homeView').style.display = home ? 'block' : 'none';
  if(home) renderActs();
}
function openMenu(name){
  localStorage.setItem('geoAppOk','1');             // 이 아이패드에서 로그인 유지
  // 책갈피 이어보기: 앱을 '새로 열었을 때' 한 번만 (홈 버튼 등 #home 이동 시에는 생략)
  const bm = localStorage.getItem('geoBookmark');
  if(!location.hash && bm && sessionStorage.getItem('geoResumed') !== '1'){
    const act = GEO_CONFIG.ACTIVITIES.find(a=>a.id===bm);
    if(act){ sessionStorage.setItem('geoResumed','1'); location.replace(act.href); return; }
  }
  sessionStorage.setItem('geoResumed','1');
  $('helloName').textContent = name;
  showView();
  gate.style.display='none';
  menu.classList.add('show');
  window.GEO_addGButton();                          // 우측 상단 지오지브라 바로가기
  window.GEO_addExtraButtons();                     // 💬 질문 · 📸 나의 과제방
}
function hardLogout(){
  localStorage.removeItem('geoAppOk');
  localStorage.removeItem('geoSid'); localStorage.removeItem('geoName');
  localStorage.removeItem('geoBookmark'); localStorage.removeItem('geoDone');
  sessionStorage.removeItem('geoResumed');
  location.hash=''; location.reload();
}
window.addEventListener('hashchange', ()=>{ if(menu.classList.contains('show')) showView(); });

async function checkApproval(sid, name){
  const url = APPS_SCRIPT_URL + '?sid=' + encodeURIComponent(sid) + '&name=' + encodeURIComponent(name);
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 12000);
  try{
    const res = await fetch(url, {signal:ctrl.signal});
    return await res.json();          // {status:'approved'|'pending'|'new'}
  } finally { clearTimeout(timer); }
}

async function tryEnter(silent){
  const sid = $('sid').value.trim(), name = $('name').value.trim();
  if(!sid || !name){ if(!silent) showMsg('err','학번과 이름을 모두 입력해 주세요.'); return; }

  if(!APPS_SCRIPT_URL){               // 설정 전 테스트 모드
    localStorage.setItem('geoSid',sid); localStorage.setItem('geoName',name);
    openMenu(name); return;
  }
  btn.disabled=true; if(!silent) showMsg('wait','승인 명단을 확인하는 중이에요…');
  try{
    const r = await checkApproval(sid, name);
    if(r.status==='approved'){
      localStorage.setItem('geoSid',sid); localStorage.setItem('geoName',name);
      hideMsg(); openMenu(name);
    } else if(r.status==='new'){
      showMsg('ok','✅ 입장 신청이 접수됐어요!<br>선생님이 승인하면 들어올 수 있어요. 잠시 후 다시 <b>입장하기</b>를 눌러 보세요.');
    } else {
      showMsg('wait','⏳ 아직 승인 대기 중이에요.<br>선생님이 승인하면 바로 입장할 수 있어요.');
    }
  }catch(e){
    if(!silent) showMsg('err','승인 서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  }
  btn.disabled=false;
}

btn.addEventListener('click', ()=>tryEnter(false));
[$('sid'),$('name')].forEach(el=>el.addEventListener('keydown',e=>{ if(e.key==='Enter') tryEnter(false); }));

$('unit1').addEventListener('click', ()=>{ location.hash = '#home'; });
$('backToc').addEventListener('click', ()=>{ location.hash = '#toc'; });

$('logout').addEventListener('click', hardLogout);

document.getElementById('verBadge').textContent = GEO_CONFIG.VERSION;

/* 스플래시: 잠깐 보여주고 부드럽게 사라짐 (버전 글자는 index.html에 고정 표기) */
setTimeout(()=>{
  const sp = document.getElementById('splash');
  sp.classList.add('hide');
  setTimeout(()=>sp.remove(), 650);
}, 1400);

/* 로그인 유지: 승인받았던 학생은 즉시 입장 (백그라운드로 재확인만) */
window.addEventListener('load', ()=>{
  if(!APPS_SCRIPT_URL) $('setupWarn').style.display='block';
  const sid=localStorage.getItem('geoSid'), name=localStorage.getItem('geoName');
  if(sid && name){ $('sid').value=sid; $('name').value=name; }
  if(localStorage.getItem('geoAppOk')==='1' && sid && name){
    openMenu(name);                                  // 기다리지 않고 바로 입장
    if(APPS_SCRIPT_URL){
      checkApproval(sid, name).then(r=>{             // 승인 취소됐으면 내보내기
        if(r.status && r.status!=='approved') hardLogout();
      }).catch(()=>{});                              // 오프라인이면 그냥 통과
    }
  } else if(sid && name){
    tryEnter(true);
  }
});
</script>
</body>
</html>
