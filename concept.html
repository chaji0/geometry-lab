<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* 입장 가드 */
if (localStorage.getItem('geoAppOk') !== '1') location.replace('index.html');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="icon.svg">

<title>포물선 개념 정리</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    background:#f1f5fb; color:#1e293b; display:flex; flex-direction:column;
  }
  header {
    padding:9px 16px; background:#fff; border-bottom:1px solid #e2e8f0;
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  header h1 { font-size:18px; color:#0f172a; }
  header p { font-size:12px; color:#64748b; }
  #main { flex:1; display:flex; min-height:0; }

  /* ── 왼쪽: 개념 정리 ── */
  #panel {
    width:352px; flex:none; background:#fff; border-right:1px solid #e2e8f0;
    padding:16px; overflow-y:auto;
  }
  #panel h2 { font-size:15.5px; color:#0f172a; margin-bottom:10px; }
  #panel h2.dim { color:#94a3b8; margin-top:22px; }
  .figBox {
    border:1px solid #e2e8f0; border-radius:12px; padding:6px 8px; background:#fff;
    margin-bottom:12px; display:flex; justify-content:center;
  }
  .fcard i, .cond i { font-family:Georgia,'Times New Roman',serif; }
  .defBox {
    border:1px solid #e2e8f0; background:#f8fafc; border-radius:12px;
    padding:11px 13px; font-size:13px; color:#475569; line-height:1.7; margin-bottom:12px;
  }
  .defBox b { color:#0f172a; }
  .fcard {
    border:2px solid #e2e8f0; border-radius:14px; padding:13px 15px; margin-top:10px;
    cursor:pointer; background:#fbfdff; transition:all .15s; user-select:none;
  }
  .fcard .cond { font-size:13px; color:#475569; line-height:1.6; }
  .fcard .formula {
    font-size:24px; font-weight:800; margin:7px 0 4px; font-family:Georgia,'Times New Roman',serif;
    letter-spacing:.5px;
  }
  .fcard .now { font-size:12.3px; color:#64748b; line-height:1.6; }
  .fcard .tapHint { font-size:11.5px; color:#94a3b8; margin-top:5px; }
  #card1 .formula { color:#dc2626; }
  #card2 .formula { color:#2563eb; }
  #card1.on { border-color:#dc2626; background:#fef2f2; }
  #card2.on { border-color:#2563eb; background:#eff6ff; }
  .fcard sup { font-size:14px; }
  .soonBox {
    border:1px dashed #cbd5e1; border-radius:12px; padding:11px 13px;
    font-size:12.5px; color:#94a3b8; margin-top:8px;
  }

  /* ── 오른쪽: 그래프 ── */
  #graphSide { flex:1; min-width:0; display:flex; flex-direction:column; }
  #gwrap { flex:1; min-height:0; position:relative; }
  #graph { width:100%; height:100%; display:block; touch-action:none; }
  #pbar {
    padding:10px 16px; background:#fff; border-top:1px solid #e2e8f0;
    display:flex; align-items:center; gap:13px;
  }
  #pbar .pv { font-size:19px; font-weight:800; color:#0f172a; min-width:88px; }
  #pbar .pv span { color:#7c3aed; }
  #pbar input[type=range] { flex:1; accent-color:#7c3aed; height:30px; }
  #pbar .note { font-size:11.5px; color:#94a3b8; flex:none; }
  #quizBox {
    margin-top:10px; background:#fff; border:1.5px solid #bae6fd; border-radius:14px;
    padding:13px 14px;
  }
  #quizBox .qq { font-size:14px; font-weight:800; color:#0c4a6e; line-height:1.6; }
  #quizBox .qq i { font-family:Georgia,'Times New Roman',serif; }
  #quizBox textarea {
    width:100%; box-sizing:border-box; margin-top:9px; height:64px; padding:9px 11px;
    font-size:14px; font-family:inherit; border:1.5px solid #cbd5e1; border-radius:10px;
    outline:none; resize:vertical; background:#fbfdff; line-height:1.6;
  }
  #quizBox textarea:focus { border-color:#0284c7; }
  #quizBox .qState { margin-top:6px; font-size:11.5px; color:#94a3b8; }
  #quizBox .qState.ok { color:#059669; font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>포물선 개념 정리</h1>
  <p>식을 눌러 그래프를 켜고 끄면서, p 값을 움직여 보세요</p>
</header>

<div id="main">
  <div id="panel">
    <h2>1. 포물선의 방정식</h2>
    <div class="figBox">
      <svg viewBox="0 0 230 185" style="width:100%;max-width:270px">
        <!-- 준선 l -->
        <line x1="55" y1="10" x2="55" y2="162" stroke="#2ea7d8" stroke-width="3.2"/>
        <text x="47" y="16" font-family="Georgia" font-style="italic" font-size="14" fill="#111">l</text>
        <!-- 축 -->
        <line x1="14" y1="95" x2="222" y2="95" stroke="#475569" stroke-width="1.6"/>
        <!-- 포물선 -->
        <path d="M 140.8 17 Q 19.2 95 140.8 173" fill="none" stroke="#e8442e" stroke-width="3"/>
        <!-- P에서 준선·초점까지 (같은 길이) -->
        <line x1="112" y1="38" x2="56.5" y2="38" stroke="#334155" stroke-width="1.5"/>
        <path d="M 62 38 l 0 -6 l -6 0" fill="none" stroke="#334155" stroke-width="1.3"/>
        <line x1="112" y1="38" x2="105" y2="95" stroke="#334155" stroke-width="1.5"/>
        <!-- 같은 길이 표시 -->
        <g stroke="#334155" stroke-width="1.4">
          <line x1="82" y1="34" x2="80" y2="42"/><line x1="87" y1="34" x2="85" y2="42"/>
          <line x1="104.5" y1="64" x2="112.5" y2="66"/><line x1="103.5" y1="69" x2="111.5" y2="71"/>
        </g>
        <circle cx="112" cy="38" r="2.6" fill="#334155"/>
        <!-- 초점 F, 꼭짓점 -->
        <circle cx="105" cy="95" r="3.4" fill="#111"/>
        <text x="99" y="111" font-family="Georgia" font-size="13.5" fill="#111">F</text>
        <circle cx="80" cy="95" r="2.6" fill="#e8442e"/>
        <!-- 라벨 -->
        <g font-size="11.5" font-weight="700" text-anchor="middle">
          <line x1="34" y1="66" x2="78" y2="92" stroke="#c4b5fd" stroke-width="1"/>
          <rect x="8" y="52" width="52" height="17" rx="8" fill="#ede9fe"/>
          <text x="34" y="64.5" fill="#6d28d9">꼭짓점</text>
          <line x1="152" y1="76" x2="109" y2="93" stroke="#86efac" stroke-width="1"/>
          <rect x="132" y="62" width="40" height="17" rx="8" fill="#dcfce7"/>
          <text x="152" y="74.5" fill="#15803d">초점</text>
          <rect x="182" y="103" width="30" height="17" rx="8" fill="#ffedd5"/>
          <text x="197" y="115.5" fill="#c2410c">축</text>
          <line x1="30" y1="140" x2="54" y2="130" stroke="#93c5fd" stroke-width="1"/>
          <rect x="8" y="140" width="40" height="17" rx="8" fill="#dbeafe"/>
          <text x="28" y="152.5" fill="#1d4ed8">준선</text>
        </g>
      </svg>
    </div>

    <div class="fcard on" id="card1">
      <div class="cond">(1) 초점이 <b>F(<i>p</i>, 0)</b>, 준선이 <b><i>x</i> = −<i>p</i></b> 인 포물선</div>
      <div class="formula"><i>y</i><sup>2</sup> = 4<i>px</i> <span style="font-size:13px;color:#94a3b8">(단, <i>p</i> ≠ 0)</span></div>
      <div class="now" id="now1"></div>
    </div>

    <div class="fcard" id="card2">
      <div class="cond">(2) 초점이 <b>F(0, <i>p</i>)</b>, 준선이 <b><i>y</i> = −<i>p</i></b> 인 포물선</div>
      <div class="formula"><i>x</i><sup>2</sup> = 4<i>py</i> <span style="font-size:13px;color:#94a3b8">(단, <i>p</i> ≠ 0)</span></div>
      <div class="now" id="now2"></div>
    </div>

    <h2 class="dim">2. 접선의 방정식</h2>
    <div class="soonBox">추후 공개 — 먼저 포물선과 친해져 봅시다 🙂</div>
  </div>

  <div id="graphSide">
    <div id="gwrap"><canvas id="graph"></canvas></div>
    <div id="pbar">
      <div class="pv">p = <span id="pVal">1</span></div>
      <input type="range" id="pSlider" min="-3" max="3" step="0.1" value="1">
      <div class="note">p ≠ 0</div>
    </div>
    <div id="quizBox">
      <div class="qq">질문. <i>p</i> (<i>p</i> ≠ 0)의 값에 따라 포물선의 모양이 어떻게 변하나요?</div>
      <textarea id="qAns" placeholder="슬라이더를 움직이며 관찰한 것을 적어 보세요"></textarea>
      <div class="qState" id="qState">답을 적으면 자동으로 저장돼요 ✏️</div>
    </div>
  </div>
</div>

<script>
'use strict';
const cv = document.getElementById('graph');
const ctx = cv.getContext('2d');
let p = 1;
let show1 = true, show2 = false;
let dirty = true;

const fmt = v => {
  const r = Math.round(v*10)/10;
  return (Object.is(r,-0)?0:r).toString();
};

/* ── 좌표계 ── */
function view(){
  const w = cv.clientWidth, h = cv.clientHeight;
  const s = Math.min(w, h) / 9.6;          // ±4.8 범위
  return { w, h, s, cx: w/2, cy: h/2 };
}
const X = (v,x)=> v.cx + x*v.s;
const Y = (v,y)=> v.cy - y*v.s;

function draw(){
  const w = cv.clientWidth, h = cv.clientHeight;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h);
  const v = view();
  const xmax = (w/2)/v.s, ymax = (h/2)/v.s;

  /* 격자 */
  ctx.strokeStyle = '#eef2f7'; ctx.lineWidth = 1;
  for(let i=Math.ceil(-xmax); i<=xmax; i++){
    if(i===0) continue;
    ctx.beginPath(); ctx.moveTo(X(v,i),0); ctx.lineTo(X(v,i),h); ctx.stroke();
  }
  for(let i=Math.ceil(-ymax); i<=ymax; i++){
    if(i===0) continue;
    ctx.beginPath(); ctx.moveTo(0,Y(v,i)); ctx.lineTo(w,Y(v,i)); ctx.stroke();
  }

  /* 축 */
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0,v.cy); ctx.lineTo(w,v.cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(v.cx,0); ctx.lineTo(v.cx,h); ctx.stroke();
  ctx.fillStyle = '#334155';
  ctx.beginPath(); ctx.moveTo(w-2,v.cy); ctx.lineTo(w-12,v.cy-5); ctx.lineTo(w-12,v.cy+5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(v.cx,2); ctx.lineTo(v.cx-5,12); ctx.lineTo(v.cx+5,12); ctx.fill();

  /* 눈금 + 숫자 */
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#64748b';
  ctx.textAlign = 'center';
  for(let i=Math.ceil(-xmax); i<=xmax; i++){
    if(i===0) continue;
    ctx.beginPath(); ctx.moveTo(X(v,i), v.cy-4); ctx.lineTo(X(v,i), v.cy+4);
    ctx.strokeStyle='#334155'; ctx.lineWidth=1.2; ctx.stroke();
    if(Math.abs(i)<=8) ctx.fillText(i, X(v,i), v.cy+18);
  }
  ctx.textAlign = 'right';
  for(let i=Math.ceil(-ymax); i<=ymax; i++){
    if(i===0) continue;
    ctx.beginPath(); ctx.moveTo(v.cx-4, Y(v,i)); ctx.lineTo(v.cx+4, Y(v,i));
    ctx.strokeStyle='#334155'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.fillText(i, v.cx-8, Y(v,i)+4);
  }
  ctx.fillText('O', v.cx-7, v.cy+16);
  ctx.font = 'italic bold 15px Georgia'; ctx.fillStyle='#334155';
  ctx.textAlign='left';
  ctx.fillText('x', w-16, v.cy-10);
  ctx.fillText('y', v.cx+10, 16);
  ctx.textAlign='left';

  const label = (text,color,x,y,align)=>{
    ctx.font = 'bold 13.5px sans-serif'; ctx.textAlign = align||'left';
    ctx.lineJoin='round'; ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.lineWidth=4;
    ctx.strokeText(text,x,y); ctx.fillStyle=color; ctx.fillText(text,x,y);
    ctx.textAlign='left';
  };
  const dot = (x,y,c)=>{
    ctx.beginPath(); ctx.arc(x,y,5.5,0,7); ctx.fillStyle=c; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.8; ctx.stroke();
  };

  /* (1) y² = 4px — 빨강 */
  if(show1){
    ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 3;
    ctx.beginPath();
    let started = false;
    const yr = ymax + 0.5;
    for(let t=-yr; t<=yr; t+=0.02){
      const x = t*t/(4*p);
      if(Math.abs(x) > xmax + 0.5){ started=false; continue; }
      const sx = X(v,x), sy = Y(v,t);
      if(!started){ ctx.moveTo(sx,sy); started=true; } else ctx.lineTo(sx,sy);
    }
    ctx.stroke();
    // 준선 x = -p
    ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2; ctx.setLineDash([8,6]);
    ctx.beginPath(); ctx.moveTo(X(v,-p), 0); ctx.lineTo(X(v,-p), h); ctx.stroke();
    ctx.setLineDash([]);
    // 초점
    dot(X(v,p), Y(v,0), '#dc2626');
    label(`F(${fmt(p)}, 0)`, '#b91c1c', X(v,p)+9, Y(v,0)-10);
    label(`x = ${fmt(-p)}`, '#b91c1c', X(v,-p)+6, 20);
  }

  /* (2) x² = 4py — 파랑 */
  if(show2){
    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 3;
    ctx.beginPath();
    let started = false;
    const xr = xmax + 0.5;
    for(let t=-xr; t<=xr; t+=0.02){
      const y = t*t/(4*p);
      if(Math.abs(y) > ymax + 0.5){ started=false; continue; }
      const sx = X(v,t), sy = Y(v,y);
      if(!started){ ctx.moveTo(sx,sy); started=true; } else ctx.lineTo(sx,sy);
    }
    ctx.stroke();
    // 준선 y = -p
    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2; ctx.setLineDash([8,6]);
    ctx.beginPath(); ctx.moveTo(0, Y(v,-p)); ctx.lineTo(w, Y(v,-p)); ctx.stroke();
    ctx.setLineDash([]);
    // 초점
    dot(X(v,0), Y(v,p), '#2563eb');
    label(`F(0, ${fmt(p)})`, '#1d4ed8', X(v,0)+10, Y(v,p)-9);
    label(`y = ${fmt(-p)}`, '#1d4ed8', 10, Y(v,-p)-7);
  }
}

/* ── 상태 갱신 ── */
const card1 = document.getElementById('card1'), card2 = document.getElementById('card2');
const now1 = document.getElementById('now1'), now2 = document.getElementById('now2');
const pVal = document.getElementById('pVal'), pSlider = document.getElementById('pSlider');

function updateNow(){
  pVal.textContent = fmt(p);
  now1.innerHTML = show1
    ? `현재: <b style="color:#dc2626"><i>y</i>² = ${fmt(4*p)}<i>x</i></b> · 초점 F(${fmt(p)}, 0) · 준선 <i>x</i> = ${fmt(-p)}`
    : '&nbsp;';
  now2.innerHTML = show2
    ? `현재: <b style="color:#2563eb"><i>x</i>² = ${fmt(4*p)}<i>y</i></b> · 초점 F(0, ${fmt(p)}) · 준선 <i>y</i> = ${fmt(-p)}`
    : '&nbsp;';
}
card1.addEventListener('click', ()=>{ show1=!show1; card1.classList.toggle('on',show1); updateNow(); dirty=true; });
card2.addEventListener('click', ()=>{ show2=!show2; card2.classList.toggle('on',show2); updateNow(); dirty=true; });

let lastP = 1;
pSlider.addEventListener('input', ()=>{
  let val = parseFloat(pSlider.value);
  if(Math.abs(val) < 0.05){                 // p ≠ 0 : 0을 건너뛰기
    val = lastP > 0 ? -0.1 : 0.1;
    pSlider.value = val;
  }
  p = val; lastP = val;
  updateNow(); dirty = true;
});

/* ── 루프 ── */
let lastW=0, lastH=0;
(function tick(){
  requestAnimationFrame(tick);
  if(cv.clientWidth!==lastW || cv.clientHeight!==lastH){ lastW=cv.clientWidth; lastH=cv.clientHeight; dirty=true; }
  if(dirty){ dirty=false; draw(); }
})();
updateNow();
</script>
<script>window.PAGE_ID="concept";</script>
<script src="nav.js"></script>
<script>
/* 완료 도장 과제: p 슬라이더 움직이기 + 질문 답 채우기 (5자 이상) */
(function(){
  const sid = localStorage.getItem('geoSid') || 'guest';
  const AKEY = 'geo.ans.concept.' + sid;
  const ta = document.getElementById('qAns');
  const st = document.getElementById('qState');
  const saved = localStorage.getItem(AKEY);
  function judge(){
    const ok = ta.value.trim().length >= 5;
    st.textContent = ok ? '저장했어요 ✓ (완료 조건 달성!)' : '답을 적으면 자동으로 저장돼요 ✏️';
    st.className = 'qState' + (ok ? ' ok' : '');
    if(ok && window.GEO_task) GEO_task('answer');
  }
  if(saved){ ta.value = saved; judge(); }
  let tm = null;
  ta.addEventListener('input', () => {
    clearTimeout(tm);
    tm = setTimeout(() => {
      try{ localStorage.setItem(AKEY, ta.value); }catch(e){}
      judge();
    }, 350);
  });
  document.getElementById('pSlider').addEventListener('input', () => {
    if(window.GEO_task) GEO_task('slider');
  }, { once:false });
})();
</script>
</body>
</html>
