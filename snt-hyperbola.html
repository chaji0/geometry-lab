:root{--paper:#EFEFE3;--ink:#23241D;--dim:#A8A79A;--line:#DCDACD;--line2:#C7C5B6;--acc:#2F45EC;--acc2:#1B2FC4;--card:#F5F5EC;--red:#D9463F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:14.5px;line-height:1.55;padding:14px 16px 90px}
.wrap{max-width:1040px;margin:0 auto}
h1{font-size:17px;font-weight:600;margin:4px 0 12px;letter-spacing:-.01em}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
#tabs button{height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--line2);background:transparent;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.06em;cursor:pointer}
#tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.card{background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:16px 18px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.badge{background:var(--acc);color:#fff;border-radius:12px;padding:2px 11px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em}
.meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.06em}
.qtext{font-size:14.5px;line-height:1.9;word-break:keep-all}
.choices{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:8px}
.choices span{white-space:nowrap}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
.work.nofig{grid-template-columns:1fr}
.fig svg{width:100%;height:auto;display:block;max-height:520px}
.fig{position:sticky;top:10px}
.sbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sbtns button{height:34px;padding:0 15px;border-radius:17px;border:1.5px solid var(--line2);background:transparent;color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;cursor:pointer;transition:all .15s}
.sbtns button:hover{border-color:var(--acc);color:var(--acc)}
.sbtns button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hint{border-left:3px solid var(--acc);background:#E9E9DC;border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:8px;line-height:2;word-break:keep-all;animation:fin .25s ease}
.hint b{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--acc);letter-spacing:.08em;font-weight:500;display:block;line-height:1.4;margin-bottom:2px}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ov{opacity:0;transition:opacity .3s}
.ov.show{opacity:1}
.katex{font-size:1.06em}
.fbtn{height:34px;padding:0 15px;border-radius:17px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:12.5px;font-weight:500;cursor:pointer;margin-right:4px}
.fbtn.on{background:var(--ink);color:var(--paper)}
.fig.three canvas{width:100%;height:430px;display:block;touch-action:none;cursor:grab}
.fig.three canvas:active{cursor:grabbing}
.rst{margin-top:6px;height:28px;padding:0 12px;border-radius:14px;border:1.5px solid var(--line2);background:transparent;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
.rst:hover{border-color:var(--acc);color:var(--acc)}
.fig.gated{display:none}.fig.gated.open{display:block}
.fig.dyn{display:none}.fig.dyn.open{display:block}
.fig:not(.built) .ov{opacity:0!important}
.cs{opacity:0;transition:opacity .35s}.cs.on{opacity:1}
.cs .dr{stroke-dasharray:1;stroke-dashoffset:1}.cs.on .dr{animation:dr .9s ease forwards}
.fig.built .dr{animation:none!important;stroke-dasharray:none!important;stroke-dashoffset:0!important}
@keyframes dr{to{stroke-dashoffset:0}}
.tctl{margin-top:10px;display:none}.fig.built .tctl{display:block}
.trow{display:flex;gap:18px;align-items:baseline;font-family:Georgia,'Times New Roman',serif;font-size:16px;min-height:24px}
.dv{color:var(--red)}
.trk{position:relative;height:26px;margin-top:4px}
.trk input{position:absolute;inset:0;width:100%;margin:0;accent-color:var(--acc);background:transparent}
.band{z-index:2;pointer-events:none;position:absolute;top:9px;height:8px;border-radius:4px;background:rgba(217,70,63,.28)}
.tks{margin:0 8px;position:relative;height:18px;font-family:Georgia,serif;font-size:13px;color:var(--dim)}
.cond{margin:8px 0 2px;padding:8px 14px;border:1px solid var(--line2);border-radius:10px;line-height:2}
.srow{display:flex;align-items:center;gap:10px}.srow .trk{flex:1}.sl{font-family:Georgia,serif;font-size:16px;width:14px}.sk{margin-left:32px}
.tks span{position:absolute;transform:translateX(-50%)}
@media (max-width:760px){.work{grid-template-columns:1fr}.fig{position:static}}

const state={};
const tabs=document.getElementById('tabs'),box=document.getElementById('probs');
DATA.forEach((p,i)=>{
  state[p.no]=0;
  const b=document.createElement('button');b.textContent=p.no;b.onclick=()=>show(i);tabs.appendChild(b);
  const c=document.createElement('div');c.className='card';c.id='p'+p.no;c.style.display='none';
  let h=`<div class="head"><span class="badge">${p.no}</span><span class="meta">${CH}강 · ${p.page}쪽 · ${p.code}</span></div>`;
  h+=`<div class="qtext">${p.q}</div>`;
  if(p.ch){h+='<div class="choices">'+p.ch.map((c,j)=>`<span>${'①②③④⑤'[j]} ${c}</span>`).join('')+'</div>'}
  h+=`<div class="work ${(p.img||p.dyn||p.three)?'':'nofig'}">`;
  if(p.dyn){h+=`<div class="fig dyn">${FIG[p.no]()}</div>`}
  if(p.three){h+=`<div class="fig built three${p.gate?' gated':''}"><canvas></canvas><button class="rst">처음 시점</button></div>`}
  if(p.img){
    const pd=p.pad;
    let s=`<svg viewBox="${-pd} ${-pd} ${p.w+2*pd} ${p.h+2*pd}" xmlns="http://www.w3.org/2000/svg"><image href="${p.src}" x="0" y="0" width="${p.w}" height="${p.h}"/>`;
    p.steps.forEach((st,k)=>{if(st[1].length)s+=`<g class="ov" data-k="${k+1}">${st[1].join('')}</g>`});
    s+='</svg>';h+=`<div class="fig built">${s}</div>`;
  }
  h+='<div><div class="sbtns">'+((p.dyn||p.gate)?'<button class="fbtn">그림</button>':'')+p.steps.map((_,k)=>`<button data-k="${k+1}">STEP ${k+1}</button>`).join('')+'</div><div class="hints"></div></div></div>';
  c.innerHTML=h;box.appendChild(c);
  if(p.three)init3d(c,p.no);
  if(p.dyn){if(window['init'+p.no])window['init'+p.no](c);c.querySelector('.fbtn').onclick=()=>build(c)}
  else if(p.gate){const fb=c.querySelector('.fbtn');fb.onclick=()=>{const f=c.querySelector('.fig');const on=f.classList.toggle('open');fb.classList.toggle('on',on);if(on&&c._draw3d)c._draw3d(state[p.no]||0)}}
  c.querySelectorAll('.sbtns button[data-k]').forEach(bt=>bt.onclick=()=>{const k=+bt.dataset.k;state[p.no]=(state[p.no]===k)?k-1:k;upd(p,c);if(typeof GEO_task==='function')GEO_task('sn-step')});
});
function upd(p,c){
  const n=state[p.no];
  c.querySelectorAll('.sbtns button[data-k]').forEach(bt=>bt.classList.toggle('on',+bt.dataset.k<=n));
  if(c._draw3d)c._draw3d(n);
  c.querySelectorAll('.ov').forEach(g=>g.classList.toggle('show',+g.dataset.k<=n));
  const hs=c.querySelector('.hints');const have=hs.children.length;
  while(hs.children.length>n)hs.lastChild.remove();
  for(let k=have;k<n;k++){const d=document.createElement('div');d.className='hint';d.innerHTML=`<b>STEP ${k+1}</b>${p.steps[k][0]}`;hs.appendChild(d)}
}
function build(c){const f=c.querySelector('.fig');const b=c.querySelector('.fbtn');
  clearTimeout(f._t);f.classList.add('open');f.classList.remove('built');b.classList.add('on');
  const g=[...f.querySelectorAll('.cs')];g.forEach(e=>e.classList.remove('on'));
  const n=Math.max(...g.map(e=>+e.dataset.c));let i=1;
  const go=()=>{g.filter(e=>+e.dataset.c===i).forEach(e=>e.classList.add('on'));i++;f._t=setTimeout(i<=n?go:()=>f.classList.add('built'),i<=n?800:900)};go()}
function show(i){
  DATA.forEach((p,j)=>{const el=document.getElementById('p'+p.no);el.style.display=i===j?'':'none';if(i===j&&el._draw3d)el._draw3d(state[p.no]||0);tabs.children[j].classList.toggle('on',i===j)});
}
show(0);
