<body>
<header>
  <div><h1>두 점 사이의 거리</h1></div>
</header>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tools"><button class="btn sm" id="bView">시점</button></div>
    <div id="hud"></div>
  </div>
  <div id="panel">
    <div class="card">
      <h2>좌표공간에서 두 점 사이의 거리</h2>
      <div class="stmt">좌표공간에서 두 점 A(<i class="m">x</i><sub>1</sub>, <i class="m">y</i><sub>1</sub>, <i class="m">z</i><sub>1</sub>), B(<i class="m">x</i><sub>2</sub>, <i class="m">y</i><sub>2</sub>, <i class="m">z</i><sub>2</sub>) 사이의 거리는</div>
      <div class="eqrow">
        <button class="gb" id="bAB"></button>
        <span>=</span>
        <button class="gb" id="bRt"></button>
      </div>
      <div class="note">세 모서리의 길이가 <i>a</i>, <i>b</i>, <i>c</i>인 직육면체의 대각선의 길이는 <span class="sq2">√<span class="r"><i>a</i><sup>2</sup> + <i>b</i><sup>2</sup> + <i>c</i><sup>2</sup></span></span>이다.</div>
      <svg class="gfig" viewBox="0 0 300 150" width="100%" style="max-width:300px; display:block; margin:10px auto 0" fill="none" stroke="#A8A79A" stroke-width="1.3" stroke-linejoin="round">
        <g font-family="Georgia,serif" font-style="italic" font-size="14" fill="#A8A79A" stroke="none">
          <text x="120" y="142">a</text><text x="212" y="108">b</text><text x="248" y="70">c</text>
          <text x="22" y="32" font-style="normal" font-size="13">√(<tspan font-style="italic">a</tspan><tspan font-size="9" dy="-6">2</tspan><tspan dy="6">+</tspan><tspan font-style="italic">b</tspan><tspan font-size="9" dy="-6">2</tspan><tspan dy="6">+</tspan><tspan font-style="italic">c</tspan><tspan font-size="9" dy="-6">2</tspan><tspan dy="6">)</tspan></text>
        </g>
        <path d="M60 125 L180 125 L180 55 L60 55 Z"/>
        <path d="M60 55 L110 25 L230 25 L180 55 M230 25 L230 95 L180 125"/>
        <path d="M60 125 L110 95 L230 95 M110 95 L110 25" stroke-dasharray="4 3"/>
        <path d="M60 125 L230 25" stroke-width="1.8"/>
      </svg>
    </div>
  </div>
</div>
<script>
/* g3d.js — 기하 탐구실 공간도형용 작은 캔버스 3D 엔진 (z 축이 위) */
"use strict";
const V3={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];},
  mid:(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2],
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t],
  dist:(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]),
  centroid:pts=>{let c=[0,0,0]; pts.forEach(p=>c=V3.add(c,p)); return V3.mul(c,1/pts.length);},
  normal:(a,b,c)=>V3.norm(V3.cross(V3.sub(b,a),V3.sub(c,a))),
  rot:(a,axis,th)=>{const k=V3.norm(axis),c=Math.cos(th),s=Math.sin(th);
    return V3.add(V3.add(V3.mul(a,c),V3.mul(V3.cross(k,a),s)),V3.mul(k,V3.dot(k,a)*(1-c)));}
};
const DEG=Math.PI/180;
const fmt=(x,n=2)=>(Math.abs(x)<5e-3?0:x).toFixed(n);
const $=id=>document.getElementById(id);
const chip=(k,v)=>'<div class="chip"><i>'+k+'</i>'+v+'</div>';
const INK='#23241D', BLU='#2F45EC', DIM='#A8A79A', ORG='#E0891A', GRN='#12876A', RED='#D9463F', VIO='#7A3FB5', PAPER='#EFEFE3', LINE='#DCDACD';
const KOR="'IBM Plex Sans KR','Apple SD Gothic Neo',system-ui,sans-serif";
const SERIF="Georgia,'Times New Roman',serif";
const HALO='rgba(239,239,227,.92)';
const F={ plane:'rgba(35,36,29,.07)', planeEdge:'rgba(35,36,29,.55)', plane2:'rgba(47,69,236,.09)', plane2Edge:'rgba(47,69,236,.6)',
          plane3:'rgba(224,137,26,.13)', plane3Edge:'rgba(224,137,26,.75)', plane4:'rgba(18,135,106,.11)', plane4Edge:'rgba(18,135,106,.7)',
          solid:'rgba(35,36,29,.045)', solidBack:'rgba(35,36,29,.025)', hidden:'rgba(35,36,29,.42)' };

const G3D={
create(cv,opts){
  opts=opts||{};
  const ctx=cv.getContext('2d');
  const g={cv,ctx,W:1,H:1,DPR:1,
    cam:Object.assign({dist:16,az:-0.55,el:0.5,target:[0,0,1.2],fov:40},opts.cam||{}),
    EYE:[0,0,0],FW:[1,0,0],RT:[0,1,0],UP:[0,0,1],FOC:1,
    onPick:null,onDrag:null,onUp:null,onClick:null, minDist:5,maxDist:60, elMin:-0.2, elMax:1.5};
  g.resize=function(){ g.DPR=Math.min(window.devicePixelRatio||1,2.5); const r=cv.getBoundingClientRect();
    g.W=Math.max(1,Math.round(r.width)); g.H=Math.max(1,Math.round(r.height)); cv.width=Math.round(g.W*g.DPR); cv.height=Math.round(g.H*g.DPR); ctx.setTransform(g.DPR,0,0,g.DPR,0,0); };
  g.updateCam=function(){ const c=g.cam;
    g.EYE=[c.target[0]+c.dist*Math.cos(c.el)*Math.cos(c.az), c.target[1]+c.dist*Math.cos(c.el)*Math.sin(c.az), c.target[2]+c.dist*Math.sin(c.el)];
    g.FW=V3.norm(V3.sub(c.target,g.EYE)); g.RT=V3.norm(V3.cross(g.FW,[0,0,1])); g.UP=V3.cross(g.RT,g.FW);
    g.FOC=(Math.min(g.H,g.W*0.8)/2)/Math.tan(c.fov*DEG/2); };
  g.proj=function(p){ const v=V3.sub(p,g.EYE), z=V3.dot(v,g.FW); if(z<0.15) return null;
    return {x:g.W/2+V3.dot(v,g.RT)*g.FOC/z, y:g.H/2-V3.dot(v,g.UP)*g.FOC/z, z}; };
  g.depth=p=>V3.dot(V3.sub(p,g.EYE),g.FW);
  g.ray=function(px,py){ const d=V3.norm(V3.add(V3.add(V3.mul(g.RT,(px-g.W/2)/g.FOC),V3.mul(g.UP,-(py-g.H/2)/g.FOC)),g.FW)); return {o:g.EYE,d}; };
  g.near=function(p,px,py,r){ const q=g.proj(p); if(!q) return false; return Math.hypot(q.x-px,q.y-py)<(r||24); };

  g.clear=function(){ ctx.fillStyle=PAPER; ctx.fillRect(0,0,g.W,g.H); };
  g.seg=function(a,b,col,w,dash){ const A=g.proj(a),B=g.proj(b); if(!A||!B) return;
    ctx.save(); ctx.strokeStyle=col||INK; ctx.lineWidth=w||1.6; ctx.setLineDash(dash||[]); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke(); ctx.restore(); };
  g.poly=function(pts,fill,stroke,w,dash){ const ps=pts.map(g.proj); if(ps.some(p=>!p)) return;
    ctx.save(); ctx.beginPath(); ctx.moveTo(ps[0].x,ps[0].y); for(let i=1;i<ps.length;i++) ctx.lineTo(ps[i].x,ps[i].y); ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w||1.2;ctx.setLineDash(dash||[]);ctx.lineJoin='round';ctx.stroke();} ctx.restore(); };
  g.curve=function(pts,col,w,dash,close){ const ps=pts.map(g.proj); ctx.save(); ctx.strokeStyle=col||INK; ctx.lineWidth=w||1.6; ctx.setLineDash(dash||[]); ctx.lineJoin='round'; ctx.beginPath();
    let s=false; ps.forEach(p=>{ if(!p){s=false;return;} if(!s){ctx.moveTo(p.x,p.y);s=true;} else ctx.lineTo(p.x,p.y); }); if(close) ctx.closePath(); ctx.stroke(); ctx.restore(); };
  g.pt=function(p,label,col,dx,dy,r,italic){ const q=g.proj(p); if(!q) return; ctx.save();
    ctx.beginPath(); ctx.arc(q.x,q.y,r||4,0,7); ctx.fillStyle=col||INK; ctx.fill(); ctx.lineWidth=1.6; ctx.strokeStyle=PAPER; ctx.stroke();
    if(label){ ctx.font=(italic?'italic ':'')+'600 15px '+SERIF; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=4; ctx.strokeStyle=HALO; ctx.strokeText(label,q.x+(dx||0),q.y+(dy===undefined?-14:dy)); ctx.fillStyle=col||INK; ctx.fillText(label,q.x+(dx||0),q.y+(dy===undefined?-14:dy)); }
    ctx.restore(); };
  g.text=function(p,s,col,dx,dy,font,align){ const q=g.proj(p); if(!q) return; ctx.save(); ctx.font=font||('600 12.5px '+KOR); ctx.textAlign=align||'center'; ctx.textBaseline='middle';
    ctx.lineWidth=4; ctx.strokeStyle=HALO; ctx.strokeText(s,q.x+(dx||0),q.y+(dy||0)); ctx.fillStyle=col||INK; ctx.fillText(s,q.x+(dx||0),q.y+(dy||0)); ctx.restore(); };
  g.mathText=function(p,s,col,dx,dy,size){ g.text(p,s,col,dx,dy,'italic 600 '+(size||15)+'px '+SERIF); };
  g.romanText=function(p,s,col,dx,dy,size){ g.text(p,s,col,dx,dy,'600 '+(size||14)+'px '+SERIF); };
  g.text2=function(x,y,s,col,font,align){ ctx.save(); ctx.font=font||('600 12.5px '+KOR); ctx.textAlign=align||'left'; ctx.textBaseline='middle';
    ctx.lineWidth=4; ctx.strokeStyle=HALO; ctx.strokeText(s,x,y); ctx.fillStyle=col||INK; ctx.fillText(s,x,y); ctx.restore(); };
  g.midLabel=function(a,b,s,col,off,font){ const A=g.proj(a),B=g.proj(b); if(!A||!B) return; let dx=B.x-A.x,dy=B.y-A.y; const L=Math.hypot(dx,dy)||1; let nx=-dy/L,ny=dx/L; if(ny>0){nx=-nx;ny=-ny;}
    const o=off||13; g.text2((A.x+B.x)/2+nx*o,(A.y+B.y)/2+ny*o,s,col,font||('600 12px '+KOR),'center'); };
  g.rightMark=function(Vv,a,b,col,size){ if(V3.len(a)<1e-6||V3.len(b)<1e-6) return; const A=V3.norm(a),B=V3.norm(b),s=size||0.5;
    g.poly([V3.add(Vv,V3.mul(A,s)),V3.add(V3.add(Vv,V3.mul(A,s)),V3.mul(B,s)),V3.add(Vv,V3.mul(B,s))],null,col||INK,1.3); };
  g.arrow=function(a,b,col,w,head){ g.seg(a,b,col,w); const A=g.proj(a),B=g.proj(b); if(!A||!B) return; const h=head||9, dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
    ctx.save(); ctx.fillStyle=col||INK; ctx.beginPath(); ctx.moveTo(B.x,B.y); ctx.lineTo(B.x-ux*h-uy*h*0.5,B.y-uy*h+ux*h*0.5); ctx.lineTo(B.x-ux*h+uy*h*0.5,B.y-uy*h-ux*h*0.5); ctx.closePath(); ctx.fill(); ctx.restore(); };
  g.solid=function(S,o){ o=o||{}; const P=S.V; const faces=S.F.map((f,i)=>{ const n=V3.normal(P[f[0]],P[f[1]],P[f[2]]); const c=V3.centroid(f.map(k=>P[k]));
      const vis=V3.dot(n,V3.sub(g.EYE,c))>0; return {i,f,n,c,vis,d:g.depth(c)}; });
    const edges={}; faces.forEach(fc=>{ const f=fc.f; for(let k=0;k<f.length;k++){ const a=f[k],b=f[(k+1)%f.length]; const key=a<b?a+'-'+b:b+'-'+a; edges[key]=edges[key]||{a,b,vis:false}; if(fc.vis) edges[key].vis=true; } });
    if(S.E) S.E.forEach(([a,b])=>{ const key=a<b?a+'-'+b:b+'-'+a; if(!edges[key]) edges[key]={a,b,vis:true}; });
    faces.filter(f=>!f.vis).sort((x,y)=>y.d-x.d).forEach(fc=>{ const col=(o.faceFill&&o.faceFill[fc.i]!==undefined)?o.faceFill[fc.i]:(o.back||F.solidBack); if(col) g.poly(fc.f.map(k=>P[k]),col,null); });
    if(!o.noHidden) Object.values(edges).filter(e=>!e.vis).forEach(e=>{ const key=e.a+'-'+e.b; const ec=o.edgeCol&&(o.edgeCol[key]||o.edgeCol[e.b+'-'+e.a]); g.seg(P[e.a],P[e.b],ec||o.hiddenCol||F.hidden,ec?(o.w||1.6):1.1,o.hidden===false?[]:[5,5]); });
    faces.filter(f=>f.vis).sort((x,y)=>y.d-x.d).forEach(fc=>{ const col=(o.faceFill&&o.faceFill[fc.i]!==undefined)?o.faceFill[fc.i]:(o.fill===undefined?F.solid:o.fill); if(col) g.poly(fc.f.map(k=>P[k]),col,null); });
    Object.values(edges).filter(e=>e.vis).forEach(e=>{ const key=e.a+'-'+e.b; const ec=o.edgeCol&&(o.edgeCol[key]||o.edgeCol[e.b+'-'+e.a]); g.seg(P[e.a],P[e.b],ec||o.edge||INK,ec?(o.w||2.4):(o.ew||1.6)); });
    return {faces,edges};
  };
  g.box=function(a,b,c,origin){ const o=origin||[-a/2,-b/2,0]; const V=[[0,0,0],[a,0,0],[a,b,0],[0,b,0],[0,0,c],[a,0,c],[a,b,c],[0,b,c]].map(p=>V3.add(p,o));
    return {V,F:[[3,2,1,0],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]]}; };

  let drag=null,last=null,pinch=null,down=null,moved=false; const touches=new Map();
  const local=ev=>{const r=cv.getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top];};
  cv.addEventListener('pointerdown',ev=>{ cv.setPointerCapture(ev.pointerId); const [px,py]=local(ev); touches.set(ev.pointerId,[px,py]);
    if(touches.size>1){ drag=null; last=null; return; }
    drag=g.onPick?g.onPick(px,py):null; last=[px,py]; down=[px,py]; moved=false; cv.style.cursor='grabbing'; });
  cv.addEventListener('pointermove',ev=>{ const [px,py]=local(ev);
    if(touches.has(ev.pointerId)) touches.set(ev.pointerId,[px,py]);
    if(touches.size===2){ const [a,b]=[...touches.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pinch) g.cam.dist=Math.max(g.minDist,Math.min(g.maxDist,g.cam.dist*pinch/d)); pinch=d; return; }
    if(!last) return; if(ev.pointerType==='mouse'&&ev.buttons===0){ last=null; return; }
    if(down&&Math.hypot(px-down[0],py-down[1])>4) moved=true;
    if(drag){ if(g.onDrag) g.onDrag(drag,g.ray(px,py),{px,py,dx:px-last[0],dy:py-last[1]}); }
    else{ if(g.onOrbit) g.onOrbit(); g.cam.az-=(px-last[0])*0.008; g.cam.el=Math.max(g.elMin,Math.min(g.elMax,g.cam.el+(py-last[1])*0.007)); }
    last=[px,py]; });
  const up=ev=>{ touches.delete(ev.pointerId); if(touches.size<2) pinch=null; if(drag&&g.onUp) g.onUp(drag);
    if(!moved&&down&&g.onClick&&touches.size===0) g.onClick(down[0],down[1],drag); drag=null; last=null; down=null; cv.style.cursor=''; };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); cv.addEventListener('pointerleave',ev=>{ if(!drag) last=null; });
  cv.addEventListener('wheel',e=>{ e.preventDefault(); g.cam.dist=Math.max(g.minDist,Math.min(g.maxDist,g.cam.dist*(1+Math.sign(e.deltaY)*0.09))); },{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  g.hover=null;
  cv.addEventListener('pointermove',ev=>{ if(last||!g.onPick) return; const [px,py]=local(ev); g.hover=g.onPick(px,py); cv.style.cursor=g.hover?'grab':''; });

  g.loop=function(fn){ let t0=performance.now(); const step=t=>{ const dt=Math.max(0,Math.min(0.05,(t-t0)/1000)); t0=t; g.updateCam(); fn(dt); requestAnimationFrame(step); };
    new ResizeObserver(()=>g.resize()).observe(cv.parentElement); g.resize(); requestAnimationFrame(step); };
  g.setView=function(az,el,dist,target){ g.cam.az=az; g.cam.el=el; if(dist) g.cam.dist=dist; if(target) g.cam.target=target; };
  return g;
}};
function geoTask(k){ if(typeof GEO_task==='function') GEO_task(k); }
function setupTabs(onChange){ const bs=[...document.querySelectorAll('#tabs button')]; bs.forEach(b=>b.onclick=()=>{ bs.forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.p===b.dataset.t)); const pn=document.getElementById('panel'); if(pn) pn.scrollTop=0; if(onChange) onChange(b.dataset.t); });
  return ()=>{ const b=bs.find(x=>x.classList.contains('on')); return b?b.dataset.t:null; }; }

</script>
<script>
const g=G3D.create($('cv'),{cam:{dist:21,az:0.5,el:0.3,target:[2.2,2.8,2],fov:38}});
g.minDist=8; g.maxDist=40;
const ease=t=>t<0?0:t>1?1:(t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const R=6.2;
const CAM0={az:0.5,el:0.3,dist:21,target:[2.2,2.8,2]};
const rgba=(r,gg,b,a)=>'rgba('+r+','+gg+','+b+','+a.toFixed(3)+')';
let fly=null;
function camFly(to,dur){ const c=g.cam; fly={from:{az:c.az,el:c.el,dist:c.dist,target:c.target.slice()},to,t:0,dur:dur||1}; }
function camStep(dt){ if(!fly) return; fly.t+=dt; const s=ease(fly.t/fly.dur); const a=fly.from,b=fly.to;
  g.cam.az=a.az+(b.az-a.az)*s; g.cam.el=a.el+(b.el-a.el)*s; g.cam.dist=a.dist+(b.dist-a.dist)*s; g.cam.target=V3.lerp(a.target,b.target,s); if(fly.t>=fly.dur) fly=null; }
g.onOrbit=()=>{ fly=null; };
$('bView').onclick=()=>camFly(CAM0,0.7);

function fontOf(pt,sz){ if(pt.sub) return '600 '+(sz*0.7)+'px '+SERIF; return pt.math?('italic 600 '+(sz+1)+'px '+SERIF):pt.rm?('600 '+(sz+0.5)+'px '+SERIF):('600 '+(sz-1.5)+'px '+KOR); }
function mixLabel(p,parts,col,dx,dy,size,align){ const q=g.proj(p); if(!q) return; const ctx=g.ctx; const sz=size||14.5;
  ctx.save(); ctx.textBaseline='middle'; ctx.textAlign='left';
  let w=0; parts.forEach(pt=>{ ctx.font=fontOf(pt,sz); w+=ctx.measureText(pt.s).width; });
  let x=q.x+(dx||0)-(align==='left'?0:align==='right'?w:w/2), y=q.y+(dy||0);
  parts.forEach(pt=>{ ctx.font=fontOf(pt,sz); const yy=y+(pt.sub?sz*0.3:0); ctx.lineWidth=4; ctx.strokeStyle=HALO; ctx.strokeText(pt.s,x,yy); ctx.fillStyle=col||INK; ctx.fillText(pt.s,x,yy); x+=ctx.measureText(pt.s).width; });
  ctx.restore(); }
const P=(name,sub)=>[{s:name,rm:true},{s:'(',rm:true},{s:'x',math:true},{s:sub,rm:true,sub:true},{s:', ',rm:true},{s:'y',math:true},{s:sub,rm:true,sub:true},{s:', ',rm:true},{s:'z',math:true},{s:sub,rm:true,sub:true},{s:')',rm:true}];
const ABS=v=>[{s:'|',rm:true},{s:v,math:true},{s:'2',rm:true,sub:true},{s:' − ',rm:true},{s:v,math:true},{s:'1',rm:true,sub:true},{s:'|',rm:true}];
function axes(){
  g.arrow([-R,0,0],[R+0.6,0,0],INK,1.5,9); g.arrow([0,-R,0],[0,R+0.6,0],INK,1.5,9); g.seg([0,0,0],[0,0,-R*0.6],INK,1.5); g.arrow([0,0,0],[0,0,R+0.6],INK,1.5,9);
  g.mathText([R+0.6,0,0],'x',INK,12,10,16); g.mathText([0,R+0.6,0],'y',INK,12,-2,16); g.mathText([0,0,R+0.6],'z',INK,-11,-8,16);
  g.romanText([0,0,0],'O',INK,-11,12,15); }
function gridXY(alpha){ const col=rgba(35,36,29,0.13*alpha); for(let i=-5;i<=6;i++){ if(i===0) continue; g.seg([i,-5,0],[i,6,0],col,1); g.seg([-5,i,0],[6,i,0],col,1); } }

const A=[1.5,2.5,1.5], B=[4.5,5.5,4.5]; const D=V3.sub(B,A);
const BOXF='rgba(18,135,106,.14)', BOXB='rgba(18,135,106,.07)', TEAL='rgba(18,135,106,.28)', TEALE='rgba(18,135,106,.8)';
/* 모션 1: v 0~3 직육면체, 3~4 선분 AB.  모션 2: w 0~1 면 두 개가 좌표평면으로 떨어짐, 1~1.3 라벨 */
const st={v:0,w:0,p1:false,p2:false,done1:false,done2:false};
$('bAB').onclick=()=>{ st.v=0; st.p1=true; st.w=0; st.p2=false; st.done2=false; $('bRt').classList.remove('done','on'); $('bRt').innerHTML=''; $('bAB').classList.add('on'); camFly(CAM0,0.7); };
$('bRt').onclick=()=>{ if(st.v<4){ st.v=4; st.p1=false; $('bAB').classList.add('done'); $('bAB').innerHTML='<span class="ov">AB</span>'; } st.w=0; st.p2=true; $('bRt').classList.add('on'); camFly(CAM0,0.7); };
function step(dt){ if(st.p1){ st.v+=dt/0.9; if(st.v>=4){ st.v=4; st.p1=false; } }
  if(st.p2){ st.w+=dt/1.6; if(st.w>=1.3){ st.w=1.3; st.p2=false; } } }
function draw(){
  gridXY(0.8); axes();
  const v=st.v, s1=ease(clamp(v,0,1)),s2=ease(clamp(v-1,0,1)),s3=ease(clamp(v-2,0,1)),s4=ease(clamp(v-3,0,1));
  const bx=D[0]*s1,by=D[1]*s2,bz=D[2]*s3;
  /* 모션 2: 밑면 → xy평면, 옆면(y=y1) → zx평면 */
  const w=ease(clamp(st.w,0,1)), wl=clamp(st.w-1,0,0.3)/0.3;
  if(st.w>0){ const z=A[2]*(1-w), y=A[1]*(1-w);
    const bot=[[A[0],A[1],z],[B[0],A[1],z],[B[0],B[1],z],[A[0],B[1],z]];
    const side=[[A[0],y,A[2]],[B[0],y,A[2]],[B[0],y,B[2]],[A[0],y,B[2]]];
    g.poly(bot,TEAL,TEALE,1.2); g.poly(side,TEAL,TEALE,1.2);
    if(w>0.98){ /* 투영 점선 */
      [[A[0],A[1]],[B[0],A[1]],[B[0],B[1]],[A[0],B[1]]].forEach(([x,y2])=>g.seg([x,y2,A[2]],[x,y2,0],'rgba(35,36,29,.45)',1.1,[4,4]));
      [[A[0],A[2]],[B[0],A[2]],[B[0],B[2]],[A[0],B[2]]].forEach(([x,z2])=>g.seg([x,A[1],z2],[x,0,z2],'rgba(35,36,29,.45)',1.1,[4,4])); }
    if(wl>0){ const col=rgba(35,36,29,wl);
      mixLabel([(A[0]+B[0])/2,B[1],0],ABS('x'),col,34,12,13.5);
      mixLabel([B[0],(A[1]+B[1])/2,0],ABS('y'),col,0,20,13.5);
      mixLabel([A[0],0,(A[2]+B[2])/2],ABS('z'),col,-40,0,13.5); } }
  /* 직육면체 */
  if(bz>0.02){ const S=g.box(bx,by,bz,A); g.solid(S,{fill:BOXF,back:BOXB,edge:'rgba(35,36,29,.75)',ew:1.5}); }
  else if(by>0.02){ g.poly([A,V3.add(A,[bx,0,0]),V3.add(A,[bx,by,0]),V3.add(A,[0,by,0])],BOXF,'rgba(35,36,29,.75)',1.5); }
  const p=V3.add(A,[bx,by,bz]);
  if(s4>0.001) g.seg(A,V3.lerp(A,B,s4),RED,2.4);
  g.pt(A,null,INK,0,0,4.2); mixLabel(A,P('A','1'),INK,-10,18,15,'left');
  if(s3>0.98){ g.pt(B,null,INK,0,0,4.2); mixLabel(B,P('B','2'),INK,8,-14,15,'left'); }
  if(v>0.001&&v<3) g.pt(p,null,RED,0,0,4.2);
  /* 버튼 결과 */
  if(v>=4&&!st.done1){ st.done1=true; $('bAB').classList.add('done'); $('bAB').classList.remove('on'); $('bAB').innerHTML='<span class="ov">AB</span>'; geoTask('dist-ab'); }
  if(st.w>=1.3&&!st.done2){ st.done2=true; $('bRt').classList.add('done'); $('bRt').classList.remove('on');
    $('bRt').innerHTML='<span class="sq2">√<span class="r">(<i>x</i><sub>2</sub> − <i>x</i><sub>1</sub>)<sup>2</sup> + (<i>y</i><sub>2</sub> − <i>y</i><sub>1</sub>)<sup>2</sup> + (<i>z</i><sub>2</sub> − <i>z</i><sub>1</sub>)<sup>2</sup></span></span>'; geoTask('dist-root'); }
}
g.loop(dt=>{ g.clear(); camStep(dt); step(dt); draw(); });
</script>
