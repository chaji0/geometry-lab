<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 드론쇼 제작소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0FF; --card:#FFFFFF; --ink:#2B2A4A; --sub:#6E6A94; --line:#E1DBF7; --line2:#CFC6F2;
  --acc:#7B6CF6; --acc2:#5E4FE0; --tint:#EEEAFE; --pink:#FF8FC0; --mint:#3FCFA6; --butter:#FFD25E;
  --red:#EE4B67; --grn:#1FA478;
  --hand:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1A1934;--card:#24234A;--ink:#EDEBFF;--sub:#ABA6D6;--line:#38366A;--line2:#4A4785;--tint:#2E2C5C;--acc:#9A8CFF;--acc2:#B3A8FF}
}
:root[data-theme="dark"]{--bg:#1A1934;--card:#24234A;--ink:#EDEBFF;--sub:#ABA6D6;--line:#38366A;--line2:#4A4785;--tint:#2E2C5C;--acc:#9A8CFF;--acc2:#B3A8FF}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;letter-spacing:.01em}
.rm{font-family:Georgia,'Times New Roman',serif;font-style:normal;font-weight:700}
.rm sub,sub.s{font-family:Georgia,serif;font-style:normal;font-size:.72em}

#app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 16px 4px;flex-wrap:wrap}
header h1{font-family:var(--hand);font-weight:400;font-size:24px;margin:0;letter-spacing:-.01em}
header .sp{flex:1}
.modes{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;border-radius:999px;padding:5px 16px;font-family:var(--hand);font-size:16px;color:var(--sub)}
.modes button.on{background:var(--acc);color:#fff}
.pill{border:2px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700}
.pill:hover{border-color:var(--acc)}
.pill.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.pill.pri:hover{background:var(--acc2);border-color:var(--acc2)}
.pill.big{font-family:var(--hand);font-weight:400;font-size:20px;padding:8px 24px}
.pill.pink{background:#FF8FC0;border-color:#FF8FC0;color:#2B1234}
.pill:disabled{opacity:.45;cursor:not-allowed}

#steps{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:thin}
.st{flex:none;display:flex;align-items:center;gap:7px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px 5px 6px;font-weight:700;font-size:14px;color:var(--sub)}
.st .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--acc);font-family:var(--hand);font-size:14px}
.st.done .n{background:var(--mint);color:#fff}
.st.on{border-color:var(--acc);color:var(--ink);background:var(--tint)}
.st.on .n{background:var(--acc);color:#fff}
.st.static{cursor:default}

main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;min-height:0;padding:0 14px 14px}
#stage{position:relative;min-height:0;border-radius:26px;overflow:hidden;background:#1A1D4A;touch-action:none;box-shadow:0 0 0 3px var(--line) inset}
#cv{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:grab}
#cv:active{cursor:grabbing}
.vbtns{position:absolute;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vbtns button{border:1.5px solid rgba(255,255,255,.28);background:rgba(20,18,60,.45);color:#fff;border-radius:999px;padding:4px 11px;font-size:13px;backdrop-filter:blur(4px)}
.vbtns button[aria-pressed="true"]{background:rgba(255,255,255,.22)}
.hint{position:absolute;left:14px;bottom:12px;color:rgba(255,255,255,.6);font-size:12.5px;pointer-events:none}
#pbar{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:center;gap:8px;background:rgba(20,18,60,.6);backdrop-filter:blur(4px);border-radius:999px;padding:6px 8px 6px 10px;color:#fff;z-index:3}
#pbar .tl{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;min-width:60px}
#pfill{height:100%;width:0;background:linear-gradient(90deg,#FF8FC0,#FFD95E,#86C8FF);border-radius:9px}
#pphase{font-family:var(--hand);font-size:15px;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar button{border:0;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;padding:3px 11px;font-size:13.5px}
#pbar button.rec{background:#EE4B67}
#recDot{display:none;position:absolute;top:14px;left:16px;color:#fff;font-weight:700;background:#EE4B67;border-radius:999px;padding:3px 12px;z-index:3}
body.recording #recDot{display:block}

#panel{overflow-y:auto;min-height:0;padding:2px 4px 96px}
.ph{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.ph .bn{display:grid;place-items:center;min-width:38px;height:38px;padding:0 8px;border-radius:14px;background:var(--acc);color:#fff;font-family:var(--hand);font-size:21px}
.ph h2{font-family:var(--hand);font-weight:400;font-size:24px;margin:0}
.real{background:var(--tint);border-radius:18px;padding:12px 16px;margin-bottom:12px;border-left:5px solid var(--acc)}
.real h3,.try h3{font-family:var(--hand);font-weight:400;font-size:17px;margin:0 0 4px;color:var(--acc)}
.real p{margin:0}
.real p+p{margin-top:6px}
.try{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:12px}
.try h3{color:var(--ink)}
.try p{margin:4px 0 10px}
.field{display:block;margin:0 0 10px}
.field span{display:block;font-weight:700;font-size:14px;margin-bottom:3px}
.field input[type=text],.field input[type=password],.field input[type=number]{width:100%;border:2px solid var(--line2);border-radius:14px;padding:8px 12px;background:var(--bg)}
.field input:focus{border-color:var(--acc);outline:none}
.rangeRow{display:flex;align-items:center;gap:10px;margin:6px 0}
.rangeRow label{min-width:58px;font-weight:700}
.rangeRow input[type=range]{flex:1;accent-color:var(--acc)}
.rangeRow output{min-width:36px;text-align:right;font-family:var(--hand);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:5px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px}
.chip i{display:block;width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.chip.rb i{background:conic-gradient(#FF8FC0,#FFD95E,#5EF0C4,#86C8FF,#B99BFF,#FF8FC0)}
.chip.on{border-color:var(--acc);background:var(--tint)}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line2)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.mini{border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13.5px}
.mini:hover{border-color:var(--acc)}
.cnt{font-family:var(--hand);font-size:17px}
.cnt.ok{color:var(--grn)}
.cnt.over{color:var(--red)}
#ed{display:block;width:100%;aspect-ratio:1/1;border-radius:18px;touch-action:none;margin-top:6px}
.plist{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.plist td{padding:2px 3px;text-align:center}
.plist td:first-child{width:40px}
.plist input{width:100%;max-width:70px;border:1.5px solid var(--line);border-radius:9px;padding:2px 4px;text-align:center;background:var(--bg)}
.plist tr.bad td:first-child{color:var(--red)}
.plist th{font-weight:400;padding-bottom:2px}
.coordIn{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:17px;margin:6px 0}
.coordIn input{width:62px;border:2px solid var(--line2);border-radius:12px;padding:4px 6px;text-align:center;background:var(--bg)}
.fb{border-radius:14px;padding:8px 12px;margin-top:10px;font-weight:700}
.fb.good{background:rgba(31,164,120,.13);color:var(--grn)}
.fb.bad{background:rgba(238,75,103,.12);color:var(--red)}
.fb.info{background:var(--tint);color:var(--ink);font-weight:400}
.dots{display:flex;gap:6px;margin:2px 0 8px}
.dots b{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots b.on{background:var(--butter);box-shadow:0 0 10px var(--butter)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat{background:var(--tint);border-radius:16px;padding:8px 12px}
.stat b{display:block;font-family:var(--hand);font-weight:400;font-size:22px}
.stat span{font-size:13px;color:var(--sub)}
.stat.alert b{color:var(--red)}
.stat.fine b{color:var(--grn)}
ul.chk{list-style:none;padding:0;margin:8px 0}
ul.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1.5px dashed var(--line)}
ul.chk li .mk{flex:none;font-family:var(--hand);font-size:13px;border-radius:999px;padding:1px 9px;margin-top:2px}
ul.chk li.ok .mk{background:rgba(31,164,120,.15);color:var(--grn)}
ul.chk li.no .mk{background:rgba(238,75,103,.14);color:var(--red)}
.stamp{display:inline-block;transform:rotate(-6deg);border:3px solid var(--grn);color:var(--grn);border-radius:14px;padding:4px 14px;font-family:var(--hand);font-size:22px;margin:6px 0}
.timer{font-family:var(--hand);font-size:42px;line-height:1;text-align:center;margin:4px 0 6px}
.timer.low{color:var(--red)}
.prog{height:12px;border-radius:9px;background:var(--tint);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#FF8FC0,#FFD95E,#5EF0C4);border-radius:9px;transition:width .4s}
.rank{font-family:var(--hand);font-size:28px;color:var(--acc);text-align:center;margin:6px 0}
.roster{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.roster td,.roster th{padding:4px 6px;border-bottom:1.5px solid var(--line);text-align:left}
.roster th{font-weight:400;color:var(--sub)}
.tag{display:inline-block;border-radius:999px;padding:0 8px;font-size:12px;background:var(--tint)}
.tag.g{background:rgba(31,164,120,.15);color:var(--grn)}
.tag.r{background:rgba(238,75,103,.14);color:var(--red)}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(20,18,50,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:var(--card);border-radius:24px;padding:18px 20px;width:min(560px,100%);max-height:90vh;overflow:auto}
.modal h3{font-family:var(--hand);font-weight:400;font-size:22px;margin:0 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

/* 공연 모드 */
#showCtl{display:none}
body.showmode header,body.showmode #steps,body.showmode #panel,body.showmode .hint{display:none}
body.showmode #app{display:block}
body.showmode main{display:block;padding:0}
body.showmode #stage{position:fixed;inset:0;border-radius:0;box-shadow:none;z-index:10}
body.showmode #showCtl{display:flex;gap:8px;position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:4}
#showCtl button{border:0;border-radius:999px;padding:6px 14px;font-weight:700;background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(4px)}
#showEnd{display:none}
body.showmode #showEnd.on{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);color:#2B2A4A;border-radius:26px;padding:20px 26px;min-width:280px;max-width:92vw;max-height:80vh;overflow:auto;text-align:center;z-index:5}
#showEnd h3{font-family:var(--hand);font-weight:400;font-size:24px;margin:0 0 8px}
#showEnd .stat{background:#EEEAFE}
#showEnd .stat span{color:#6E6A94}

@media (max-width:980px){
  #app{display:block;height:auto}
  main{display:block;padding:0 10px 10px}
  #stage{height:54vh;min-height:320px}
  #panel{overflow:visible;padding:14px 2px 96px}
  header h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg width="48" height="36" viewBox="0 0 64 48" aria-hidden="true">
      <ellipse cx="14" cy="9" rx="11" ry="3" fill="#C9C0FF"/>
      <ellipse cx="50" cy="9" rx="11" ry="3" fill="#C9C0FF"/>
      <rect x="13" y="9" width="2.6" height="10" rx="1.3" fill="#8F86D8"/>
      <rect x="48.4" y="9" width="2.6" height="10" rx="1.3" fill="#8F86D8"/>
      <rect x="11" y="15" width="42" height="28" rx="14" fill="#fff" stroke="#8F86D8" stroke-width="2.6"/>
      <circle cx="32" cy="15" r="3.2" fill="#FF8FC0"/>
      <circle cx="25" cy="28" r="2.7" fill="#2B2A4A"/>
      <circle cx="39" cy="28" r="2.7" fill="#2B2A4A"/>
      <ellipse cx="20" cy="33" rx="3.4" ry="2" fill="#FFB8D6"/>
      <ellipse cx="44" cy="33" rx="3.4" ry="2" fill="#FFB8D6"/>
      <path d="M28.5 33 q3.5 3 7 0" fill="none" stroke="#2B2A4A" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>우리 반 드론쇼 제작소</h1>
    <div class="modes" role="tablist"><button id="mLearn" role="tab">원리 공부</button><button id="mClass" role="tab">우리 반 공연</button></div>
    <div class="sp"></div>
    <button class="pill" id="bTeacher">선생님</button>
  </header>
  <nav id="steps" aria-label="단계"></nav>
  <main>
    <div id="stage">
      <canvas id="cv" aria-label="밤하늘 3D 공연장"></canvas>
      <div class="vbtns">
        <button data-v="book">교과서 시점</button><button data-v="front">관객 시점</button><button data-v="side">옆</button><button data-v="top">위</button>
        <button id="bLab" aria-pressed="true">이름</button>
      </div>
      <div class="hint">끌어서 돌리고, 휠이나 두 손가락으로 확대</div>
      <div id="recDot">녹화 중</div>
      <div id="pbar" hidden><button id="bPlay">일시정지</button><button id="bSpeed">1배속</button><div class="tl"><div id="pfill"></div></div><span id="pphase"></span><button id="bStop">닫기</button></div>
      <div id="showCtl"><button id="bShowExit">나가기</button><button id="bShowPlay">처음부터</button><button id="bShowRec">녹화하며 공연</button></div>
      <div id="showEnd"></div>
    </div>
    <section id="panel"></section>
  </main>
</div>
<div id="tm" class="modal" hidden><div class="box" id="tmBox"></div></div>
<div id="toast" role="status"></div>

<script>
/* 드론쇼 서버(Apps Script 웹 앱) 주소. 비워 두면 이 기기 안에서만 도는 체험 모드가 된다. */
const DS_API = '';
</script>
<script>
/* ===== 드론쇼 방 관리 로직 (Apps Script 와 미리보기가 같은 코드를 쓴다) ===== */
function dsCore(db, q, now) {
  q = q || {};
  var A = String(q.action || '');
  var room = String(q.room || '').replace(/\s+/g, '').slice(0, 12);
  function str(v, n) { return String(v == null ? '' : v).replace(/[<>]/g, '').trim().slice(0, n); }
  function cint(v, a, b, d) { v = Math.round(+v); return isFinite(v) ? Math.max(a, Math.min(b, v)) : d; }
  function cnum(v, a, b, d) { v = +v; return isFinite(v) ? Math.max(a, Math.min(b, Math.round(v * 10) / 10)) : d; }
  function cleanPts(arr, F) {
    if (!arr || !arr.length) return [];
    var out = [];
    for (var i = 0; i < arr.length && out.length < F; i++) {
      var p = arr[i]; if (!p || p.length < 3) continue;
      out.push([cnum(p[0], -8, 8, 0), cnum(p[1], -12, 12, 0), cnum(p[2], 5, 40, 20)]);
    }
    return out;
  }
  function cleanSrc(arr, m) {
    if (!arr || !arr.length || arr.length !== m) return null;
    var out = [];
    for (var i = 0; i < m; i++) out.push(cint(arr[i], -1, 99, -1));
    return out;
  }
  function cleanColor(c) { c = String(c || ''); return (c === 'rainbow' || /^#[0-9a-fA-F]{6}$/.test(c)) ? c : '#FF8FC0'; }
  var rk = 'R|' + room;
  function list() { return db.list('S|' + room + '|'); }
  function save(r) { r.ver = (r.ver || 0) + 1; db.set(rk, r); }
  function pub(r, full) {
    var L = list().map(function (s) {
      var o = { uid: s.uid, name: s.name, rank: s.rank || 0, od: !!s.od };
      if (s.rank) { o.title = s.title; o.color = s.color; o.n = (s.pts || []).length; }
      if (full) { o.pts = s.pts || []; o.src = s.src || null; }
      return o;
    });
    return { ok: true, now: now, ver: r.ver, full: !!full,
      room: { code: room, title: r.title, n: r.n, F: r.F, min: r.min, phase: r.phase, startAt: r.startAt || 0, d: r.d || 3 },
      list: L };
  }
  function me() {
    var sid = str(q.sid, 40); if (!sid) return null;
    var uid = db.get('U|' + room + '|' + sid);
    if (!uid || uid !== q.uid) return null;
    return db.get('S|' + room + '|' + uid);
  }
  if (A === 'ping') return { ok: true, now: now };
  if (!room) return { ok: false, err: 'room' };

  if (A === 'tcreate') {
    if (!db.checkKey(q.key)) return { ok: false, err: 'key' };
    db.delPrefix('S|' + room + '|'); db.delPrefix('U|' + room + '|');
    var nr = { title: str(q.title, 24) || '우리 반 드론쇼', n: cint(q.n, 1, 60, 30), F: cint(q.F, 6, 40, 30),
      min: cint(q.min, 1, 60, 10), phase: 'wait', startAt: 0, d: 3, ranks: 0, ver: 0 };
    save(nr); return pub(nr, true);
  }
  var r = db.get(rk);
  if (!r) return { ok: false, err: 'noroom' };

  if (A === 'state') {
    if (q.ver && +q.ver === r.ver && (!q.full || q.hadFull)) return { ok: true, same: true, ver: r.ver, now: now };
    return pub(r, !!q.full);
  }
  if (A === 'tphase') {
    if (!db.checkKey(q.key)) return { ok: false, err: 'key' };
    var ph = String(q.phase);
    if (['wait', 'draw', 'order', 'show'].indexOf(ph) < 0) return { ok: false, err: 'phase' };
    r.phase = ph;
    if (ph === 'draw' && (!r.startAt || q.restart)) r.startAt = now;
    save(r); return pub(r, true);
  }
  if (A === 'tkick') {
    if (!db.checkKey(q.key)) return { ok: false, err: 'key' };
    var all = list();
    for (var i = 0; i < all.length; i++) if (all[i].uid === q.target) db.del('S|' + room + '|' + all[i].uid);
    save(r); return pub(r, true);
  }
  if (A === 'tbot') {

let PB=null,showMode=false;
function startPlay(C,opt){opt=opt||{};const nT=C.trans.length;const ev=[];
  C.trans.forEach((tr,k)=>{const F=tr.A.length;for(let i=0;i<F;i++)for(let j=i+1;j<F;j++){const q=pairMin(tr.A[i],tr.B[i],tr.A[j],tr.B[j]);if(q.d<CRASH)ev.push({t:T0+k*(MOVE+HOLD)+invEase(q.s)*MOVE,i,j,k})}});
  ev.sort((x,y)=>x.t-y.t);
  PB={C,nT,ev,ei:0,crash:{},crashes:[],sparks:[],t:0,running:true,speed:1,end:T0+(nT-1)*(MOVE+HOLD)+MOVE+1.2,title:opt.title||'',onEnd:opt.onEnd||null,minLive:Infinity,dangerK:new Set()};
  $('#pbar').hidden=false;$('#bPlay').textContent='일시정지';$('#bSpeed').textContent='1배속';$('#showEnd').classList.remove('on');dirty=true}

function tIdx(t){if(t<T0)return{k:0,u:0};const k=Math.floor((t-T0)/(MOVE+HOLD));if(k>=PB.nT)return{k:PB.nT-1,u:1};return{k,u:Math.min(1,(t-T0-k*(MOVE+HOLD))/MOVE)}}
function rawPos(i,t){const {k,u}=tIdx(t);const tr=PB.C.trans[k];return lerp(tr.A[i],tr.B[i],ease(u))}
function posAt(i,t){const c=PB.crash[i];if(c&&t>=c.t){const dt=t-c.t;return{x:c.p.x,y:c.p.y,z:Math.max(0,c.p.z-4.9*dt*dt)}}return rawPos(i,t)}
function colAt(i,t){const {k,u}=tIdx(t);const tr=PB.C.trans[k];const e=ease(u);return[mixc(tr.cA[i],tr.cB[i],e),tr.aA[i]+(tr.aB[i]-tr.aA[i])*e]}
function capAt(t){const {k,u}=tIdx(t);const tr=PB.C.trans[k];if(!tr.sc)return{main:'착륙',sub:'',a:1};const total=PB.C.trans.length-1;
  return{main:tr.sc.title||'',sub:(total>1?`${k+1}번째 장면`:'')+(tr.sc.name?(total>1?', ':'')+tr.sc.name:''),a:clamp(u*2,0,1)}}
function tick(dt){if(!PB||!PB.running)return;PB.t+=dt*PB.speed;
  while(PB.ei<PB.ev.length&&PB.ev[PB.ei].t<=PB.t){const e=PB.ev[PB.ei++];if(!PB.crash[e.i]&&!PB.crash[e.j]){const pi=rawPos(e.i,e.t),pj=rawPos(e.j,e.t);PB.crash[e.i]={t:e.t,p:pi};PB.crash[e.j]={t:e.t,p:pj};PB.crashes.push(e);spark(lerp(pi,pj,.5))}}

function spark(p){for(let i=0;i<34;i++){const a=Math.random()*6.28,b=Math.random()*3.14-1.57,v=2+Math.random()*5;PB.sparks.push({p:{...p},v:{x:v*Math.cos(a)*Math.cos(b),y:v*Math.sin(a)*Math.cos(b),z:v*Math.sin(b)+2},life:.7+Math.random()*.8})}}

  else if(step===4){VIEW={kind:'empty'};setCam('fly');

  h+=learnNav();p.innerHTML=h;bindLearn();dirty=true}
function ordStatHTML(){const r=ORD.res,a=ORD.ana;return`<div class="stats"><div class="stat ${a.bad.length?'alert':'fine'}"><span>위험한 짝</span><b>${a.bad.length}쌍</b></div><div class="stat"><span>모두 날아간 거리</span><b>${f1(a.total)} m</b></div>
  <div class="stat"><span>땅에서 떠오르는 드론</span><b>${r.up}대</b></div><div class="stat"><span>땅으로 내려가는 드론</span><b>${r.down}대</b></div></div>`}
function badListHTML(){const a=ORD.ana;const lab=d=>{const j=ORD.res.st.slot[d];return j>=0?PN('P',j+1):'땅으로 가는 드론'};
  return a.bad.length?`<p style="margin:8px 0 0">${a.bad.slice(0,4).map(b=>`${lab(b.i)}, ${lab(b.j)}: ${f2(b.d)} m까지 가까워진다`).join('<br>')}${a.bad.length>4?'<br>그 밖에 '+(a.bad.length-4)+'쌍':''}</p>`:`<div class="fb good">이 장면 바꾸기에서는 모든 드론이 2 m 이상 떨어져 난다.</div>`}
function bindLearn(){const pv=$('#bPrev'),nx=$('#bNext'),tc=$('#bToClass');if(pv)pv.onclick=()=>goLearn(step-1);if(nx)nx.onclick=()=>goLearn(step+1);if(tc)tc.onclick=()=>goClass();

      if(!wrong.length){if(!GM.solved){PR.game=Math.min(3,PR.game+1);savePR()}GM.solved=true;renderLearn();renderSteps();$('#gfb').innerHTML=`<div class="fb good">도착! 별의 좌표는 ${ptH('<b class="rm">S</b>',t)}이다.${PR.game>=3?' 시운전을 모두 통과했다.':''}</div>`}
      else $('#gfb').innerHTML=`<div class="fb bad">아직 별과 떨어져 있다. ${wrong.map(a=>M(a)).join(', ')}좌표를 다시 본다.</div>`};
    const ns=$('#bNextStar');if(ns)ns.onclick=()=>{newTarget();renderLearn()}}
  if(step===1){const ch=()=>{savePR();dirty=true;drawEditor();updList();const c=$('#cnt');c.textContent=`${PF}대 중 ${PR.pts.length}개`;c.classList.toggle('ok',PR.pts.length>=3);renderSteps()};
    initEditor({pts:()=>PR.pts,max:PF,color:()=>PR.color,onChange:ch});bindDrawTools(v=>{PR.pts=v;PR.src=null;ch()},()=>PF);bindChips('pc',c=>{PR.color=c;ch()});ch()}
  if(step===2){$('#iD').oninput=e=>{PR.d=+e.target.value;$('#oD').textContent=PR.d+' m';PR.groundOk=false;const S=spotsFor(PF,PR.d);$('#gA').innerHTML=`${PN('G',1)}의 좌표는 ${ptH('',S[0])}이다. 노랗게 빛나는 ${PN('G',GQ.q+1)}의 좌표를 구한다.`;$('#qfb').innerHTML='';savePR();dirty=true;renderSteps()};

      if(ok){PR.groundOk=true;savePR();renderSteps()}};
    $('#bQn').onclick=()=>{let q;do{q=ri(1,PF-1)}while(q===GQ.q);GQ.q=q;renderLearn()}}
  if(step===3){if(!pracReady()){$('#bGo2').onclick=()=>goLearn(1);$('#bStarEx').onclick=()=>{PR.pts=preset('star',PF);PR.src=null;savePR();renderLearn();renderSteps()};VIEW={kind:'empty'};return}
    VIEW={kind:'order'};setCam('fly');
    const rebuild=()=>{const C=compile(PF,PR.d,pracScenes(),1);buildOrd(C.st,PR.pts,PR.src||naiveSrc(C.st.pts.length,PR.pts.length),PR.color,EX);PR.src=ORD.src;savePR();$('#ordStat').innerHTML=ordStatHTML();$('#badList').innerHTML=badListHTML();drawEditor();dirty=true;renderSteps()};
    initEditor({pts:()=>PR.pts,max:PF,color:()=>PR.color,swap:true,onSwap:(a,b)=>{const s=ORD.src.slice();[s[a],s[b]]=[s[b],s[a]];PR.src=s;rebuild()}});
    $('#bShuf').onclick=()=>{const s=ORD.src.slice();for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}PR.src=s;rebuild()};

    $('#bReh').onclick=()=>{if(!pracReady()){toast('2단계에서 그림을 먼저 그린다');return}const C=compile(PF,PR.d,pracScenes());setCam('fly');
      startPlay(C,{onEnd:pb=>{const n=Object.keys(pb.crash).length;$('#report').innerHTML=n?`<div class="fb bad">충돌 ${pb.crashes.length}번, 드론 ${n}대가 떨어졌다. 4단계에서 순서를 고친다.</div>`:pb.minLive<MIN?`<div class="fb bad">부딪히지는 않았지만 2 m보다 가까워진 순간이 있었다.</div>`:`<div class="fb good">모든 드론이 무사히 착륙했다. 이제 우리 반 공연을 준비한다.</div>`}});
      $('#report').innerHTML='<p>리허설 중이다. 빨간 고리는 2 m보다 가까워진 드론이다.</p>'}}}

/* ======================= 우리 반 공연 ======================= */
const CL=Object.assign({room:'',sid:'',name:'',uid:'',viewer:false,draft:{pts:[],title:'',color:'#FF8FC0'},src:null,srcFor:''},lsGet('dsClass')||{});
if(!CL.sid){let s='';try{s=localStorage.getItem('geoSid')||''}catch(e){}CL.sid=s||('d'+Math.random().toString(36).slice(2,10))}
if(!CL.name){try{CL.name=localStorage.getItem('geoName')||''}catch(e){}}
CL.data=null;CL.ver=0;CL.full=false;CL.off=0;
function saveCL(){const {data,ver,full,off,...rest}=CL;lsSet('dsClass',rest)}
const localDB={allowBots:true,checkKey:k=>!!k,
  get(k){try{const v=localStorage.getItem('dsL|'+k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,o){try{localStorage.setItem('dsL|'+k,JSON.stringify(o))}catch(e){}},
  del(k){try{localStorage.removeItem('dsL|'+k)}catch(e){}},
  list(p){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('dsL|'+p)===0){try{out.push(JSON.parse(localStorage.getItem(k)))}catch(e){}}}}catch(e){}return out},
  delPrefix(p){try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('dsL|'+p)===0)ks.push(k)}ks.forEach(k=>localStorage.removeItem(k))}catch(e){}}};
const LOCAL=!DS_API;
async function api(q){if(LOCAL)return dsCore(localDB,q,Date.now());
  const r=await fetch(DS_API,{method:'POST',body:JSON.stringify(q)});return await r.json()}
function phase(){return CL.data?CL.data.room.phase:''}
function ranked(){if(!CL.data)return[];return CL.data.list.filter(s=>s.rank).sort((a,b)=>a.rank-b.rank)}
function meRec(){if(!CL.data||!CL.uid)return null;return CL.data.list.find(s=>s.uid===CL.uid)||null}
function toPts(arr){return(arr||[]).map(p=>({x:+p[0],y:+p[1],z:+p[2]}))}
function fromPts(P){return P.map(p=>[num(p.x),num(p.y),num(p.z)])}
function classScenes(){return ranked().map(s=>({pts:toPts(s.pts),src:s.src,color:s.color,title:s.title,name:s.name,uid:s.uid}))}
function applyData(res){if(!res||!res.ok){if(res&&res.err==='noroom'){CL.data=null;toast('그 방이 없다. 방 코드를 확인한다')}return false}
  if(res.now)CL.off=res.now-Date.now();if(res.same)return false;const oldPh=phase(),oldVer=CL.ver;CL.data={room:res.room,list:res.list};CL.ver=res.ver;CL.full=!!res.full;if(res.me){CL.uid=res.me;saveCL()}
  return{phaseChanged:oldPh!==res.room.phase,changed:oldVer!==res.ver}}
let pollT=null,polling=false;
async function poll(){clearTimeout(pollT);if(MODE!=='class'||!CL.room){pollT=setTimeout(poll,1500);return}
  if(polling)return;polling=true;const wantFull=['order','show'].includes(phase())||CL.viewer;
  let ch=null,wasFull=CL.full;try{const res=await api({action:'state',room:CL.room,ver:CL.ver,full:wantFull,hadFull:CL.full});const had=!!CL.data;ch=applyData(res);if(had&&!CL.data)ch={phaseChanged:true}}catch(e){}
  polling=false;
  if(ch){if(ch.phaseChanged||(!wasFull&&CL.full&&!CL.viewer))renderClass();else liveUpdate();if(['order','show'].includes(phase())&&!CL.full){pollT=setTimeout(poll,50);return}}pollT=setTimeout(poll,LOCAL?1000:4000+Math.random()*1500)}
window.addEventListener('storage',e=>{if(LOCAL&&e.key&&e.key.indexOf('dsL|')===0&&MODE==='class'){clearTimeout(pollT);pollT=setTimeout(poll,120)}});
function goClass(){MODE='class';stopPlay();renderModes();renderSteps();renderClass();poll()}
function progHTML(done,total,label){return`<div class="row" style="justify-content:space-between;margin:2px 0"><span>${label}</span><b class="cnt">${done} / ${total}명</b></div><div class="prog"><i style="width:${Math.min(100,done/Math.max(1,total)*100)}%"></i></div>`}

  if(!CL.room||!CL.data){VIEW={kind:'empty'};setCam('fly');
    p.innerHTML=head('','우리 반 공연').replace('<span class="bn"></span>','')+`<div class="real"><h3>함께 만드는 드론쇼</h3><p>반 친구들이 한 사람씩 장면을 그리고, 먼저 완료한 순서대로 장면이 이어진다. 드론은 모두 같은 함대를 쓴다. 내 장면에 점이 적으면 남는 드론은 땅에서 기다리고, 많으면 땅에 있던 드론이 떠오른다.</p></div>
    <div class="try"><h3>입장하기</h3>${LOCAL?'<div class="fb info" style="margin:0 0 10px">지금은 체험 모드다. 이 기기 안에서만 방이 열린다. 선생님 버튼에서 방을 만들고 가상 학생을 채워 본다.</div>':''}
    <label class="field"><span>방 코드</span><input type="text" id="jRoom" maxlength="12" value="${esc(CL.room)}" placeholder="선생님이 알려 준 코드"></label>
    <label class="field"><span>이름</span><input type="text" id="jName" maxlength="20" value="${esc(CL.name)}"></label>

    $('#bJoin').onclick=async()=>{const room=$('#jRoom').value.replace(/\s+/g,''),name=$('#jName').value.trim();if(!room||!name){toast('방 코드와 이름을 쓴다');return}

    return}
  const ph=phase(),R=CL.data.room;
  if(CL.viewer){renderTeacherPanel();return}

    p.innerHTML=head('',esc(R.title)).replace('<span class="bn"></span>','')+`<div class="try"><h3>${esc(CL.name)}, 입장했다</h3><p>선생님이 작업을 시작하면 장면 그리기가 열린다. 그 전에는 원리 공부에서 연습한다.</p><div id="live"></div>
      <div class="row"><button class="pill" id="bPrac">원리 공부하러 가기</button><button class="mini" id="bLeave">방 나가기</button></div></div>`;
    $('#bPrac').onclick=()=>goLearn(0);$('#bLeave').onclick=leave;liveUpdate();return}
  if(ph==='draw'){renderDraw();return}

  if(ph==='order'&&ORD&&EDS.drag<0)refreshOrder(false);

/* --- 순서 정하기 단계 --- */
let ORDK=-1;
function myIdx(){return ranked().findIndex(s=>s.uid===CL.uid)}
function refreshOrder(resetSrc){const sc=classScenes();const k=myIdx();if(k<0||!CL.full)return;const R=CL.data.room;ORDK=k;
  const d=k===0&&CL.myD!=null?CL.myD:R.d;const C=compile(R.F,d,sc,k);const mine=sc[k];
  let src=resetSrc?null:(CL.src&&CL.srcFor===CL.room+'|'+mine.pts.length?CL.src:null);if(!src)src=mine.src||naiveSrc(C.st.pts.length,mine.pts.length);
  if(k===0)src=new Array(mine.pts.length).fill(-1);
  buildOrd(C.st,mine.pts,src,mine.color,C.prevSc);CL.src=ORD.src;CL.srcFor=CL.room+'|'+mine.pts.length;saveCL();
  const st=$('#ordStat');if(st)st.innerHTML=ordStatHTML();const bl=$('#badList');if(bl)bl.innerHTML=badListHTML();drawEditor();dirty=true}
function renderOrder(){const R=CL.data.room,me=meRec();VIEW={kind:'order'};setCam('fly');
  if(!me||!me.rank){ORD=null;VIEW={kind:'empty'};$('#panel').innerHTML=head('','순서 정하기').replace('<span class="bn"></span>','')+`<div class="try"><p>이번 공연에는 장면을 내지 못했다. 친구들이 순서를 정하는 동안 기다린다.</p><div id="live"></div></div>`;liveUpdate();return}
  if(!CL.full){$('#panel').innerHTML='<p>불러오는 중이다.</p>';CL.ver=0;return}
  const k=myIdx(),L=ranked(),prev=L[k-1];
  $('#panel').innerHTML=head(k+1+'번',k===0?'이륙 배치와 첫 장면':'순서 정하기')+`<div class="try"><div id="live"></div>
    ${k===0?`<p>내가 가장 먼저 완료했다. 그래서 땅 위 드론 배치도 내가 정한다. 간격을 정하면 땅에 있던 드론이 날아올라 내 장면을 만든다.</p>
      <div class="rangeRow"><label for="iD">간격</label><input type="range" id="iD" min="2" max="5" step="0.5" value="${CL.myD!=null?CL.myD:R.d}"><output id="oD">${CL.myD!=null?CL.myD:R.d} m</output></div>`
    :`<p>앞 장면은 ${esc(prev.name)}의 「${esc(prev.title)}」(드론 ${prev.n}대)다. 그 장면에서 내 장면 「${esc(me.title)}」(${me.n}대)으로 바뀐다. 점 하나를 누르고 다른 점을 누르면 두 점에 오는 드론이 바뀐다.</p>`}
    <div id="ordStat"></div><canvas id="ed"></canvas>
    ${k===0?'':'<div class="row"><button class="mini" id="bShuf">순서 섞기</button><button class="pill pri" id="bAuto">가장 짧게 자동 정렬</button></div>'}
    <div id="badList"></div><div class="row" style="margin-top:12px"><button class="pill pink big" id="bOD">${me.od?'다시 완료!':'완료!'}</button></div></div>`;
  initEditor({pts:()=>ORD?ORD.P2:[],max:99,color:()=>ORD?ORD.color:'#fff',swap:k>0,locked:k===0,onSwap:(a,b)=>{const s=ORD.src.slice();[s[a],s[b]]=[s[b],s[a]];CL.src=s;refreshOrder(false)}});
  if(k===0){$('#iD').oninput=e=>{CL.myD=+e.target.value;$('#oD').textContent=CL.myD+' m';refreshOrder(false)}}
  else{$('#bShuf').onclick=()=>{const s=ORD.src.slice();for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}CL.src=s;refreshOrder(false)};
    $('#bAuto').onclick=()=>{CL.src=autoSrc(ORD.st,ORD.P2);refreshOrder(false);toast('날아가는 거리가 가장 짧은 짝으로 바꿨다')}}
  $('#bOD').onclick=async()=>{if(ORD.ana.bad.length&&!confirm(`위험한 짝이 ${ORD.ana.bad.length}쌍 남아 있다. 그래도 완료할까?`))return;
    $('#bOD').disabled=true;try{const q={action:'order',room:CL.room,sid:CL.sid,uid:CL.uid,src:ORD.src};if(k===0)q.d=CL.myD!=null?CL.myD:R.d;
      const res=await api(q);if(res.ok){CL.ver=0;applyData(res);if(phase()==='show')renderClass();else{$('#bOD').textContent='다시 완료!';toast('순서를 완료했다');liveUpdate()}}else toast('완료하지 못했다')}catch(e){toast('서버에 연결하지 못했다')}
    const b=$('#bOD');if(b)b.disabled=false};
  refreshOrder(false);liveUpdate()}

/* --- 공연 단계 --- */
function classCompile(){const R=CL.data.room;return compile(R.F,R.d,classScenes())}
function showSummary(C){const out=[];C.trans.forEach((t,k)=>{const a=analyze(t.A,t.B);if(a.bad.length)out.push({k,a,sc:t.sc})});return out}
function renderShow(){VIEW={kind:'empty'};setCam('show');const R=CL.data.room;
  if(!CL.full){$('#panel').innerHTML='<p>불러오는 중이다.</p>';CL.ver=0;return}
  const me=meRec();
  $('#panel').innerHTML=head('',esc(R.title)).replace('<span class="bn"></span>','')+`<div class="try"><p>모두가 완료했다. 우리 반 드론쇼를 본다.</p>
    <div class="row"><button class="pill pri big" id="bWatch">공연 보기</button><button class="pill" id="bFull">전체 화면으로</button></div><div id="showInfo"></div>
    ${me&&me.rank?'<div class="row"><button class="mini" id="bFix">내 순서 다시 고치기</button></div>':''}</div>`;
  $('#bWatch').onclick=()=>{setCam('show');startPlay(classCompile(),{title:R.title})};
  $('#bFull').onclick=()=>enterShow();const fx=$('#bFix');if(fx)fx.onclick=()=>{renderOrder()};
  updShowInfo()}
function updShowInfo(){const el=$('#showInfo');if(!el||!CL.data||!CL.full)return;const C=classCompile();const bad=showSummary(C);const L=ranked();
  el.innerHTML=`<div class="stats"><div class="stat"><span>장면</span><b>${L.length}개</b></div><div class="stat"><span>공연 시간</span><b>${Math.round(T0+(C.trans.length-1)*(MOVE+HOLD)+MOVE)}초</b></div></div>`+
    (bad.length?`<div class="fb bad">위험한 장면 바꾸기가 ${bad.length}곳 있다.<br>${bad.slice(0,6).map(b=>b.sc?`${b.k+1}번째 장면 ${esc(b.sc.name)}: ${b.a.bad.length}쌍`:`마지막 착륙: ${b.a.bad.length}쌍`).join('<br>')}</div>`:`<div class="fb good">모든 장면 바꾸기에서 드론이 2 m 이상 떨어져 난다.</div>`)}

/* --- 공연 모드(전체 화면) --- */
function enterShow(){if(MODE!=='class'||!CL.data||!CL.full||!ranked().length){toast('공연할 장면이 아직 없다');return}
  showMode=true;document.body.classList.add('showmode');$('#showEnd').classList.remove('on');camT={...CAMS.show};resize();
  setTimeout(()=>{startPlay(classCompile(),{title:CL.data.room.title,onEnd:showEnded})},400)}
function showEnded(pb){const n=Object.keys(pb.crash).length;
  $('#showEnd').innerHTML=`<h3>${n?'드론 '+n+'대가 떨어졌다':'무사히 착륙했다'}</h3><div class="stats"><div class="stat"><span>장면</span><b>${pb.C.trans.length-1}개</b></div><div class="stat ${n?'alert':'fine'}"><span>충돌</span><b>${pb.crashes.length}번</b></div></div>`;
  $('#showEnd').classList.add('on')}
function exitShow(){showMode=false;document.body.classList.remove('showmode');stopPlay();$('#showEnd').classList.remove('on');resize();setCam('show')}
$('#bShowExit').onclick=exitShow;
$('#bShowPlay').onclick=()=>{if(!CL.data)return;$('#showEnd').classList.remove('on');startPlay(classCompile(),{title:CL.data.room.title,onEnd:showEnded})};
$('#bShowRec').onclick=()=>{if(!CL.data)return;$('#showEnd').classList.remove('on');camT=null;Object.assign(cam,CAMS.show);startPlay(classCompile(),{title:CL.data.room.title,onEnd:showEnded});startRec()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&showMode)exitShow()});

/* ======================= 선생님 ======================= */
let TKEY='';try{TKEY=sessionStorage.getItem('dsTKey')||''}catch(e){}
function openTeacher(){const m=$('#tm');m.hidden=false;const R=CL.data&&CL.viewer?CL.data.room:null;
  $('#tmBox').innerHTML=`<h3>선생님 메뉴</h3>
   ${LOCAL?'<div class="fb info" style="margin:0 0 10px">체험 모드다. 서버 없이 이 기기 안에서만 방이 열린다. 비밀번호는 아무 글자나 쓴다.</div>':''}
   <label class="field"><span>선생님 비밀번호</span><input type="password" id="tKey" value="${esc(TKEY)}"></label>
   <div class="grid2"><label class="field"><span>방 코드</span><input type="text" id="tRoom" maxlength="12" value="${esc(CL.room||'')}" placeholder="예: 2-3"></label>
   <label class="field"><span>공연 제목</span><input type="text" id="tTitle" maxlength="24" value="${esc(R?R.title:'우리 반 드론쇼')}"></label>
   <label class="field"><span>학생 수</span><input type="number" id="tN" min="1" max="60" value="${R?R.n:30}"></label>
   <label class="field"><span>드론 수</span><input type="number" id="tF" min="6" max="40" value="${R?R.F:30}"></label></div>
   <div class="row"><button class="pill pri" id="tCreate">새 방 만들기</button><button class="pill" id="tOpen">이 방 열기</button><button class="pill" id="tClose">닫기</button></div>
   <p style="font-size:13.5px;color:var(--sub);margin:4px 0 0">새 방 만들기를 누르면 같은 코드의 예전 기록이 지워진다.</p>`;
  $('#tClose').onclick=()=>{m.hidden=true};
  const common=()=>{TKEY=$('#tKey').value.trim();try{sessionStorage.setItem('dsTKey',TKEY)}catch(e){}return $('#tRoom').value.replace(/\s+/g,'')};
  $('#tCreate').onclick=async()=>{const room=common();if(!TKEY||!room){toast('비밀번호와 방 코드를 쓴다');return}
    if(!confirm(`방 ${room}을(를) 새로 만든다. 예전 기록은 지워진다.`))return;
    try{const res=await api({action:'tcreate',key:TKEY,room,title:$('#tTitle').value,n:+$('#tN').value,F:+$('#tF').value,min:10});
      if(res.ok){CL.room=room;CL.viewer=true;CL.ver=0;applyData(res);saveCL();m.hidden=true;goClass()}else toast(res.err==='key'?'비밀번호가 틀렸다':'방을 만들지 못했다')}catch(e){toast('서버에 연결하지 못했다')}};
  $('#tOpen').onclick=async()=>{const room=common();if(!room)return;try{const res=await api({action:'state',room,full:true});if(res.ok){CL.room=room;CL.viewer=true;CL.ver=0;applyData(res);saveCL();m.hidden=true;goClass()}else toast('그 방이 없다')}catch(e){toast('서버에 연결하지 못했다')}}}
$('#bTeacher').onclick=openTeacher;
async function tAct(q){q.key=TKEY;q.room=CL.room;try{const res=await api(q);if(res.ok){CL.ver=0;const ch=applyData(res);renderClass()}else toast(res.err==='key'?'비밀번호가 틀렸다. 선생님 메뉴에서 다시 쓴다':'실패했다')}catch(e){toast('서버에 연결하지 못했다')}}
function renderTeacherPanel(){const R=CL.data.room,ph=R.phase;VIEW={kind:'empty'};setCam('show');
  const PHN={wait:'입장 대기',draw:'장면 그리기',order:'순서 정하기',show:'공연'};
  $('#panel').innerHTML=head('',esc(R.title)).replace('<span class="bn"></span>','')+`<div class="try"><h3>방 ${esc(R.code)} 진행</h3>
    <p>학생 ${R.n}명, 드론 ${R.F}대. 지금 단계는 <b>${PHN[ph]}</b>이다.</p><div id="live"></div>
    <div class="row">${ph==='wait'?'<button class="pill pink big" id="tDraw">작업 시작</button>':''}${ph==='draw'?'<button class="pill pri" id="tOrder">마감하고 순서 정하기로</button>':''}
    ${ph==='order'?'<button class="pill pri" id="tShow">마감하고 공연으로</button>':''}${ph==='show'?'<button class="pill pink big" id="tFull">전체 화면 공연</button><button class="pill" id="tRec">녹화하며 공연</button>':''}</div>
    ${ph!=='wait'&&ph!=='draw'?'<div class="row"><button class="pill" id="tWatch">여기서 미리 보기</button></div>':''}
    ${LOCAL?'<div class="row"><button class="mini" id="tBots">가상 학생 채우기</button></div>':''}
    <div class="row"><button class="mini" id="tBack">한 단계 되돌리기</button><button class="mini" id="tLeave">진행 화면 닫기</button></div>
    <table class="roster" id="roster"></table></div>`;
  const b=id=>$(id);
  if(b('#tDraw'))b('#tDraw').onclick=()=>tAct({action:'tphase',phase:'draw',restart:1});
  if(b('#tOrder'))b('#tOrder').onclick=()=>{const L=CL.data.list;const nd=L.filter(s=>!s.rank).length;if(nd&&!confirm(`아직 완료하지 않은 학생이 ${nd}명 있다. 그 학생들은 장면 없이 넘어간다.`))return;tAct({action:'tphase',phase:'order'})};
  if(b('#tShow'))b('#tShow').onclick=()=>{const nd=ranked().filter(s=>!s.od).length;if(nd&&!confirm(`순서를 완료하지 않은 학생이 ${nd}명 있다. 그 장면은 자동 정렬로 이어진다.`))return;tAct({action:'tphase',phase:'show'})};
  if(b('#tFull'))b('#tFull').onclick=()=>enterShow();
  if(b('#tRec'))b('#tRec').onclick=()=>{enterShow();setTimeout(()=>{startRec()},450)};
  if(b('#tWatch'))b('#tWatch').onclick=()=>{if(!ranked().length){toast('장면이 아직 없다');return}setCam('show');startPlay(classCompile(),{title:R.title})};
  if(b('#tBots'))b('#tBots').onclick=()=>tAct({action:'tbot',bots:makeBots(R)});
  b('#tBack').onclick=()=>{const order=['wait','draw','order','show'];const i=order.indexOf(ph);if(i>0&&confirm(`${PHN[order[i-1]]} 단계로 되돌린다`))tAct({action:'tphase',phase:order[i-1]})};
  b('#tLeave').onclick=()=>{CL.viewer=false;CL.room='';CL.data=null;saveCL();renderClass()};
  liveUpdate()}
function updTeacherRoster(){const t=$('#roster');if(!t||!CL.data)return;const L=CL.data.list.slice().sort((a,b)=>(a.rank||999)-(b.rank||999)||a.name.localeCompare(b.name));
  t.innerHTML=`<tr><th>순서</th><th>이름</th><th>장면</th><th>상태</th></tr>`+L.map(s=>`<tr><td>${s.rank||'-'}</td><td>${esc(s.name)}</td><td>${s.rank?esc(s.title)+' ('+s.n+'대)':''}</td><td>${s.od?'<span class="tag g">순서 완료</span>':s.rank?'<span class="tag">장면 완료</span>':'<span class="tag r">작업 중</span>'}</td></tr>`).join('')}
const BOTN=['가온','나래','다온','라희','마루','바다','사랑','아라','자람','차미','하늘','한결','누리','보람','새봄','소율','예준','윤슬','이든','지안','채원','태오','하람','해솔','도윤','서아','시우','은호','주아','하린'];
function makeBots(R){const out=[];const kinds=['heart','star','circle','smile','wave','spiral'];
  for(let i=0;i<60;i++){const kd=kinds[i%kinds.length];const n=ri(Math.min(8,R.F),R.F);out.push({name:BOTN[i%BOTN.length]+(i>=BOTN.length?(i/BOTN.length|0)+1:''),title:{heart:'두근두근 하트',star:'반짝 별',circle:'둥근 달',smile:'웃는 얼굴',wave:'파도',spiral:'회오리'}[kd],color:COLORS[ri(0,COLORS.length-1)][1],pts:fromPts(preset(kd,n))})}return out}

/* ---------- 시작 ---------- */
$('#mLearn').onclick=()=>goLearn(step);
$('#mClass').onclick=()=>goClass();
renderModes();renderSteps();
if(CL.room){goClass()}else{goLearn(0)}
resize();requestAnimationFrame(loop);
})();
</script>
</body>
