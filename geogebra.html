<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* 입장 가드 */
if (localStorage.getItem('geoAppOk') !== '1') location.replace('index.html');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="기하">
<title>지오지브라</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    background:#f1f5fb; color:#1e293b; display:flex; flex-direction:column;
  }
  header {
    padding:8px 14px; background:#fff; border-bottom:1px solid #e2e8f0;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  header h1 { font-size:17px; color:#0f172a; margin-right:4px; }
  header h1 a { text-decoration:none; }
  .apps { display:flex; gap:6px; flex-wrap:wrap; }
  .apps button {
    padding:7px 12px; font-size:13px; font-weight:700; border-radius:9px; cursor:pointer;
    border:1.5px solid #cbd5e1; background:#fff; color:#475569; transition:all .12s;
  }
  .apps button:hover { border-color:#8b5cf6; color:#6d28d9; }
  .apps button.on { background:#8b5cf6; border-color:#8b5cf6; color:#fff; }
  #ggbWrap { flex:1; min-height:0; position:relative; }
  #ggb { width:100%; height:100%; }
  #loading, #failed {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; text-align:center;
    color:#64748b; font-size:14.5px; line-height:1.8; padding:24px;
  }
  #failed { display:none; }
  .spin {
    width:38px; height:38px; border-radius:50%;
    border:4px solid #e2e8f0; border-top-color:#8b5cf6;
    animation:sp 0.9s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>지오지브라</h1>
  <div class="apps">
    <button data-app="classic"  class="on">클래식</button>
    <button data-app="graphing">그래핑</button>
    <button data-app="geometry">기하</button>
    <button data-app="3d">3D 계산기</button>
  </div>
</header>

<div id="ggbWrap">
  <div id="ggb"></div>
  <div id="loading"><div class="spin"></div>지오지브라를 불러오는 중이에요…</div>
  <div id="failed">
    😢 지오지브라를 불러오지 못했어요.<br>
    와이파이(인터넷) 연결을 확인하고 새로고침 해주세요.<br>
    <span style="font-size:12.5px;color:#94a3b8">(지오지브라는 인터넷이 연결되어 있어야 실행됩니다)</span>
  </div>
</div>

<script>
'use strict';
/* ── 선생님 설정 ──
   특정 지오지브라 자료를 바로 열고 싶으면 index.html의 MATERIALS에서
   href를 "geogebra.html?id=자료ID" 로 걸면 됩니다.
   (자료ID = geogebra.org/m/XXXXX 주소의 XXXXX 부분)
   기본 앱 지정도 가능: "geogebra.html?app=3d"                       */
const params = new URLSearchParams(location.search);
const materialId = params.get('id') || '';
let appName = params.get('app') || 'classic';
if(appName==='3d') appName='3d';

const wrap = document.getElementById('ggbWrap');
const loading = document.getElementById('loading');
const failed = document.getElementById('failed');
let api = null;

function boot(){
  document.getElementById('ggb').innerHTML='';
  loading.style.display='flex'; failed.style.display='none';
  const cfg = {
    appName: appName==='3d' ? '3d' : appName,
    width:  wrap.clientWidth,
    height: wrap.clientHeight,
    language:'ko',
    showToolBar:true, showAlgebraInput:true, showMenuBar:true,
    allowStyleBar:true, enableFileFeatures:false, borderColor:'#e2e8f0',
    appletOnLoad: () => { loading.style.display='none'; if(window.GEO_task) GEO_task('open'); },
    scaleContainerClass:'noscale'
  };
  if(materialId) cfg.material_id = materialId;
  try{
    const app = new GGBApplet(cfg, true);
    app.inject('ggb');
  }catch(e){
    loading.style.display='none'; failed.style.display='flex';
  }
}

// deployggb.js 동적 로드 (실패 시 안내)
const s = document.createElement('script');
s.src = 'https://www.geogebra.org/apps/deployggb.js';
s.onload = boot;
s.onerror = () => { loading.style.display='none'; failed.style.display='flex'; };
document.head.appendChild(s);

// 앱 전환 버튼
document.querySelectorAll('.apps button').forEach(b=>{
  if(b.dataset.app===appName) { document.querySelectorAll('.apps button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }
  b.addEventListener('click',()=>{
    document.querySelectorAll('.apps button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    appName=b.dataset.app;
    if(typeof GGBApplet!=='undefined') boot();
  });
});

// 회전/리사이즈 시 다시 맞춤 (0.6초 디바운스)
let rt=null;
window.addEventListener('resize',()=>{
  clearTimeout(rt);
  rt=setTimeout(()=>{ if(typeof GGBApplet!=='undefined') boot(); },600);
});
</script>
<script>window.PAGE_ID="geogebra";</script>
<script src="nav.js"></script>
</body>
</html>
